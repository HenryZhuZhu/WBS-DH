function tableContent(rows,capex,groups){
 const headings=['Workstation / 设备需求','设备类型','子类型／型号','当前阶段','Owner','Module','Area','Sponsor','User','Vendor','Tool Category','Tool count','产地','Total Capex · KCNY','RMID','有价 PO issue date','Hookup 费用 · KCNY','Total Capex · USD$M','Year','Category（新 EC 申请）'];
 return `${['po','noPO'].includes(activeView)?`<div class="column-filter-summary">筛选：${activeView==='po'?'已登记 PO':'尚未登记 PO'}的需求 · ${rows.length} 条 <button class="link" onclick="openView('')">清除筛选</button></div>`:''}${activeView==='risk'?`<div class="column-filter-summary">筛选：尚未备齐的设备 · ${rows.length} 条设备需求</div>`:''}${activeView==='acceptance'?`<div class="notice" style="margin:12px 18px">当前显示 ${rows.length} 条设备需求，共 ${sum(rows,e=>arrived(e)-ready(e))} 件已到货待签字验收。</div>`:''}<div class="summary-strip"><span>设备需求<strong>${rows.length} 条</strong></span><span>供应商<strong>${vendorCount(rows)} 家</strong></span><span>需求数量<strong>${sum(rows,e=>e.count)} 件</strong></span><span>已登记验收<strong>${sum(rows,ready)} 件</strong></span><span>KCNY<strong>${money(capex)}</strong></span><span>USD$M<strong>${money(capex/state.rate/1000,3)}</strong></span></div><div class="table-wrap"><table><thead><tr>${headings.map((heading,index)=>`<th ${index===0?'class="fixed"':''}>${heading}</th>`).join('')}</tr></thead><tbody>${groups.map(group=>{const items=rows.filter(item=>!groupBy||(item[groupBy]||'')===group);return `${groupBy?`<tr><td colspan="20" style="background:#edf3fa;font-weight:600">${esc(groupBy==='user'?userPath(group)||'未填写':group||'未填写')} <span class="muted small"> · ${items.length} 类设备 · ${money(sum(items,item=>item.kcny))} KCNY</span></td></tr>`:''}${items.map(item=>`<tr><td class="fixed"><button class="equipment-name" onclick="openDrawer('${item.id}')">${esc(item.name)}</button><div class="subname">${esc(item.desc)}</div></td>${columnKeys().slice(1).map(key=>`<td>${equipmentTableCell(item,key)}</td>`).join('')}</tr>`).join('')}`}).join('')}</tbody></table>${rows.length?'':'<div class="empty">没有符合条件的设备。<br><button class="link" onclick="openView(\'\')">清除筛选</button></div>'}</div><div class="table-footer"><span>${rows.length} 条需求 · 点击设备名称查看详情；字段可直接编辑</span>${ruleHelp('同一设备需求的费用只计算一次。Hookup 费用单独显示，不自动追加到总投入。')}</div>`;
}
function equipmentTableCell(item,key){if(key==='po')return poDates(item);if(key==='year')return `<select class="inline" aria-label="年份" onchange="inlineEdit('${item.id}','year',this.value)">${years(item.year)}</select>`;if(key==='hookup'||key==='usd')return `<input aria-label="${key==='hookup'?'Hookup KCNY':'USD$M'}" class="inline money" type="number" value="${(key==='hookup'?Number(item.hookup):item.kcny/state.rate/1000).toFixed(3)}" onchange="inlineEdit('${item.id}','${key}',this.value)">`;return editable(item,key,['count','kcny'].includes(key)?'number':'text',({owner:'owners',module:'modules',area:'areas',vendor:'vendors',tool:'tooltypes',category:'categories'})[key]||'')}
function selectOptions(values,current,blank='未填写'){return `<option value="">${esc(blank)}</option>`+distinctValues([...values,current||'']).map(value=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(value)}</option>`).join('')}
function updateMappingFilter(key,value){mappingFilters[key]=value;if(key==='equipmentType')mappingFilters.equipmentModel='';if(key==='user')mappingFilters.userChild='';closeColumnFilter();renderTableOnly()}
function updateMappingPreference(key,value){const options=mappingPreferences();if(['group','split'].includes(key)&&value&&!Object.hasOwn(mappingDimensions,value))return;if(key==='userLevel'&&!['parent','leaf'].includes(value))return;options[key]=value;state.mappingPreferences=options;save();renderTableOnly()}
function equipmentMapping(rows){
 const options=mappingPreferences(),data=aggregateEquipment(rows,options),filtered=!!(search||ownerFilter||statusFilter||activeView||Object.values(mappingFilters).some(Boolean)||Object.keys(columnFilters).length),colors=['#2874cb','#208b78','#c18b23','#a85966','#56718e','#4595b2','#708747','#bd6c39','#345592','#8796a7'];
 const max=Math.max(0,...data.groups.map(group=>group.total)),step=Math.max(1,Math.ceil(max/4)),limit=step*4,chartHeight=210;
 const color=label=>label==='未填写'?'#91a0b1':colors[data.segments.indexOf(label)%colors.length];
 const filterSelect=(key,label,values,disabled=false)=>`<label>${label}<select aria-label="Mapping ${label}" ${disabled?'disabled':''} onchange="updateMappingFilter('${key}',this.value)">${selectOptions(values,mappingFilters[key],'全部')}</select></label>`;
 return `<section class="equipment-mapping"><div class="mapping-header"><div><h2>总设备情况 · Mapping</h2><span class="small muted">${filtered?'当前筛选范围':'全部设备需求'} · ${data.rows} / ${state.equipment.length} 条需求</span></div><div><strong class="mapping-total num">${money(data.total,0)}</strong><span class="muted small">件需求</span></div></div><div class="mapping-options"><label>按什么分组<select aria-label="Mapping 分组维度" onchange="updateMappingPreference('group',this.value)">${Object.entries(mappingDimensions).map(([key,label])=>`<option value="${key}" ${key===options.group?'selected':''}>${label}</option>`).join('')}</select></label><label>柱内细分<select aria-label="Mapping 细分维度" onchange="updateMappingPreference('split',this.value)"><option value="">不细分</option>${Object.entries(mappingDimensions).map(([key,label])=>`<option value="${key}" ${key===options.split?'selected':''}>${label}</option>`).join('')}</select></label>${options.group==='user'||options.split==='user'?`<label>User 层级<select aria-label="Mapping User 层级" onchange="updateMappingPreference('userLevel',this.value)"><option value="parent" ${options.userLevel==='parent'?'selected':''}>一级汇总</option><option value="leaf" ${options.userLevel==='leaf'?'selected':''}>下级明细</option></select></label>`:''}<span class="muted small">统计：Tool count 需求数量</span></div><div class="mapping-options">${filterSelect('equipmentType','设备类型',equipmentTypes())}${filterSelect('equipmentModel','子类型／型号',equipmentModels(mappingFilters.equipmentType),!mappingFilters.equipmentType)}${filterSelect('currentStage','当前阶段',equipmentStages())}${filterSelect('user','User',userRoots())}${filterSelect('userChild','下级 User',userChildren(mappingFilters.user),!mappingFilters.user)}${filtered?'<button class="link small" onclick="openView(\'\')">清除全部筛选</button>':''}</div><figure class="mapping-chart" aria-label="按${mappingDimensions[options.group]}汇总的设备需求数量柱状图"><div class="mapping-legend">${data.segments.map(segment=>`<span><i style="background:${color(segment)}"></i>${esc(segment)}</span>`).join('')}</div>${data.groups.length?`<div class="mapping-plot"><div class="mapping-axis">${Array.from({length:5},(_,index)=>`<span style="bottom:${index*25}%">${step*index}</span>`).join('')}</div><div class="mapping-scroll"><div class="mapping-bars">${data.groups.map(group=>`<div class="mapping-bucket"><div class="mapping-column"><div class="mapping-stack">${group.segments.map(segment=>`<div class="mapping-segment" tabindex="0" aria-label="${esc(group.label+' · '+segment.label+'：需求数量 '+segment.value+' 件')}" title="${esc(group.label+' · '+segment.label+'：需求数量 '+segment.value+' 件')}" data-quantity="${segment.value}" style="height:${segment.value/limit*chartHeight}px;background:${color(segment.label)}">${segment.value/limit*chartHeight>=18?segment.value:''}</div>`).join('')}</div><span class="mapping-number" style="bottom:${group.total/limit*chartHeight}px">${group.total}</span></div><div class="mapping-label">${esc(group.label)}</div></div>`).join('')}</div></div></div>`:'<div class="mapping-empty">当前筛选范围内没有设备需求</div>'}</figure><div class="mapping-note">按每条需求的当前阶段汇总 Tool count；不是实际制造、交付或验收完成数量。未填写类型或阶段的记录仍计入总量。</div></section>`;
}
function editClassification(id,key,value){try{const item=eq(id),changes=setEquipmentClassification(item,key,value);for(const change of changes)event(id,`${fieldLabels[change.key]}：${change.before||'未填写'} → ${change.after||'未填写'}`,'字段修改');refresh();if(changes.length)toast('已保存，需求数量汇总已同步')}catch(error){toast(error.message);refresh()}}
function userFields(value){const parent=userParent(value),child=parent!==value?value:'';return `<div class="field"><label for="f-user-root">User</label><select id="f-user-root" onchange="changeUserRoot()">${selectOptions(userRoots(),parent)}</select></div><div class="field"><label for="f-user-child">下级 User（选填）</label><select id="f-user-child" ${!parent?'disabled':''} onchange="updateUserFormValue()">${selectOptions(userChildren(parent),child,'不细分')}</select></div><input type="hidden" id="f-user" name="user" value="${esc(value||'')}">`}
function changeUserRoot(){const parent=document.getElementById('f-user-root').value,child=document.getElementById('f-user-child');child.innerHTML=selectOptions(userChildren(parent),'','不细分');child.disabled=!parent;updateUserFormValue()}
function updateUserFormValue(){document.getElementById('f-user').value=document.getElementById('f-user-child').value||document.getElementById('f-user-root').value}
function editEquipmentUser(id){const item=eq(id);modal('选择 User',`<div class="fields">${userFields(item.user)}</div>`,'保存',data=>{const changes=setEquipmentClassification(item,'user',data.user);for(const change of changes)event(id,`User：${change.before||'未填写'} → ${change.after||'未填写'}`,'字段修改');closeModal();refresh();toast('User 已保存')})}
function equipmentCatalogModal(){modal('设备分类设置',`<div class="fields"><div class="field full"><label>配置项</label><select id="catalogKind" name="kind" onchange="renderEquipmentCatalog()"><option value="types">设备类型 / 子类型</option><option value="users">User / 下级 User</option><option value="stages">当前阶段</option></select></div><div class="field full" id="catalogParentField"><label>归属一级（留空新增一级）</label><select id="catalogParent" name="parent"></select></div><div class="field full"><label>新增名称</label><input name="value" required maxlength="80"></div></div><div id="catalogValues" class="catalog-list"></div>`,'添加选项',data=>{addEquipmentCatalogValue(data.kind,data.parent,data.value);event('',`新增${data.kind==='types'?'设备类型':data.kind==='users'?'User':'阶段'}选项：${data.parent?data.parent+' / ':''}${data.value.trim()}`,'分类配置');closeModal();refresh();toast('选项已添加，已有设备记录未改变')});renderEquipmentCatalog()}
function renderEquipmentCatalog(){const kind=document.getElementById('catalogKind').value,parent=document.getElementById('catalogParent');parent.innerHTML=selectOptions(kind==='types'?equipmentTypes():userRoots(),'','新增一级');document.getElementById('catalogParentField').hidden=kind==='stages';const list=kind==='types'?equipmentTypes().map(name=>({name,children:equipmentModels(name)})):kind==='users'?userRoots().map(name=>({name,children:userChildren(name)})):equipmentStages().map(name=>({name,children:[]}));document.getElementById('catalogValues').innerHTML=list.map(item=>`<div><strong>${esc(item.name)}</strong>${item.children.length?`<div class="muted">${item.children.map(esc).join('、')}</div>`:''}</div>`).join('')}
function poValue(e){return Object.hasOwn(e,'poDate')?e.poDate:[...e.batches.map(b=>b.po).filter(Boolean)].sort()[0]||''}
function poDates(e){return `<input type="date" class="inline" style="width:100%" aria-label="有价 PO issue date" value="${esc(poValue(e))}" onchange="savePODate('${e.id}',this.value)">`}
function savePODate(id,value){const e=eq(id);if(value&&!validDate(value)){toast('请选择有效日期');refresh();return}const before=poValue(e);e.poDate=value;if(before!==value)event(id,`有价 PO issue date：${before||'空'} → ${value||'空'}`,'字段修改');else save();refresh()}
function years(value){return Array.from({length:10},(_,i)=>String(2024+i)).concat(value&&!/^(202[4-9]|203[0-3])$/.test(value)?[value]:[]).map(y=>`<option ${y===String(value)?'selected':''}>${esc(y)}</option>`).join('')}
function validNumber(v,integer=false){return String(v).trim()!==''&&Number.isFinite(Number(v))&&Number(v)>=0&&(!integer||Number.isInteger(Number(v)))}function validDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v}
function validateField(e,k,v){if(['kcny','usd','hookup','count'].includes(k)){if(!validNumber(v,k==='count'))return'请输入有效的非负'+(k==='count'?'整数':'金额');}if(k==='rmid'&&v&&!/^\d+$/.test(v)&&!validDate(v))return'RMID 请输入数字或 YYYY-MM-DD 日期';return''}
function setField(e,k,v){if(k==='usd'){e.kcny=Number(Number(v).toFixed(3))*state.rate*1000}else if(['kcny','hookup','count'].includes(k))e[k]=k==='count'?Number(v):Number(Number(v).toFixed(k==='hookup'?3:2));else e[k]=v}
function inlineEdit(id,k,v){const e=eq(id),err=validateField(e,k,v);if(err){toast(err);refresh();return}const old=k==='usd'?(e.kcny/state.rate/1000).toFixed(3):e[k];if(String(old)===String(v))return;setField(e,k,v);event(id,`${fieldLabels[k]||k}：${old||'空'} → ${v}`);refresh();toast('已保存，相关数量和金额已更新')}
function actionHtml(a){const e=eq(a.eq);return `<div class="action ${a.done?'done':''}"><div class="action-main"><div class="between"><h3>${esc(a.title)}</h3>${pill(a.done?'已解决':a.due<TODAY?'已逾期':'待处理',a.done?'green':a.due<TODAY?'red':'blue')}</div><p class="muted" style="font-size:13px">下一步：${esc(a.note)}</p><div class="action-meta"><span>Owner ${esc(e?.owner||a.owner)}</span><span>处理期限 ${a.due}</span></div></div><div style="display:grid;gap:6px;align-content:center"><button onclick="toggleAction('${a.id}')">${a.done?'重新打开':'标记已解决'}</button><button class="link small" onclick="actionModal('${a.eq}','${a.id}')">编辑</button></div></div>`}
function actionModal(id,aid){const e=eq(id),a=state.actions.find(x=>x.id===aid)||state.actions.find(x=>x.eq===id&&!x.done);modal('设备问题跟进',`<p class="small muted" style="margin-bottom:15px">${esc(e.name)} · Owner ${esc(e.owner||'未填写')}（跟随设备负责人）</p><div class="fields"><div class="field full"><label>当前问题</label><input name="title" value="${esc(a?.title||'')}" required></div><div class="field full"><label>下一步</label><textarea name="note" required>${esc(a?.note||'')}</textarea></div>${input('处理期限','due',a?.due||'','date','required')}</div>`,'保存',d=>{req(d.title.trim()&&d.note.trim(),'请填写当前问题和下一步');req(validDate(d.due),'请填写有效期限');const obj={eq:id,title:d.title.trim(),note:d.note.trim(),owner:e.owner,due:d.due};if(a)Object.assign(a,obj);else state.actions.push({id:uid(),...obj,done:false});const saved=a||state.actions[state.actions.length-1];event(id,`更新问题：${d.title}；下一步：${d.note}；期限：${d.due}`,'问题',{problemId:saved.id});closeModal();refresh();toast('问题跟进已保存')})}
function toggleAction(id){const a=state.actions.find(a=>a.id===id);a.done=!a.done;event(a.eq,`${a.done?'解决':'重新打开'}问题：${a.title}`,'问题',{problemId:a.id});refresh();toast(a.done?'问题已标记解决，总览与里程碑已同步更新':'问题已重新打开')}
let problemDrawerId=null;
function openProblem(id){const a=state.actions.find(x=>x.id===id);if(!a)return;drawerId=a.eq;problemDrawerId=id;renderDrawer()}
function openRequirementProblem(id){const a=state.actions.find(x=>x.eq===id&&!x.done);if(a)openProblem(a.id);else actionModal(id)}
function renderProblemDrawer(){const a=state.actions.find(x=>x.id===problemDrawerId);if(!a)return closeDrawer();const e=eq(a.eq),stages=problemStages(a);document.getElementById('overlay').innerHTML=`<div class="drawer-mask" onclick="closeDrawer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="问题详情"><div class="drawer-head"><div class="between"><span class="small muted">问题详情</span><button class="icon" aria-label="关闭问题详情" onclick="closeDrawer()">${icon('close')}</button></div><h1 style="margin-top:10px;overflow-wrap:anywhere">${esc(a.title)}</h1><div style="margin-top:12px">${pill(a.done?'已解决':a.due<TODAY?'已逾期':'待处理',a.done?'green':a.due<TODAY?'red':'blue')}</div></div><div class="drawer-body detail-sections"><section class="detail-section"><h2>问题与影响范围</h2><dl class="detail-grid"><div class="wide"><dt>问题描述</dt><dd>${esc(a.title)}</dd></div><div class="wide"><dt>影响阶段</dt><dd>${stages.length?stages.map(m=>`<button class="chip" onclick="selectedMs='${m.id}';go('milestones')">${esc(m.name)}</button>`).join(''):'未标记影响阶段'}</dd></div></dl></section><section class="detail-section"><h2>处理安排</h2><dl class="detail-grid"><div><dt>负责人 · Owner</dt><dd>${esc(e?.owner||a.owner||'未填写')}</dd></div><div><dt>处理期限</dt><dd>${esc(a.due||'未填写')}</dd></div><div class="wide"><dt>下一步</dt><dd style="white-space:pre-wrap">${esc(a.note||'未填写')}</dd></div></dl></section>${problemHistory(a)}</div><div class="modal-foot"><button onclick="actionModal('${a.eq}','${a.id}')">编辑问题</button><button class="primary" onclick="toggleAction('${a.id}')">${a.done?'重新打开':'标记已解决'}</button></div></aside>`}

function openDrawer(id,t='overview'){if(!eq(id))return;if(t==='actions')return openRequirementProblem(id);problemDrawerId=null;drawerId=id;drawerTab=t;renderDrawer()}
function closeDrawer(){problemDrawerId=null;drawerId=null;document.getElementById('overlay').innerHTML=''}
function renderDrawer(){if(problemDrawerId)return renderProblemDrawer();const e=eq(drawerId);if(!e)return closeDrawer();const labels={name:'Workstation',equipmentType:'设备类型',equipmentModel:'子类型／型号',currentStage:'当前阶段',owner:'Owner',module:'Module',area:'Area',sponsor:'Sponsor',user:'User',vendor:'Vendor',tool:'Tool Category',count:'Tool count',origin:'产地',kcny:'Total Capex · KCNY',rmid:'RMID',po:'有价 PO issue date',hookup:'Hookup 费用 · KCNY',usd:'Total Capex · USD$M',year:'Year',category:'Category（新 EC 申请）'};const sections=[['需求信息',['name','equipmentType','equipmentModel','currentStage','tool','count','area']],['责任归属',['owner','module','user','sponsor']],['采购信息',['vendor','origin','rmid','po']],['费用与年度',['kcny','usd','hookup','year','category']]];const value=k=>k==='po'?poValue(e):k==='kcny'?money(e.kcny):k==='usd'?money(e.kcny/state.rate/1000,3):k==='hookup'?money(e.hookup,3):k==='user'?userPath(e.user):e[k];document.getElementById('overlay').innerHTML=`<div class="drawer-mask" onclick="closeDrawer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="行详情"><div class="drawer-head between"><h1>${esc(e.name)}</h1><button class="icon" aria-label="关闭详情" onclick="closeDrawer()">${icon('close')}</button></div><div class="drawer-body detail-sections">${sections.map(([title,keys])=>`<section class="detail-section"><h2>${title}</h2><dl class="detail-grid">${keys.map(k=>`<div class="${['name','po','category','equipmentModel'].includes(k)?'wide':''}"><dt>${labels[k]}</dt><dd>${value(k)===null||value(k)===undefined||value(k)===''?'—':esc(value(k))}</dd></div>`).join('')}</dl></section>`).join('')}${rowHistory(e.id)}</div></aside>`}

function detailMetrics(e){const linked=milestones.filter(m=>Object.hasOwn(e.needs,m.id)),open=state.actions.filter(a=>a.eq===e.id&&!a.done),critical=criticalProblems().filter(a=>a.eq===e.id);return `<div class="detail-metrics"><div><span>关联里程碑</span><strong>${linked.length}<small> 个</small></strong></div><div><span>有风险的里程碑</span><strong>${linked.filter(m=>m.judgment==='risk').length}<small> 个</small></strong></div><div><span>关键未解决问题</span><strong>${critical.length}<small> 项</small></strong></div><div><span>未解决问题</span><strong>${open.length}<small> 项</small></strong></div></div>`}
function detailStages(e,withNumbers=false){const linked=milestones.filter(m=>Object.hasOwn(e.needs,m.id));return `<div class="section"><div class="section-title"><h2>关联阶段与阶段状态</h2></div>${linked.map(m=>{const a=assessment(e,m);return `<div class="batch"><div class="batch-head between"><button class="link" onclick="selectedMs='${m.id}';go('milestones')">${esc(m.name)}</button>${leaderStatus(m)}</div><div class="batch-body"><div class="small muted">计划完成日期：${m.date}</div><p><strong>达标条件：</strong>${esc(m.goal||'待 Leader 填写')}</p><p><strong>状态说明：</strong>${esc(m.judgmentNote||'待 Leader 填写')}</p><div class="between" style="margin-top:12px"><button class="link" onclick="judgeMilestone('${m.id}')">更新状态</button></div>${withNumbers?`<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--muted)">设备数量参考</summary><div class="fields" style="margin-top:12px"><div class="field"><label>需要数量</label>${stageInput(e,m,'need',a.need)}</div><div class="field"><label>已准备数量</label>${stageInput(e,m,'current',a.current)}</div></div><p class="small muted">还缺数量：${a.gap??'待填写'} · 仅作为判断依据，修改自动记录</p></details>`:''}</div></div>`}).join('')||'<p class="muted">尚未关联里程碑</p>'}</div>`}
function drawerOverview(e){return detailMetrics(e)+detailStages(e,true)+`<div class="section"><div class="section-title"><h2>问题处理</h2><button class="link" onclick="drawerTab='actions';renderDrawer()">查看问题与记录</button></div>${state.actions.filter(a=>a.eq===e.id&&!a.done).map(actionHtml).join('')||'<p class="muted">暂无未解决问题</p>'}</div><details><summary style="cursor:pointer">责任与需求投入</summary><div class="fields" style="margin-top:14px">${[['Owner',e.owner],['User',e.user],['Sponsor',e.sponsor],['Vendor',e.vendor],['需求投入 KCNY',money(e.kcny)],['需求投入 USD$M',money(e.kcny/state.rate/1000,3)]].map(([k,v])=>`<div><span class="small muted">${k}</span><div>${esc(v)}</div></div>`).join('')}</div></details>`}

function drawerBatches(e){return `<div class="between" style="margin-bottom:17px"><div><h2>采购批次</h2><p class="small muted">${ordered(e)} / ${e.count} 已下单 · ${Math.max(0,e.count-ordered(e))} 件未下单</p></div><button class="primary" ${ordered(e)>=e.count?'disabled':''} onclick="batchModal('${e.id}')">${icon('plus')} 新增批次</button></div>${e.batches.map(b=>`<div class="batch"><div class="batch-head between"><div><h3>${esc(b.id)}</h3><div class="small muted">PO issue date · ${b.po}</div></div><button class="link small" onclick="batchModal('${e.id}','${b.id}')">编辑批次</button></div><div class="batch-body"><div class="batch-stats"><span class="muted">下单<strong>${b.qty}</strong></span><span class="muted">到货<strong>${delivered(b)}</strong></span><span class="muted">可用<strong class="greentext">${accepted(b)}</strong></span></div><div class="between" style="margin-bottom:12px"><span class="muted small">预计全部完成签字验收</span><span>${b.eta||pill('日期待确认','amber')}</span></div>${b.deliveries.map(d=>`<div class="delivery"><span>${icon('box')} ${d.date} 到货</span><span>${d.qty} 件</span></div>`).join('')}${b.acceptances.map(a=>`<div class="delivery"><div><span class="greentext">${icon('check')} 签字验收通过</span><div class="small muted">${a.date} · 签名 ${esc(a.signer)} · ${esc(a.note||'')}</div></div><strong>${a.qty} 件</strong></div>`).join('')}<div class="row" style="padding-top:12px;border-top:1px solid var(--line);margin-top:5px"><button ${delivered(b)>=b.qty?'disabled':''} onclick="deliveryModal('${e.id}','${b.id}')">登记到货</button><button class="primary" ${delivered(b)<=accepted(b)?'disabled':''} onclick="acceptModal('${e.id}','${b.id}')">使用者签字验收</button></div></div></div>`).join('')||'<div class="empty">尚无采购批次</div>'}${ruleHelp('签字与验收通过同时完成，仅确认数量计入可用。预计日期用于判断能否按时备齐，不代表已完成验收。')}`}
function drawerActions(e){return detailMetrics(e)+detailStages(e)+`<div class="section-title"><h2>当前问题</h2><button class="link" onclick="actionModal('${e.id}')">${state.actions.some(a=>a.eq===e.id&&!a.done)?'更新问题':'记录问题'}</button></div>${state.actions.filter(a=>a.eq===e.id).map(actionHtml).join('')||'<div class="empty">暂无待处理问题</div>'}<div class="section-title" style="margin-top:25px"><h2>修改与完成记录</h2></div>${state.events.filter(x=>x.eq===e.id).map(x=>`<div class="timeline-item"><div class="timeline-time">${esc(x.time)} · ${x.kind}</div><div>${esc(x.text)}</div></div>`).join('')||'<p class="muted">暂无修改记录</p>'}`}
const fieldLabels={name:'Workstation',desc:'设备说明',equipmentType:'设备类型',equipmentModel:'子类型／型号',currentStage:'当前阶段',owner:'Owner · 负责人',module:'Module · 所属领域',area:'Area',sponsor:'Sponsor · 出资方',user:'User · 使用者',vendor:'Vendor',tool:'Tool Category',count:'Tool count',origin:'产地',kcny:'Total Capex · KCNY',rmid:'RMID',hookup:'Hookup 费用 · KCNY',usd:'Total Capex · USD$M',year:'Year',category:'Category · 新 EC 申请'};
function field(k,value,list='',type='text'){return `<div class="field ${['name','desc','category'].includes(k)?'full':''}"><label for="f-${k}">${fieldLabels[k]||k}</label>${k==='year'?`<select id="f-${k}" name="${k}">${years(value)}</select>`:`<input id="f-${k}" name="${k}" value="${esc(value)}" ${list?`list="${list}"`:''} type="${type}" ${type==='number'?'step="any" min="0"':''} ${k==='name'?'required':''}>`}</div>`}
function fieldsHtml(e){return Object.keys(fieldLabels).map(k=>{if(k==='user')return userFields(e.user);if(['equipmentType','equipmentModel','currentStage'].includes(k)){const options=k==='equipmentType'?equipmentTypes():k==='equipmentModel'?equipmentModels(e.equipmentType):equipmentStages();return `<div class="field"><label for="f-${k}">${fieldLabels[k]}</label><select id="f-${k}" name="${k}" ${k==='equipmentType'?'onchange="updateModelForm()"':''} ${k==='equipmentModel'&&!e.equipmentType?'disabled':''}>${selectOptions(options,e[k])}</select></div>`}return field(k,k==='usd'?(e.kcny/state.rate/1000).toFixed(3):k==='hookup'?Number(e[k]).toFixed(3):e[k],({owner:'owners',module:'modules',area:'areas',vendor:'vendors',category:'categories',tool:'tooltypes'})[k]||'',['count','kcny','hookup','usd'].includes(k)?'number':'text')}).join('')}
function updateModelForm(){const type=document.getElementById('f-equipmentType').value,model=document.getElementById('f-equipmentModel');model.innerHTML=selectOptions(equipmentModels(type),'');model.disabled=!type}
function drawerFields(e){setTimeout(()=>wireCurrency('equipmentForm'),0);return `<form id="equipmentForm" onsubmit="saveFields(event,'${e.id}')"><div class="fields">${fieldsHtml(e)}</div><div style="margin-top:18px">${ruleHelp(`汇率：1 USD = ${state.rate} CNY。KCNY 与 USD$M 自动换算。Hookup 费用单独显示，不自动追加到总投入。RMID 可填数字或日期。`)}</div><div id="fieldError" class="error"></div><button class="primary" type="submit">保存全部字段</button></form>`}
function wireCurrency(id){const f=document.getElementById(id);if(!f)return;f.elements.kcny.oninput=()=>{if(validNumber(f.elements.kcny.value))f.elements.usd.value=(Number(f.elements.kcny.value)/state.rate/1000).toFixed(3);f.dataset.currency='kcny'};f.elements.usd.oninput=()=>{if(validNumber(f.elements.usd.value))f.elements.kcny.value=(Number(f.elements.usd.value)*state.rate*1000).toFixed(2);f.dataset.currency='usd'}}
function saveFields(ev,id){ev.preventDefault();const f=ev.target,e=id?eq(id):{id:'EQ-'+uid().slice(-5).toUpperCase(),needs:{},batches:[]},updated=clone(e),data=Object.fromEntries(new FormData(f));if(!data.name.trim())return formError('设备名称不能为空',id);for(const [k,v]of Object.entries(data)){if(k==='usd')continue;const err=validateField(e,k,v);if(err)return formError(err,id);setField(updated,k,v.trim())}updated.equipmentModel=data.equipmentModel||'';if(updated.equipmentModel&&(!updated.equipmentType||!equipmentModels(updated.equipmentType).includes(updated.equipmentModel)))return formError('子类型必须属于所选设备类型',id);if(f.dataset.currency==='usd')updated.kcny=Number(Number(data.usd).toFixed(3))*state.rate*1000;if(id){Object.assign(e,updated)}else state.equipment.push(updated);event(updated.id,id?'更新设备需求字段':'新增设备需求','需求');if(!id){closeModal();drawerId=updated.id;drawerTab='overview'}refresh();toast('设备需求已保存')}
function formError(msg,id){document.getElementById(id?'fieldError':'modalError').textContent=msg}
function modal(title,body,submitText,handler){document.getElementById('modalRoot').innerHTML=`<div class="modal-mask"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form id="modalForm"><div class="modal-head between"><h2>${title}</h2><button type="button" class="icon" aria-label="关闭弹窗" onclick="closeModal()">${icon('close')}</button></div><div class="modal-body">${body}<div id="modalError" class="error" role="alert"></div></div><div class="modal-foot"><button type="button" onclick="closeModal()">取消</button><button class="primary" type="submit">${submitText}</button></div></form></section></div>`;document.getElementById('modalForm').onsubmit=ev=>{ev.preventDefault();try{handler(Object.fromEntries(new FormData(ev.target)),ev.target)}catch(err){document.getElementById('modalError').textContent=err.message}};setTimeout(()=>document.querySelector('#modalForm input, #modalForm select, #modalForm button')?.focus(),0)}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}function req(ok,msg){if(!ok)throw Error(msg)}function input(label,name,value='',type='text',attrs=''){return `<div class="field"><label>${label}</label><input name="${name}" value="${esc(value)}" type="${type}" ${attrs}></div>`}
function newEquipment(){const e={name:'',desc:'',owner:'',module:'',area:'',sponsor:'',user:'',vendor:'',tool:'Common',count:1,origin:'',kcny:0,rmid:'',hookup:0,year:'2026',category:'new EC'};modal('新增设备需求',`<div class="fields">${fieldsHtml(e)}</div>`,'创建设备需求',()=>{});document.getElementById('modalForm').onsubmit=ev=>saveFields(ev,null);wireCurrency('modalForm')}
function batchModal(id,bid){const e=eq(id),b=e.batches.find(b=>b.id===bid);modal(b?'编辑采购批次':'新增采购批次',`<div class="notice">${esc(e.name)} · 可新增下单 ${e.count-ordered(e)} 件</div><div class="fields">${input('PO 编号','poid',b?.id||'','text','required')}${input('本批下单数量','qty',b?.qty||1,'number','required min="1" step="1"')}${input('PO issue date','po',b?.po||TODAY,'date','required')}${input('预计全部完成签字验收日期','eta',b?.eta||'','date')}${input('本批采购金额 · KCNY','price',b?.price||0,'number','min="0" step="0.01" required')}<div class="field full"><label>说明（普通补录可不填）</label><textarea name="note" placeholder="调整数量或推迟预计日期时，请说明原因"></textarea></div></div>`,'保存批次',(d)=>{req(validNumber(d.qty,true)&&+d.qty>0,'数量必须为正整数');req(+d.qty<=e.count-ordered(e)+(b?.qty||0),'下单数量超过设备需求');req(!b||+d.qty>=delivered(b),'数量不能小于已到货数量');req(validDate(d.po),'请填写有效 PO 日期');req(!d.eta||validDate(d.eta)&&d.eta>=d.po,'预计验收日期不能早于 PO 日期');req(!b||b.deliveries.every(x=>x.date>=d.po),'PO 日期不能晚于已登记到货日期');req(!e.batches.some(x=>x!==b&&x.id===d.poid.trim()),'PO 编号已存在');req(/^[A-Za-z0-9_-]+$/.test(d.poid.trim()),'PO 编号仅支持字母、数字、短横线与下划线');req(validNumber(d.price),'采购金额无效');if(b&&(Number(d.qty)!==b.qty||(b.eta&&(!d.eta||d.eta>b.eta))))req(d.note.trim(),'调整数量或推迟预计日期时，请填写原因');const old=b?.eta;const obj={id:d.poid.trim(),qty:+d.qty,po:d.po,eta:d.eta,price:+d.price};if(b)Object.assign(b,obj);else e.batches.push({...obj,deliveries:[],acceptances:[]});event(id,`${b?'更新':'新增'}批次 ${obj.id}：${old||'待确认'} → ${d.eta||'待确认'}；${d.note}`,'采购');closeModal();refresh();toast('批次已保存，阶段数量保持原填写值')})}
function deliveryModal(id,bid){const e=eq(id),b=e.batches.find(x=>x.id===bid);modal('登记分批到货',`<div class="notice">${esc(b.id)} · 尚未到货 ${b.qty-delivered(b)} 件</div><div class="fields">${input('本次到货数量','qty',b.qty-delivered(b),'number','min="1" step="1" required')}${input('实际到货日期','date',TODAY,'date','required')}</div>`,'确认到货',d=>{req(validNumber(d.qty,true)&&+d.qty>0&&+d.qty<=b.qty-delivered(b),'到货数量超过本批剩余数量');req(validDate(d.date)&&d.date>=b.po&&d.date<=TODAY,'到货日期须在 PO 日期与演示业务日期之间');b.deliveries.push({id:uid(),qty:+d.qty,date:d.date});event(id,`${b.id} 登记到货 ${d.qty} 件`,'到货');closeModal();refresh();toast('到货已登记，可继续完成使用者签字验收')})}
function acceptModal(id,bid){const e=eq(id),b=e.batches.find(x=>x.id===bid);modal('使用者签字与验收',`<div class="notice">${esc(e.name)} · ${esc(b.id)}<br>已到货 ${delivered(b)} 件，待签字验收 ${delivered(b)-accepted(b)} 件。</div><div class="fields">${input('本次签字验收数量','qty',delivered(b)-accepted(b),'number','min="1" step="1" required')}${input('签字验收日期','date',TODAY,'date','required')}<div class="field full"><label>使用者签名 · ${esc(e.user)}</label><input class="signature" name="signer" placeholder="输入签名人姓名" required><span class="small muted">原型以姓名输入模拟签名，不构成真实电子签署。</span></div><div class="field full"><label>补充说明（选填）</label><textarea name="note" placeholder="有需要补充的情况时填写"></textarea></div></div><label class="checkline"><input type="checkbox" name="confirm" required>我确认上述数量对应的设备已验收通过，并以使用者身份签字确认，两项同步完成。</label>`,'签字并确认验收通过',d=>{req(validNumber(d.qty,true)&&+d.qty>0&&+d.qty<=delivered(b)-accepted(b),'数量不能超过已到货待验收数量');req(validDate(d.date)&&d.date<=TODAY,'请填写不晚于演示业务日期的有效日期');const arrivedBy=sum(b.deliveries,x=>x.date<=d.date?x.qty:0);req(arrivedBy>=accepted(b)+Number(d.qty),'该日期之前的到货数量不足以覆盖本次验收');req(d.signer.trim()&&d.confirm,'请填写签名并确认验收通过');b.acceptances.push({qty:+d.qty,date:d.date,signer:d.signer.trim(),note:d.note.trim()});event(id,`${b.id} ${d.qty} 件签字验收通过 · ${d.signer}`,'验收');closeModal();refresh();toast('验收记录已保存，阶段数量请按实际情况填写')})}
function isLeader(){return true} // Prototype session: Leader; production role comes from authenticated user.
function commitMilestones(text){milestones.sort((a,b)=>a.date.localeCompare(b.date));milestones.forEach((m,i)=>m.phase=String(i+1).padStart(2,'0')+' · 研发阶段');state.milestones=clone(milestones);if(!milestones.some(m=>m.id===selectedMs))selectedMs=milestones[0]?.id||'';delete columnFilters.milestones;event('',text,'里程碑');closeModal();refresh();projectSettings()}
function editMilestone(id){if(!isLeader())return toast('仅 Leader 可以管理里程碑');const m=milestones.find(x=>x.id===id);modal(m?'编辑里程碑':'新增里程碑',`<div class="fields">${input('里程碑名称','name',m?.name||'','text','required maxlength="50"')}${input('计划日期','date',m?.date||'','date','required')}${m?'<div class="field full"><label>修改说明（调整日期时必填）</label><textarea name="reason"></textarea></div>':''}</div>`,'保存',d=>{req(isLeader(),'仅 Leader 可以管理里程碑');req(d.name.trim(),'请输入名称');req(validDate(d.date),'请输入有效日期');req(!milestones.some(x=>x.id!==id&&x.name.toLowerCase()===d.name.trim().toLowerCase()),'里程碑名称已存在');if(m&&m.date!==d.date)req(d.reason?.trim(),'调整日期时请说明原因');const before=m?`${m.name} / ${m.date}`:'';if(m){m.name=d.name.trim();m.date=d.date}else milestones.push({id:uid(),name:d.name.trim(),date:d.date,phase:''});commitMilestones(`${m?'修改':'新增'}里程碑：${before?before+' → ':''}${d.name.trim()} / ${d.date}${d.reason?'；'+d.reason:''}`)})}
function deleteMilestone(id){if(!isLeader())return toast('仅 Leader 可以管理里程碑');const m=milestones.find(x=>x.id===id);if(!m)return;const linked=state.equipment.filter(e=>e.needs[id]);modal('删除里程碑',`<p>确认删除「${esc(m.name)}」？</p><p class="muted">${linked.length?`关联的 ${linked.length} 类设备将解除此里程碑关联，采购、到货和验收记录保留。`:'该里程碑未关联设备。'}</p>${linked.length?'<div style="margin-top:12px">'+linked.map(e=>esc(e.name)).join('<br>')+'</div>':''}`,'确认删除',()=>{req(isLeader(),'仅 Leader 可以管理里程碑');milestones.splice(milestones.findIndex(x=>x.id===id),1);state.equipment.forEach(e=>{if(e.needs[id]){delete e.needs[id];event(e.id,`因里程碑删除，解除与 ${m.name} 的关联`,'里程碑')}});commitMilestones(`删除里程碑：${m.name}`)})}
function projectSettings(){modal('项目设置',`<h3>预算汇率</h3><div class="between" style="margin:12px 0 24px"><span>1 USD = ${state.rate} CNY</span><button type="button" onclick="rateModal()">修改汇率</button></div><div class="between"><h3>研发里程碑</h3>${isLeader()?'<button type="button" onclick="editMilestone()">新增里程碑</button>':''}</div>${milestones.map(m=>`<div class="delta"><span>${esc(m.name)}<br><span class="small muted">${m.date}</span></span>${isLeader()?`<span class="row"><button type="button" onclick="editMilestone('${m.id}')">编辑</button><button type="button" class="danger" onclick="deleteMilestone('${m.id}')">删除</button></span>`:''}</div>`).join('')||'<p class="muted">尚未设置里程碑</p>'}<p class="small muted" style="margin-top:12px">Leader 统一维护名称和日期；成员可为设备选择关联里程碑并填写累计需求。</p>`,'关闭',closeModal)}
function rateModal(){modal('项目金额换算',`<div class="notice">统一使用项目预算汇率。修改汇率后保留 KCNY 原值，重新计算全部 USD$M。Hookup 费用按 KCNY 单独显示。</div>${input('1 USD = 多少 CNY','rate',state.rate,'number','min="0.0001" step="0.0001" required')}`,'更新换算',d=>{req(Number.isFinite(+d.rate)&&+d.rate>0,'汇率必须大于 0');state.rate=+d.rate;event('',`项目汇率更新为 ${state.rate}`,'金额');closeModal();refresh();toast('美元金额已按新汇率更新')})}
function help(){modal('演示说明',`<p>这是一个可离线打开的桌面端产品原型，所有演示数据保存在当前浏览器。</p><div class="section" style="margin-top:16px"><h3>推荐演示路径</h3><ol style="padding-left:20px;line-height:2"><li>查看「试产启动」的设备缺口。</li><li>打开高温试验箱，将第二批预计可用日期改为 2026-10-15。</li><li>对已到货的 1 台执行使用者签字验收。</li><li>在设备详情中将对应问题标记已解决。</li><li>返回总览，展开「最近变更」查看记录。</li></ol></div><p class="muted small">业务日期固定为 2026-09-08；签名为演示模拟。Hookup 费用暂按 KCNY 单独显示。导入导出使用 Excel 可打开的 CSV，不包含批次或签名记录。</p><button type="button" class="danger" style="margin-top:15px" onclick="resetModal()">恢复初始演示数据</button>`,'知道了',()=>{closeModal()})}
function resetModal(){modal('恢复演示数据',`<p>将清除本原型在当前浏览器中的修改、签字验收和问题记录，恢复初始案例。</p>`,'确认恢复',()=>{state=clone(seed);state.baseline=clone(seed.equipment);state.baseline[0].batches[1].eta='2026-10-15';state.baseline[6].batches[0].acceptances=[];state.baselineDate='2026-09-01';milestones.splice(0,milestones.length,...clone(defaultMilestones));selectedMs='m2';initializeStageNumbers();save();closeModal();closeDrawer();go('dashboard');toast('初始演示数据已恢复')})}
const legacyCsvKeys=['name','owner','module','area','sponsor','user','vendor','tool','count','origin','kcny','rmid','hookup','usd','year','category'];
const csvKeys=[...legacyCsvKeys,'equipmentType','equipmentModel','currentStage'];
function csvString(rows){return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function download(name,text,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(template=false){const rows=template?[]:visibleRows();download(template?'设备需求导入模板.csv':'设备需求.csv',csvString([csvKeys.map(k=>fieldLabels[k]),...rows.map(e=>csvKeys.map(k=>k==='usd'?(e.kcny/state.rate/1000).toFixed(3):k==='hookup'?e[k].toFixed(3):k==='kcny'?e[k].toFixed(2):/^[=+@\-]/.test(String(e[k]))?"'"+e[k]:e[k]))]));toast(template?'模板已下载':'当前视图的设备主字段已导出')}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}req(!quoted,'CSV 引号未闭合');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function equipmentImportRows(text){const rows=parseCSV(text),keys=[csvKeys,legacyCsvKeys].find(candidate=>JSON.stringify(rows[0])===JSON.stringify(candidate.map(key=>fieldLabels[key])));req(keys,'表头与模板不一致，请下载字段模板');req(rows.length>1,'文件没有设备数据');const names=new Set(state.equipment.map(item=>item.name.toLowerCase())),list=[];for(let index=1;index<rows.length;index++){req(rows[index].length===keys.length,`第 ${index+1} 行列数不正确`);const data=Object.fromEntries(keys.map((key,offset)=>[key,rows[index][offset].trim()]));req(data.name&&!names.has(data.name.toLowerCase()),`第 ${index+1} 行设备名称为空或重复`);names.add(data.name.toLowerCase());const item={id:'EQ-'+uid().slice(-7).toUpperCase(),desc:'导入设备需求',batches:[],needs:{}};for(const [key,value]of Object.entries(data)){if(key==='usd')continue;const error=validateField(item,key,value);req(!error,`第 ${index+1} 行：${error}`);setField(item,key,value)}req(!data.usd||validNumber(data.usd)&&Math.abs(+data.usd-Number((item.kcny/state.rate/1000).toFixed(3)))<0.00001,`第 ${index+1} 行美元金额与项目汇率不一致`);req(/^\d{4}$/.test(item.year),`第 ${index+1} 行年份无效`);req(!item.equipmentModel||item.equipmentType,`第 ${index+1} 行子类型缺少一级设备类型`);list.push(item)}return list}
function importModal(){modal('导入设备需求',`<div class="notice">使用 UTF-8 CSV 新增需求。新版模板追加设备类型、子类型／型号、当前阶段，兼容旧 16 列模板；未提供的新字段保持待填写。</div><button type="button" onclick="exportCSV(true)">${icon('download')} 下载字段模板</button><div class="field" style="margin-top:18px"><label>选择 CSV 文件</label><input type="file" name="file" id="importFile" accept=".csv" required></div><p class="small muted" style="margin-top:12px">先完整校验再写入；同名设备阻断。KCNY 为导入换算基准，USD$M 如填写须与换算值一致。</p>`,'校验并预览',async(_,form)=>{try{const file=form.elements.file.files[0];req(file&&file.size<2e6,'请选择小于 2 MB 的 CSV');const list=equipmentImportRows(await file.text());modal('确认导入',`<div class="notice">${list.length} 条设备需求全部校验通过。</div><div style="max-height:260px;overflow:auto">${list.map(item=>`<div class="delta"><span>${esc(item.name)}</span><span>${item.count} 件 · ${money(item.kcny)} KCNY</span></div>`).join('')}</div>`,'导入全部需求',()=>{state.equipment.push(...list);list.forEach(item=>event(item.id,'通过 CSV 导入设备需求','导入'));closeModal();openView('');toast(`已导入 ${list.length} 条设备需求`)})}catch(error){document.getElementById('modalError').textContent=error.message}})}
if(Array.isArray(state.milestones))milestones.splice(0,milestones.length,...state.milestones);
if(!state.milestones&&state.milestoneDates)milestones.forEach(m=>{if(state.milestoneDates[m.id])m.date=state.milestoneDates[m.id]});
document.addEventListener('keydown',ev=>{if(ev.key==='Tab'){const box=document.querySelector('.modal')||document.querySelector('.drawer');if(box){const nodes=[...box.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')];const first=nodes[0],last=nodes[nodes.length-1];if(nodes.length&&ev.shiftKey&&(document.activeElement===first||!box.contains(document.activeElement))){ev.preventDefault();last.focus()}else if(nodes.length&&!ev.shiftKey&&(document.activeElement===last||!box.contains(document.activeElement))){ev.preventDefault();first.focus()}}}if(ev.key==='Escape'){if(document.getElementById('modalRoot').innerHTML)closeModal();else if(drawerId)closeDrawer();else document.body.classList.remove('full-table')}});
function setSidebarCollapsed(collapsed){
 document.body.classList.toggle('sidebar-collapsed',collapsed);
 const button=document.getElementById('sidebarToggle'),label=collapsed?'展开侧边栏':'收起侧边栏';
 button.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3z M9 4v16 ${collapsed?'M13 9l3 3-3 3':'M16 9l-3 3 3 3'}"/></svg><span class="toggle-label">${label}</span>`;
 button.title=label;button.setAttribute('aria-label',label);button.setAttribute('aria-expanded',String(!collapsed));
 try{localStorage.setItem('equipment-wbs-sidebar-collapsed',String(collapsed))}catch{}
}
const columnFilters={};let filterKey=null,filterDraft=new Set(),filterQuery='';
const columnPresets={owner:['PTE','TD','QRA'],module:['PTE','TD','QRA'],area:['Bench','C1 LAB','CP','DEVICE WA'],user:['PTE','DEVICE','QRA'],vendor:['Eoulu','TEL','广立微'],name:['Eoulu_F1_Probe_EFA','First Set Kit','KOV2-210B-F3'],tool:['Common','Unique'],origin:['马来西亚/泰国','日本','中国'],category:['2pc Previous EC cover 2pc need new EC','new EC','Previews EC cover']};
function columnKeys(){return ['name','equipmentType','equipmentModel','currentStage','owner','module','area','sponsor','user','vendor','tool','count','origin','kcny','rmid','po','hookup','usd','year','category']}
function columnValues(e,k){if(k==='status')return[statusNames[overall(e)]];if(k==='quantities')return[`${e.count} / ${ordered(e)} / ${arrived(e)} / ${ready(e)}`];if(k==='milestones')return milestones.filter(m=>Object.hasOwn(e.needs,m.id)).map(m=>m.name);if(k==='po')return[poValue(e)];if(k==='usd')return[(e.kcny/state.rate/1000).toFixed(3)];if(k==='kcny')return[e.kcny.toFixed(2)];if(k==='hookup')return[Number(e.hookup).toFixed(3)];return[String(e[k]??'')]}
function passesColumns(e){return Object.entries(columnFilters).every(([k,values])=>{if(k==='user')return values.some(value=>value?userMatches(e.user,value):!e.user);const list=columnValues(e,k);return(list.length?list:['']).some(v=>values.includes(v))})}
function statusHelp(){return `<span class="status-help" tabindex="0" aria-label="准备状态判定规则" aria-describedby="statusRules">?<span class="status-rules" id="statusRules" role="tooltip"><strong>每个阶段</strong><br>已备齐：已准备数量 ≥ 需要数量。<br>未备齐：已准备数量 ＜ 需要数量。<br>待填写：任一必要数量未填写。<br><br><strong>设备准备状态</strong><br>任一关联阶段未备齐 → 未备齐。<br>没有未备齐阶段，但有未填写数量 → 待填写。<br>全部关联阶段已备齐 → 已备齐。<br>未关联里程碑 → 待填写。<br><br>还缺数量 = 需要数量 − 已准备数量，最低为 0。未备齐不代表延期。</span></span>`}
function enhanceColumns(){if(page!=='wbs')return;const table=document.querySelector('#tableContent table');if(!table)return;const keys=columnKeys();state.columnWidths ||= {};let colgroup=document.createElement('colgroup');keys.forEach((k,i)=>{const col=document.createElement('col');col.style.width=(state.columnWidths[k]||(i===0?260:k==='quantities'||k==='po'||k==='milestones'||k==='category'?270:180))+'px';colgroup.appendChild(col)});table.prepend(colgroup);table.style.tableLayout='fixed';const headers=table.querySelectorAll('thead th');headers.forEach((th,i)=>{const k=keys[i],label=th.textContent;th.innerHTML=`<span class="column-label" title="${esc(label)}">${esc(label)}</span>${k==='status'?statusHelp():''}<button class="filter-trigger ${columnFilters[k]?'active':''}" data-filter="${k}" aria-label="筛选 ${esc(label)}" title="筛选 ${esc(label)}"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg></button><span class="column-resizer" data-resize="${k}" tabindex="0" role="separator" aria-label="调整 ${esc(label)} 列宽" aria-orientation="vertical" aria-valuemin="90" aria-valuemax="800" aria-valuenow="${parseInt(colgroup.children[i].style.width)}"></span>`});syncTableWidth(table);const old=document.getElementById('columnFilterSummary');if(old)old.remove();if(Object.keys(columnFilters).length){const bar=document.createElement('div');bar.id='columnFilterSummary';bar.className='column-filter-summary';bar.innerHTML=`<span>已筛选 ${Object.keys(columnFilters).length} 列</span><button class="link" onclick="clearColumnFilters()">清除全部列筛选</button>`;table.closest('#tableContent').prepend(bar)}}
function syncTableWidth(table){table.style.width=[...table.querySelectorAll('col')].reduce((n,c)=>n+parseInt(c.style.width),0)+'px'}
function setColumnWidth(key,width){const table=document.querySelector('#tableContent table');if(!table)return;const i=columnKeys().indexOf(key),value=Math.max(90,Math.min(800,Math.round(width)));state.columnWidths[key]=value;table.querySelectorAll('col')[i].style.width=value+'px';table.querySelector(`[data-resize="${key}"]`).setAttribute('aria-valuenow',value);syncTableWidth(table)}
function clearColumnFilters(){Object.keys(columnFilters).forEach(k=>delete columnFilters[k]);closeColumnFilter();renderTableOnly()}
function closeColumnFilter(){document.getElementById('columnFilterPopup')?.remove();filterKey=null}
function filterOptions(){const presets=filterKey==='user'?[...userRoots(),...equipmentCatalog().users.flatMap(item=>item.children)]:filterKey==='equipmentType'?equipmentTypes():filterKey==='equipmentModel'?equipmentTypes().flatMap(equipmentModels):filterKey==='currentStage'?equipmentStages():columnPresets[filterKey]||[];return [...new Set([...presets,...state.equipment.flatMap(e=>{const v=columnValues(e,filterKey);return v.length?v:['']})])].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true})).filter(v=>(v||'空白').toLowerCase().includes(filterQuery.toLowerCase()))}
function showFilterOptions(){const list=document.getElementById('columnOptions');if(!list)return;list.innerHTML=filterOptions().map(v=>`<label class="column-option"><input type="checkbox" data-value="${esc(v)}" ${filterDraft.has(v)?'checked':''}><span>${esc(v||'（空白）')}</span></label>`).join('')||'<div class="empty">没有匹配选项</div>';document.getElementById('columnSelected').textContent=`已选 ${filterDraft.size} 项`}
function openColumnFilter(key,button){closeColumnFilter();filterKey=key;filterDraft=new Set(columnFilters[key]||[]);filterQuery='';const popup=document.createElement('div');popup.id='columnFilterPopup';popup.setAttribute('role','dialog');popup.setAttribute('aria-label','列筛选');popup.innerHTML=`<div class="between"><strong>${esc(button.closest('th').querySelector('.column-label').textContent)}</strong><button class="icon" aria-label="关闭筛选" onclick="closeColumnFilter()">×</button></div><input id="columnQuery" placeholder="输入文字查找选项" aria-label="模糊搜索筛选选项"><div class="between small" style="margin:10px 0"><button class="link" onclick="filterOptions().forEach(v=>filterDraft.add(v));showFilterOptions()">选中搜索结果</button><span id="columnSelected" class="muted"></span></div><div id="columnOptions"></div><div class="between" style="margin-top:12px"><button onclick="delete columnFilters[filterKey];closeColumnFilter();renderTableOnly()">清除本列</button><button class="primary" onclick="applyColumnFilter()">应用</button></div>`;document.body.appendChild(popup);const r=button.getBoundingClientRect();popup.style.left=Math.max(8,Math.min(r.left-230,innerWidth-320))+'px';popup.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-440))+'px';showFilterOptions();const q=document.getElementById('columnQuery');q.oninput=()=>{filterQuery=q.value;showFilterOptions()};popup.onchange=ev=>{if(ev.target.matches('[data-value]')){ev.target.checked?filterDraft.add(ev.target.dataset.value):filterDraft.delete(ev.target.dataset.value);showFilterOptions()}};q.focus()}
function applyColumnFilter(){if(filterDraft.size)columnFilters[filterKey]=[...filterDraft];else delete columnFilters[filterKey];closeColumnFilter();renderTableOnly()}
document.addEventListener('click',ev=>{const button=ev.target.closest('[data-filter]');if(button){openColumnFilter(button.dataset.filter,button);return}if(filterKey&&!ev.target.closest('#columnFilterPopup'))closeColumnFilter()});
document.addEventListener('pointerdown',ev=>{const handle=ev.target.closest('[data-resize]');if(!handle)return;ev.preventDefault();closeColumnFilter();const key=handle.dataset.resize,start=ev.clientX,width=Number(handle.getAttribute('aria-valuenow'));document.body.classList.add('column-dragging');handle.setPointerCapture(ev.pointerId);const move=e=>setColumnWidth(key,width+e.clientX-start);const finish=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',finish);handle.removeEventListener('pointercancel',finish);document.body.classList.remove('column-dragging');save()};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeColumnFilter();const h=ev.target.closest?.('[data-resize]');if(h&&['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();setColumnWidth(h.dataset.resize,Number(h.getAttribute('aria-valuenow'))+(ev.key==='ArrowRight'?10:-10));save()}});

initializeStageNumbers();save();
render();
if(EMBEDDED_WBS){
 new MutationObserver(()=>window.parent.postMessage({type:'wbs-equipment:fullscreen',active:document.body.classList.contains('full-table')},'*')).observe(document.body,{attributes:true,attributeFilter:['class']});
 window.addEventListener('message',ev=>{if(ev.source===window.parent&&ev.data?.type==='wbs-equipment:exit-fullscreen')document.body.classList.remove('full-table')});
}
let initialSidebarCollapsed=false;try{initialSidebarCollapsed=localStorage.getItem('equipment-wbs-sidebar-collapsed')==='true'}catch{}
if(!EMBEDDED_WBS)setSidebarCollapsed(initialSidebarCollapsed);
</script>
</body></html>
