<script>

const EMBEDDED_WBS=window.parent!==window&&location.hash==='#embedded-wbs';
if(EMBEDDED_WBS)document.documentElement.classList.add('embedded-equipment');
const TODAY='2026-09-08',KEY='equipment-wbs-demo-v1';
const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',flag:'M5 21V3 M5 3h14l-3 4 3 4H5',table:'M3 4h18v16H3z M3 9h18 M3 14h18 M9 4v16',check:'M9 11l3 3L22 4 M21 12v8H3V3h13',clock:'M12 8v5l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',chevron:'M9 5l7 7-7 7',down:'M6 9l6 6 6-6',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',plus:'M12 5v14 M5 12h14',close:'M6 6l12 12 M18 6L6 18',arrow:'M4 12h16 M14 6l6 6-6 6',alert:'M12 3L2 21h20z M12 9v5 M12 17v.2',box:'M3 7l9-5 9 5v10l-9 5-9-5z M3 7l9 5 9-5 M12 12v10',download:'M12 3v12 M7 10l5 5 5-5 M4 16v5h16v-5',expand:'M8 3H3v5 M16 3h5v5 M3 16v5h5 M21 16v5h-5',help:'M9 8a3 3 0 1 1 4 3c-1 1-1 1-1 3 M12 17v.1 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',money:'M3 5h18v14H3z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0 M6 8v.1 M18 16v.1',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M17 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-4',refresh:'M20 7v5h-5 M4 17v-5h5 M5 7a8 8 0 0 1 13-2l2 3 M4 16l2 3a8 8 0 0 0 13-2'};
function icon(n){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.box}"/></svg>`}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v,d=2){return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}function pill(t,c=''){return `<span class="pill ${c}"><span class="dot"></span>${esc(t)}</span>`}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function clone(x){return JSON.parse(JSON.stringify(x))}
const defaultMilestones=[{id:'m1',name:'实验室启用',date:'2026-09-25',phase:'01 · 基础能力建设'},{id:'m2',name:'试产启动',date:'2026-10-20',phase:'02 · 工程验证'},{id:'m3',name:'可靠性验证',date:'2026-11-15',phase:'03 · 质量验证'}];
const milestones=clone(defaultMilestones);
function batch(id,qty,po,eta,delivered,accepted,price){return {id,qty,po,eta,price,deliveries:delivered?[{id:id+'d',qty:delivered,date:'2026-09-04'}]:[],acceptances:accepted?[{qty:accepted,date:'2026-09-06',signer:'李敏',note:'安装调试完成，验收通过'}]:[]}}
function equipment(id,name,desc,module,area,user,vendor,count,kcny,needs,batches,extra={}){return {id,name,desc,owner:{PTE:'陈昊',TD:'王宇',QRA:'李敏'}[module],module,area,user,sponsor:'研发中心',vendor,tool:'Unique',count,origin:vendor==='TEL'?'日本':vendor==='Eoulu'?'马来西亚 / 泰国':'中国',kcny,hookup:25.000,rmid:'20260901',year:'2026',category:'new EC',needs,batches,...extra}}
const seed={rate:7.2,equipment:[
equipment('EQ-001','KOV2-210B-F3','高温试验箱','QRA','C1 LAB','QRA','TEL',5,2160,{m1:2,m2:5,m3:5},[batch('PO-260801',2,'2026-08-12','2026-09-06',2,2,864),batch('PO-260917',3,'2026-09-01','2026-10-28',1,0,1296)],{sponsor:'质量与可靠性中心',origin:'日本'}),
equipment('EQ-002','Eoulu_F1_Probe_EFA','探针测试平台','PTE','Bench','PTE','Eoulu',4,3600,{m1:2,m2:4},[batch('PO-260802',2,'2026-08-15','2026-09-10',2,0,1800),batch('PO-260918',2,'2026-09-03','2026-10-10',0,0,1800)],{tool:'Common',category:'2pc Previous EC cover 2pc need new EC'}),
equipment('EQ-003','First Set Kit','安装工具套件','TD','C1 LAB','DEVICE','Eoulu',3,180,{m1:2,m2:3},[batch('PO-260803',3,'2026-08-10','2026-09-05',3,3,180)],{tool:'Common',category:'Previews EC cover'}),
equipment('EQ-004','CP Test System T200','晶圆测试系统','PTE','CP','PTE','广立微',2,5400,{m2:2},[batch('PO-260919',2,'2026-09-02','2026-10-12',0,0,5400)],{sponsor:'产品事业部'}),
equipment('EQ-005','DEVICE WA Station','器件分析工作站','TD','DEVICE WA','DEVICE','TEL',2,1440,{m1:1,m2:2,m3:2},[batch('PO-260805',1,'2026-08-18','2026-09-07',1,1,720),batch('PO-260920',1,'2026-09-04','',0,0,720)]),
equipment('EQ-006','HTOL Reliability Rack','高温寿命测试机架','QRA','C1 LAB','QRA','广立微',3,2880,{m3:3},[batch('PO-260921',2,'2026-09-05','2026-11-05',0,0,1920)],{sponsor:'质量与可靠性中心'}),
equipment('EQ-007','Bench Power Analyzer','精密电源分析仪','TD','Bench','DEVICE','广立微',4,432,{m1:2,m2:4},[batch('PO-260806',4,'2026-08-20','2026-09-06',4,4,432)],{tool:'Common',category:'Previews EC cover'}),
equipment('EQ-008','Thermal Chuck TC-300','温控卡盘','PTE','CP','PTE','TEL',2,864,{m2:2,m3:2},[batch('PO-260922',2,'2026-09-06','2026-10-15',0,0,864)])],actions:[{id:'a1',eq:'EQ-001',title:'协调试验箱第二批提前交付并完成验收',owner:'李敏',due:'2026-09-11',note:'当前预计 10/28 可用，晚于试产 8 天；需供应商确认提前交付方案。',done:false,escalated:true},{id:'a2',eq:'EQ-005',title:'确认器件分析工作站第二批预计可用日期',owner:'王宇',due:'2026-09-09',note:'采购已下单，供应商尚未确认调试与验收计划。',done:false,escalated:false},{id:'a3',eq:'EQ-006',title:'补足 HTOL 剩余 1 台采购需求',owner:'李敏',due:'2026-09-15',note:'可靠性验证累计需要 3 台，当前仅下单 2 台。',done:false,escalated:true}],events:[{time:'2026-09-08 09:40',eq:'EQ-001',text:'第二批预计可用日期由 10/15 调整为 10/28',kind:'风险'},{time:'2026-09-07 16:20',eq:'EQ-007',text:'精密电源分析仪 4 台完成签字验收',kind:'验收'},{time:'2026-09-07 10:30',eq:'EQ-006',text:'新增行动：补足 HTOL 剩余 1 台采购需求',kind:'行动'}],views:[],baseline:null};
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.equipment))state=clone(seed);if(!state.baseline){state.baseline=clone(seed.equipment);state.baseline[0].batches[1].eta='2026-10-15';state.baseline[6].batches[0].acceptances=[];state.baselineDate='2026-09-01'}
let page=EMBEDDED_WBS?'wbs':'dashboard',selectedMs='m2',drawerId=null,drawerTab='overview',search='',ownerFilter='',statusFilter='',groupBy='',activeView='',actionFilter='open';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('浏览器未允许本地保存，本次操作仍在当前页面有效')}}function event(eq,text,kind='修改',extra={}){state.events.unshift({time:new Date().toLocaleString('sv-SE').slice(0,16),eq,text,kind,actor:'Leader',...extra});save()}function toast(t){document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3200)}function sum(arr,fn){return arr.reduce((a,b)=>a+fn(b),0)}function delivered(b){return sum(b.deliveries,d=>d.qty)}function accepted(b){return sum(b.acceptances,a=>a.qty)}function ready(e){return sum(e.batches,accepted)}function ordered(e){return sum(e.batches,b=>b.qty)}function arrived(e){return sum(e.batches,delivered)}function eq(id){return state.equipment.find(e=>e.id===id)}
function initialStageValues(e,m){const need=e.needs[m.id]||0,current=ready(e),actualBy=sum(e.batches,b=>sum(b.acceptances,a=>a.date<=m.date?a.qty:0));let expected=actualBy,unknown=0;for(const b of e.batches){const pending=b.qty-accepted(b);if(!b.eta||b.eta<TODAY)unknown+=pending;else if(b.eta<=m.date)expected+=pending}const gap=Math.max(0,need-expected),short=Math.max(0,e.count-ordered(e));return {need,current,expected,gap,short,status:current>=need?'ready':gap===0?'ontrack':unknown>=gap?'unknown':'risk'}}
function stageData(e,m){e.stageNumbers ||= {};return e.stageNumbers[m.id] ||= {current:null,expected:null}}
function assessment(e,m){const need=e.needs[m.id]??null,current=stageData(e,m).current??null,gap=need===null||current===null?null:Math.max(0,need-current);return {need,current,gap,status:gap===null?'unknown':gap===0?'ready':'risk'}}
function initializeStageNumbers(){for(const e of state.equipment){if(!e.stageNumbers){e.stageNumbers={};for(const m of milestones){if(Object.hasOwn(e.needs,m.id)){const a=initialStageValues(e,m);e.stageNumbers[m.id]={current:a.current,expected:a.status==='unknown'?null:a.expected}}}}}}
function stageInput(e,m,key,value){return `<input class="inline" style="width:95px;border-color:var(--line)" aria-label="${esc(m.name)} ${key==='need'?'需求数量':key==='current'?'已准备数量':'预计按时已准备数量'}" type="number" min="0" step="1" value="${value??''}" placeholder="待填写" onchange="editStageNumber('${e.id}','${m.id}','${key}',this.value)">`}
function editStageNumber(id,mid,key,value){const e=eq(id),m=milestones.find(x=>x.id===mid);if(!e||!m)return;const blank=value.trim()==='';if(!blank&&!validNumber(value,true)){toast('请输入非负整数');refresh();return}const next=blank?null:Number(value),data=stageData(e,m),old=key==='need'?e.needs[mid]:data[key];if(old===next)return;if(key==='need')e.needs[mid]=next;else data[key]=next;const label={need:'需要数量',current:'已准备数量',expected:'预计按时已准备数量'}[key];const record={milestoneId:mid,field:key,before:old,after:next,actor:'Leader',at:new Date().toISOString()};(e.stageHistory ||= []).push(record);event(id,`Leader · ${m.name} · ${label}：${old??'未填写'} → ${next??'未填写'}`,'数量修改');refresh();toast('数量已保存，修改记录已保留')}

function overall(e){const checks=milestones.filter(m=>Object.hasOwn(e.needs,m.id)).map(m=>assessment(e,m));if(!checks.length)return'unknown';if(checks.some(c=>c.status==='risk'))return'risk';if(checks.some(c=>c.status==='unknown'))return'unknown';if(checks.every(c=>c.status==='ready'))return'ready';return'unknown'}
const statusNames={ready:'已备齐',risk:'未备齐',unknown:'待填写'};const statusColors={ready:'green',ontrack:'blue',risk:'red',unknown:'amber'};
function msStats(m){const list=state.equipment.filter(e=>Object.hasOwn(e.needs,m.id));const counts={ready:0,ontrack:0,risk:0,unknown:0};list.forEach(e=>counts[assessment(e,m).status]++);return{list,counts,total:list.length}}
function refresh(){render();if(drawerId)renderDrawer()}function go(p){if(EMBEDDED_WBS&&p!=='wbs'){document.body.classList.remove('full-table');window.parent.postMessage({type:'wbs-equipment:overview'},'*');return}closeColumnFilter();page=p;problemDrawerId=null;drawerId=null;document.getElementById('overlay').innerHTML='';render();window.scrollTo(0,0)}
function render(){const nav=[['dashboard','grid','项目总览'],['milestones','flag','里程碑'],['wbs','table','设备 WBS']];document.getElementById('nav').innerHTML=nav.map(([p,i,n])=>`<button class="${page===p?'active':''}" title="${n}" aria-label="${n}" onclick="go('${p}')">${icon(i)}<span class="nav-text">${n}</span>${p==='actions'?`<span class="count">${state.actions.filter(a=>!a.done).length}</span>`:''}</button>`).join('');document.getElementById('breadcrumb').textContent=nav.find(n=>n[0]===page)[2];document.getElementById('main').innerHTML=({dashboard:dashboard,milestones:milestonePage,wbs:wbs}[page]());document.getElementById('brandIcon').innerHTML=icon('box');document.getElementById('helpBtn').innerHTML=icon('help');enhanceColumns()}
function ruleHelp(text){return `<details class="rule-help"><summary title="查看规则说明" aria-label="查看规则说明">${icon('help')}</summary><div class="rule-text">${text}</div></details>`}
function header(title,subtitle,buttons=''){return `<div class="page-head between"><div><h1>${title}</h1></div><div class="row">${buttons}</div></div>`}
function leaderStatus(m){const labels={normal:'正常推进',risk:'有风险',done:'已达标'};return pill(labels[m.judgment]||'待填写',({normal:'blue',risk:'red',done:'green'})[m.judgment]||'amber')}
function milestoneFacts(m){const list=state.equipment.filter(e=>Object.hasOwn(e.needs,m.id));return {list,missing:list.filter(e=>assessment(e,m).status==='risk'),critical:list.filter(e=>e.stageCritical?.[m.id]&&assessment(e,m).status!=='ready'),amount:sum(list,e=>e.kcny)}}
function judgeMilestone(id){const m=milestones.find(x=>x.id===id);if(!m||!isLeader())return;modal('更新阶段状态',`<h3 style="margin-bottom:14px">${esc(m.name)} · ${m.date}</h3><div class="fields"><div class="field full"><label>达标条件</label><textarea name="goal" placeholder="填写本阶段需要达到的目标">${esc(m.goal||'')}</textarea></div><div class="field full"><label>阶段状态</label><select name="judgment" required><option value="">请选择</option>${[['normal','正常推进'],['risk','有风险'],['done','已达标']].map(([k,v])=>`<option value="${k}" ${m.judgment===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>状态说明</label><textarea name="note" required placeholder="说明当前进展，或影响达标的问题">${esc(m.judgmentNote||'')}</textarea></div></div>`,'保存状态',d=>{req(isLeader(),'仅 Leader 可修改判断');req(['normal','risk','done'].includes(d.judgment)&&d.note.trim(),'请选择状态并填写说明');const before={goal:m.goal||'',judgment:m.judgment||'',note:m.judgmentNote||''};m.goal=d.goal.trim();m.judgment=d.judgment;m.judgmentNote=d.note.trim();m.judgedBy='Leader';m.judgedAt=new Date().toISOString();(m.judgmentHistory ||= []).push({before,after:{goal:m.goal,judgment:m.judgment,note:m.judgmentNote},actor:'Leader',at:m.judgedAt});state.milestones=clone(milestones);event('',`Leader · ${m.name} · 阶段状态：${before.judgment||'待填写'} → ${m.judgment}；${m.judgmentNote}`,'阶段状态');closeModal();refresh();toast('阶段状态已保存')})}
function milestoneCards(){return `<div class="milestones">${milestones.map((m,i)=>{const f=milestoneFacts(m);return `<div class="milestone ${m.judgment==='risk'?'risk':m.judgment==='done'?'safe':''} ${page==='milestones'&&selectedMs===m.id?'selected':''}"><div class="milestone-title"><h2>${i+1}. ${esc(m.name)}</h2>${leaderStatus(m)}</div><div class="date">计划完成日期：${m.date}</div><p>${esc(m.goal||'达标条件待补充')}</p><p class="muted" style="font-size:13px;margin:10px 0 14px">${esc(m.judgmentNote||'请由 Leader 根据需求进展和问题填写阶段状态。')}</p><div class="between"><span>关联需求 ${f.list.length} 条</span><span class="${f.critical.length?'redtext':'muted'}">关键缺项 ${f.critical.length} 条</span></div><p class="small muted">未备齐 ${f.missing.length} 条 · 关联投入 ${money(f.amount)} KCNY</p><div class="milestone-note between"><button class="link" onclick="judgeMilestone('${m.id}')">${m.judgment?'更新状态':'填写状态'}</button><button class="link" onclick="selectedMs='${m.id}';go('milestones')">查看详情 ${icon('arrow')}</button></div></div>`}).join('')}</div>`}
function historyList(records){return records.length?records.map(x=>`<div class="timeline-item"><div class="timeline-time">${esc(x.time||x.at)} · ${esc(x.actor||'历史记录')}</div><div>${esc(x.text)}</div></div>`).join(''):'<p class="muted">暂无修改记录</p>'}
function tableEvents(id){return state.events.filter(x=>(!id||x.eq===id)&&x.eq&&['修改','字段修改','需求','导入'].includes(x.kind))}
function rowHistory(id){return `<details class="detail-section activity"><summary>字段修改记录</summary><div class="panel-body">${historyList(tableEvents(id))}</div></details>`}
function openTableHistory(){modal('总表修改记录',`<div class="fields"><div class="field full"><label>需求名称</label><input id="historyQuery" placeholder="输入名称查找" oninput="filterHistory()"></div><div class="field"><label>字段关键词</label><input id="historyField" placeholder="例如 Owner、PO" oninput="filterHistory()"></div><div class="field"><label>修改日期</label><input id="historyDate" type="date" onchange="filterHistory()"></div></div><div id="historyResults" style="margin-top:18px;max-height:380px;overflow:auto"></div>`,'关闭',closeModal);filterHistory()}
function filterHistory(){const q=document.getElementById('historyQuery').value.toLowerCase(),field=document.getElementById('historyField').value.toLowerCase(),date=document.getElementById('historyDate').value;const list=tableEvents().filter(x=>(eq(x.eq)?.name||'').toLowerCase().includes(q)&&x.text.toLowerCase().includes(field)&&(!date||x.time.slice(0,10)===date));document.getElementById('historyResults').innerHTML=historyList(list.map(x=>({...x,text:`${eq(x.eq)?.name||'已删除需求'} · ${x.text}`})))}
function stageHistory(m){return `<details class="batch activity"><summary>阶段状态修改记录</summary><div class="panel-body">${historyList([...(m.judgmentHistory||[])].reverse().map(x=>({at:x.at,actor:x.actor,text:`${({normal:'正常推进',risk:'有风险',done:'已达标'})[x.before.judgment]||'待填写'} → ${({normal:'正常推进',risk:'有风险',done:'已达标'})[x.after.judgment]||'待填写'}；条件：${x.after.goal||'未填写'}；说明：${x.after.note||'未填写'}`})))}</div></details>`}
function problemHistory(a){return `<details class="detail-section activity"><summary>问题修改记录</summary><div class="panel-body">${historyList(state.events.filter(x=>x.problemId===a.id||(!x.problemId&&x.eq===a.eq&&['问题','行动'].includes(x.kind)&&x.text.includes(a.title))))}</div></details>`}

function dashboard(){const rows=state.equipment,capex=sum(rows,e=>e.kcny),next=[...milestones].filter(m=>m.judgment!=='done').sort((a,b)=>a.date.localeCompare(b.date))[0],riskCount=milestones.filter(m=>m.judgment==='risk').length,poCount=rows.filter(e=>!!poValue(e)).length;return header('项目总览','','')+`<div class="cards overview-metrics"><button class="card metric-card" onclick="openView('')"><div class="muted">需求总投入 · USD$M</div><div class="metric">${money(capex/state.rate/1000,3)}</div><span class="metric-arrow">${icon('arrow')}</span></button><button class="card metric-card" ${next?`onclick="selectedMs='${next.id}';go('milestones')"`:'disabled'}><div class="muted">近期里程碑</div><div style="font-size:19px;font-weight:600;margin:10px 0">${esc(next?.name||'暂无待完成节点')}</div>${next?`<div class="between"><span class="small muted">${next.date}${next.date<TODAY?' · 已过计划日期':''}</span>${leaderStatus(next)}</div>`:''}</button><button class="card metric-card" onclick="overviewRiskOnly=true;render();focusOverview('leaderStages')"><div class="muted">有风险的里程碑</div><div class="metric ${riskCount?'redtext':''}">${riskCount} <small>个</small></div><span class="metric-arrow">${icon('arrow')}</span></button><button class="card metric-card" onclick="overviewCriticalOnly=true;render();focusOverview('leaderProblems')"><div class="muted">影响达标的未解决问题</div><div class="metric ${criticalProblems().length?'redtext':''}">${criticalProblems().length} <small>项</small></div><span class="metric-arrow">${icon('arrow')}</span></button></div>${leaderStages()}${leaderProblems()}<div class="between" style="margin-bottom:12px"><h2>需求投入分布</h2><select aria-label="投入分组" onchange="overviewSpend=this.value;render()">${[['module','按领域'],['sponsor','按出资方'],['year','按年度']].map(([k,v])=>`<option value="${k}" ${overviewSpend===k?'selected':''}>${v}</option>`).join('')}</select></div>${spendingPanel(overviewSpend,'需求投入 · KCNY')}<details class="panel activity"><summary>采购情况 <span class="small muted">需求规模、PO 登记与 EC 分类</span></summary><div class="panel-body"><div class="row" style="margin-bottom:16px"><span class="muted">${rows.length} 条需求 · ${sum(rows,e=>e.count)} 件</span><button onclick="openView('po')">已登记 PO ${poCount} 条</button><button onclick="openView('noPO')">尚未登记 PO ${rows.length-poCount} 条</button></div><table><thead><tr><th>EC Category</th><th>需求条数</th><th>需求总额 · KCNY</th></tr></thead><tbody>${[...new Set(rows.map(e=>e.category||''))].map(k=>{const list=rows.filter(e=>(e.category||'')===k);return `<tr><td><button class="link" data-value="${esc(k)}" onclick="filterFromOverview('category',this.dataset.value)">${esc(k||'未填写')}</button></td><td>${list.length}</td><td>${money(sum(list,e=>e.kcny))}</td></tr>`}).join('')}</tbody></table><p class="small muted" style="margin-top:12px">PO 登记不代表全部数量已下单；EC 分类不代表审批状态，分类金额不等于新 EC 申请金额。</p></div></details>`}

let milestoneAll=false;
function problemCell(a,key){const label={title:'当前问题',note:'下一步',due:'处理期限'}[key];return key==='due'?`<input class="stage-edit" type="date" aria-label="${label}" value="${esc(a[key])}" onchange="saveProblemCell('${a.id}','${key}',this.value)">`:`<textarea class="stage-edit" rows="2" aria-label="${label}" onchange="saveProblemCell('${a.id}','${key}',this.value)">${esc(a[key])}</textarea>`}
function saveProblemCell(id,key,value){const a=state.actions.find(x=>x.id===id);if(!a||!['title','note','due'].includes(key))return;value=value.trim();if(!value||(key==='due'&&!validDate(value))){toast(key==='due'?'请选择有效日期':'内容不能为空');refresh();return}const before=a[key];if(before===value)return;a[key]=value;event(a.eq,`${{title:'当前问题',note:'下一步',due:'处理期限'}[key]}：${before} → ${value}`,'问题',{problemId:id,before,after:value,field:key});refresh();toast('已保存，问题详情和总览已同步')}
function milestonePage(){const m=milestones.find(m=>m.id===selectedMs)||milestones[0];if(!m)return header('里程碑','','')+'<div class="panel empty">尚未设置里程碑，请由 Leader 在项目设置中新增。</div>';selectedMs=m.id;const linked=state.equipment.filter(e=>Object.hasOwn(e.needs,m.id)),critical=linked.filter(e=>e.stageCritical?.[m.id]&&state.actions.some(a=>a.eq===e.id&&!a.done)),list=linked;return header('里程碑','',`<button onclick="go('dashboard')">← 返回项目总览</button>`)+milestoneCards()+stageHistory(m)+`<section class="panel milestone-detail"><div class="panel-head between"><div><h2>${esc(m.name)}阶段详情</h2><span class="small muted">计划完成日期：${m.date}</span></div></div><div style="overflow:auto"><table style="white-space:normal"><thead><tr><th>设备需求</th><th>Owner</th><th>当前问题</th><th>下一步</th><th>处理期限</th><th></th></tr></thead><tbody>${list.map(e=>{const actions=state.actions.filter(a=>a.eq===e.id&&!a.done);return `<tr><td><button class="equipment-name" onclick="openDrawer('${e.id}')">${esc(e.name)}</button><div class="subname">${esc(e.desc)}</div></td><td>${editable(e,'owner','text','owners')}</td><td>${actions.map(a=>problemCell(a,'title')).join('<hr>')||`<button class="link" onclick="actionModal('${e.id}')">填写问题</button>`}</td><td>${actions.map(a=>problemCell(a,'note')).join('<hr>')||'—'}</td><td style="white-space:nowrap">${actions.map(a=>problemCell(a,'due')).join('<hr>')||'—'}</td><td><button class="link" style="white-space:nowrap" onclick="openDrawer('${e.id}','actions')">${actions.length?'跟进问题':'记录问题'}</button></td></tr>`}).join('')}</tbody></table></div>${list.length?'':'<div class="empty">本阶段暂无需求与问题</div>'}<div class="table-footer">${ruleHelp('展示当前阶段的全部需求与问题，点击需求名称查看原始字段，负责人、问题、下一步和期限可直接编辑，点击跟进问题查看详情。阶段状态由 Leader 维护。')}</div></section>`}

const defaultEquipmentCatalog={types:[{name:'Tester',children:['Tester Magnum 5 EV']},...['Prober','Handler','Oven','Card','Board','Tool'].map(name=>({name,children:[]}))],users:[{name:'PTE',children:['PTE CP','PTE FT','PTE Speed','PTE Array']},{name:'DEVICE',children:[]},{name:'QRA',children:[]}],stages:['预备','EC Pass','PR','PO','设计','制造','交付','验收','完成']};
const mappingDimensions={equipmentType:'设备类型',equipmentModel:'子类型／型号',currentStage:'当前阶段',user:'User',module:'Module',area:'Area',vendor:'Vendor',sponsor:'Sponsor'};
const mappingFilters={equipmentType:'',equipmentModel:'',currentStage:'',user:'',userChild:''};
function equipmentCatalog(){return state.equipmentCatalog||defaultEquipmentCatalog}
function distinctValues(values){return [...new Set(values.filter(value=>typeof value==='string'&&value!==''))]}
function equipmentTypes(){return distinctValues([...equipmentCatalog().types.map(item=>item.name),...state.equipment.map(item=>item.equipmentType)])}
function equipmentModels(type){return type?distinctValues([...(equipmentCatalog().types.find(item=>item.name===type)?.children||[]),...state.equipment.filter(item=>item.equipmentType===type).map(item=>item.equipmentModel)]):[]}
function equipmentStages(){return distinctValues([...equipmentCatalog().stages,...state.equipment.map(item=>item.currentStage)])}
function userParent(value){return equipmentCatalog().users.find(item=>item.name===value||item.children.includes(value))?.name||value||''}
function userRoots(){return distinctValues([...equipmentCatalog().users.map(item=>item.name),...state.equipment.map(item=>userParent(item.user))])}
function userChildren(parent){return equipmentCatalog().users.find(item=>item.name===parent)?.children||[]}
function userPath(value){const parent=userParent(value);return parent&&parent!==value?parent+' / '+value:value||''}
function userMatches(actual,selected){return !selected||actual===selected||userChildren(selected).includes(actual)}
function matchesMapping(item){return (!mappingFilters.equipmentType||item.equipmentType===mappingFilters.equipmentType)&&(!mappingFilters.equipmentModel||item.equipmentModel===mappingFilters.equipmentModel)&&(!mappingFilters.currentStage||item.currentStage===mappingFilters.currentStage)&&userMatches(item.user,mappingFilters.userChild||mappingFilters.user)}
function mappingPreferences(){return {group:'equipmentType',split:'currentStage',userLevel:'parent',...(state.mappingPreferences||{})}}
function mappingValue(item,key,userLevel){if(key==='user')return userLevel==='parent'?userParent(item.user):userPath(item.user);if(key==='equipmentModel')return item.equipmentModel?[item.equipmentType,item.equipmentModel].filter(Boolean).join(' / '):'';return String(item[key]||'')}
function aggregateEquipment(rows,options=mappingPreferences()){
 const buckets=new Map(),segments=new Set();let total=0;
 for(const item of rows){const quantity=Number(item.count)||0,label=mappingValue(item,options.group,options.userLevel)||'未填写',segment=options.split?(mappingValue(item,options.split,options.userLevel)||'未填写'):'需求数量';total+=quantity;segments.add(segment);if(!buckets.has(label))buckets.set(label,{label,total:0,segments:new Map()});const bucket=buckets.get(label);bucket.total+=quantity;bucket.segments.set(segment,(bucket.segments.get(segment)||0)+quantity)}
 return {total,rows:rows.length,segments:[...segments],groups:[...buckets.values()].map(bucket=>({...bucket,segments:[...bucket.segments].map(([label,value])=>({label,value}))}))};
}
function setEquipmentClassification(item,key,value){
 value=value.trim();req(['equipmentType','equipmentModel','currentStage','user'].includes(key),'字段无效');
 if(key==='equipmentType')req(!value||equipmentTypes().includes(value),'请先配置设备类型');
 if(key==='equipmentModel')req(!value||(item.equipmentType&&equipmentModels(item.equipmentType).includes(value)),'请先选择匹配的设备类型和子类型');
 if(key==='currentStage')req(!value||equipmentStages().includes(value),'请先配置当前阶段');
 const changes=[];if(String(item[key]||'')!==value){changes.push({key,before:item[key]||'',after:value});item[key]=value}
 if(key==='equipmentType'&&changes.length&&item.equipmentModel){changes.push({key:'equipmentModel',before:item.equipmentModel,after:''});item.equipmentModel=''}
 return changes;
}
function addEquipmentCatalogValue(kind,parent,value){
 value=value.trim();req(value&&value.length<=80,'请输入 1 至 80 字名称');req(['types','users','stages'].includes(kind),'配置类型无效');
 const next=clone(equipmentCatalog());
 if(kind==='stages'){req(!equipmentStages().includes(value),'阶段已存在');next.stages.push(value)}
 else if(kind==='types'){req(!parent||equipmentTypes().includes(parent),'一级设备类型不存在');if(parent){req(!equipmentModels(parent).includes(value),'子类型已存在');let root=next.types.find(item=>item.name===parent);if(!root){root={name:parent,children:[]};next.types.push(root)}root.children.push(value)}else{req(!equipmentTypes().includes(value),'设备类型已存在');next.types.push({name:value,children:[]})}}
 else{req(!parent||userRoots().includes(parent),'一级 User 不存在');req(!distinctValues([...userRoots(),...next.users.flatMap(item=>item.children),...state.equipment.map(item=>item.user)]).includes(value),'User 名称已存在');if(parent){let root=next.users.find(item=>item.name===parent);if(!root){root={name:parent,children:[]};next.users.push(root)}root.children.push(value)}else next.users.push({name:value,children:[]})}
 state.equipmentCatalog=next;
}
function openView(v){activeView=v;ownerFilter='';statusFilter='';search='';groupBy='';Object.keys(mappingFilters).forEach(key=>mappingFilters[key]='');Object.keys(columnFilters).forEach(k=>delete columnFilters[k]);if(v==='mine')ownerFilter='李敏';if(v==='risk')statusFilter='risk';if(v==='vendor')groupBy='vendor';if(v==='sponsor')groupBy='sponsor';go('wbs')}
function visibleRows(){return state.equipment.filter(e=>matchesMapping(e)&&passesColumns(e)&&(activeView!=='po'||!!poValue(e))&&(activeView!=='noPO'||!!!poValue(e))&&(!search||[e.name,e.desc,e.id,e.owner,e.vendor,e.module,e.area,e.user,e.sponsor,e.equipmentType,e.equipmentModel,e.currentStage].some(v=>String(v??'').toLowerCase().includes(search.toLowerCase())))&&(!ownerFilter||e.owner===ownerFilter)&&(!statusFilter||overall(e)===statusFilter)&&(activeView!=='acceptance'||arrived(e)>ready(e)))}
function wbs(){const rows=visibleRows(),capex=sum(rows,e=>e.kcny);let groups=groupBy?[...new Set(rows.map(e=>e[groupBy]||''))]:[''];return header('设备 WBS','',`<button onclick="document.body.classList.remove('full-table');go('dashboard')">← 返回项目总览</button>${EMBEDDED_WBS?`<button onclick="rateModal()">${icon('money')} 预算汇率</button>`:''}<button onclick="equipmentCatalogModal()">分类设置</button><button onclick="openTableHistory()">修改记录</button><button onclick="importModal()">${icon('download')} 导入</button><button onclick="exportCSV()">${icon('download')} 导出</button><button class="primary" onclick="newEquipment()">${icon('plus')} 新增需求</button>`)+`<div id="equipmentMapping">${equipmentMapping(rows)}</div><section class="panel"><div class="toolbar"><div class="search">${icon('search')}<input id="search" placeholder="搜索设备、负责人、供应商…" value="${esc(search)}" oninput="search=this.value;renderTableOnly()"></div><select aria-label="负责人筛选" onchange="ownerFilter=this.value;render()"><option value="">全部负责人</option>${[...new Set(state.equipment.map(e=>e.owner))].map(o=>`<option ${o===ownerFilter?'selected':''}>${esc(o)}</option>`).join('')}</select><select aria-label="状态筛选" onchange="statusFilter=this.value;render()"><option value="">全部准备状态</option>${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${k===statusFilter?'selected':''}>${v}</option>`).join('')}</select><select aria-label="分组" onchange="groupBy=this.value;render()">${[['','不分组'],['equipmentType','按设备类型分组'],['currentStage','按当前阶段分组'],['user','按 User 分组'],['module','按 Module 分组'],['area','按 Area 分组'],['vendor','按 Vendor 分组'],['sponsor','按 Sponsor 分组'],['year','按 Year 分组']].map(([k,v])=>`<option value="${k}" ${k===groupBy?'selected':''}>${v}</option>`).join('')}</select><span style="flex:1"></span><button class="icon" title="表格全屏" aria-label="表格全屏" onclick="document.body.classList.toggle('full-table')">${icon('expand')}</button></div><div id="tableContent">${tableContent(rows,capex,groups)}</div></section>`}
function renderTableOnly(){const rows=visibleRows();document.getElementById('tableContent').innerHTML=tableContent(rows,sum(rows,e=>e.kcny),groupBy?[...new Set(rows.map(e=>e[groupBy]||''))]:['']);const mapping=document.getElementById('equipmentMapping');if(mapping)mapping.innerHTML=equipmentMapping(rows);enhanceColumns()}
function editable(e,k,type='text',list=''){if(k==='user')return `<button class="link hierarchy-choice" aria-label="${esc(e.name)} User" onclick="editEquipmentUser('${e.id}')">${esc(userPath(e.user)||'未填写')}</button>`;if(['equipmentType','equipmentModel','currentStage'].includes(k)){const options=k==='equipmentType'?equipmentTypes():k==='equipmentModel'?equipmentModels(e.equipmentType):equipmentStages();return `<select class="inline field-choice" aria-label="${esc(fieldLabels[k])}" ${k==='equipmentModel'&&!e.equipmentType?'disabled':''} onchange="editClassification('${e.id}','${k}',this.value)">${selectOptions(options,e[k],'未填写')}</select>`}if(columnPresets[k]){const options=[...new Set(['',...columnPresets[k],...state.equipment.map(x=>String(x[k]??''))])];return `<select class="inline field-choice" aria-label="${esc(k)}" onchange="chooseField('${e.id}','${k}',this.value)">${options.map(v=>`<option value="${esc(v)}" ${String(e[k]??'')===v?'selected':''}>${esc(v||'未填写')}</option>`).join('')}<option value="__custom_input__">手动输入…</option></select>`}return `<input aria-label="${esc(e.name+' '+k)}" class="inline ${k==='kcny'?'money':''}" type="${type}" ${list?`list="${list}"`:''} value="${esc(e[k])}" onchange="inlineEdit('${e.id}','${k}',this.value)">`}
