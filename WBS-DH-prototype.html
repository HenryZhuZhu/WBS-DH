#templateDraftTable,:is(#caseDraftTasks,#caseEditTasks){max-height:calc(90vh - 250px);overflow:auto}
:is(#templateDraftTable,#caseDraftTasks,#caseEditTasks) .template-tasks{border-collapse:separate;border-spacing:0}
:is(#templateDraftTable,#caseDraftTasks,#caseEditTasks) th{position:sticky;top:0;z-index:2;background:#f8fafc;box-shadow:0 1px 0 var(--line)}
:is(#templateDraftTable,#caseDraftTasks,#caseEditTasks) th:first-child,:is(#templateDraftTable,#caseDraftTasks,#caseEditTasks) td:first-child{padding-left:0}
.case-create{display:grid;gap:18px}
.case-create-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.case-create-fields textarea{height:64px;min-height:64px}
.case-template-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:16px}
.case-template-toolbar>.field{grid-column:span 2;min-width:0}
.case-template-toolbar select{width:100%}
.case-template-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;gap:16px;min-width:0}
.case-template-choice select{min-width:0;text-overflow:ellipsis}
.case-template-version{flex-shrink:0;white-space:nowrap;font-size:12px;color:var(--muted)}
.case-create :is(#caseDraftTasks,#caseEditTasks){max-height:340px}
.case-create>section,.case-create>details{min-width:0;border-bottom:1px solid var(--line);padding-bottom:18px}
.case-create h3{margin-bottom:12px}
.case-create .case-template-heading>label{font:inherit;color:inherit}
.case-create details>summary{cursor:pointer;color:var(--blue)}
.task-requirements-cell{display:flex;align-items:center;justify-content:flex-start;width:100%;min-width:0;height:36px;padding:4px 6px;text-align:left;background:transparent;border-color:transparent;border-radius:6px}
.task-requirements-cell:hover,.task-requirements-cell[aria-expanded=true]{background:var(--blue-soft);border-color:var(--line)}
.task-requirements-cell .requirement-excerpt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:1.5}
.task-requirements-cell .requirement-empty{font-size:12px;color:var(--blue)}
.task-requirement-actions{display:flex;align-items:center;gap:2px;min-width:0}
.task-requirement-actions .task-requirements-cell{flex:0 1 auto;width:auto;max-width:45%}
.task-attachment-shortcut{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:32px;min-height:32px;padding:6px;color:var(--blue);background:transparent;border-color:transparent}
.task-attachment-shortcut svg{width:17px;height:17px}
.task-attachment-shortcut:hover,.task-attachment-shortcut[aria-expanded=true]{background:var(--blue-soft);border-color:var(--line)}
.task-attachment-count{position:absolute;top:-4px;right:-4px;display:flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border:2px solid var(--surface);border-radius:999px;background:var(--blue);color:#fff;font-size:9px;line-height:1}
.task-requirement-overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:#172b4540;overscroll-behavior:contain}
.task-requirement-popover{position:relative;z-index:81;display:flex;flex-direction:column;width:560px;max-width:100%;max-height:calc(100dvh - 48px);min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 48px #172b4530}
.task-requirement-popover .requirement-header{padding:24px 24px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.task-requirement-popover h3{font-size:18px;font-weight:600;line-height:1.5}
.task-requirement-popover .requirement-task-name{margin:6px 0 0;overflow-wrap:anywhere;font-size:12px;color:var(--muted)}
.task-requirement-popover .requirement-body{padding:24px;min-height:0;overflow:auto;overscroll-behavior:contain}
.task-requirement-popover .requirement-body>[role=group]{display:grid;gap:20px}
.task-requirement-popover .field{margin:0}
.task-requirement-popover textarea{height:120px;min-height:80px;resize:vertical}
.task-requirement-popover #requirementEditorEvidence{height:80px}
.task-requirement-popover .requirement-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--line);flex-shrink:0}
.task-requirement-popover .error:empty{display:none}
.requirement-file-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.requirement-file-row:last-child{border-bottom:0}
.requirement-file-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px}
.requirement-file-open{padding:0;text-align:left;background:transparent;border:0;color:var(--blue)}
.requirement-file-open:hover{text-decoration:underline}
.requirement-files-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}
.requirement-upload-button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;width:100%;border:1px dashed var(--line);background:var(--bg);color:var(--blue)}
.requirement-upload-button:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.task-requirement-popover input[type=file][hidden],#evidenceUpload[hidden],#requirementFileStatus:empty,#evidenceFileStatus:empty{display:none}
.compact-task-table{table-layout:fixed;min-width:800px}
.compact-task-table input,.compact-task-table select{min-width:0}
.compact-task-table td{overflow-wrap:anywhere}
.compact-task-table th:not(:first-child),.compact-task-table td:not(:first-child){padding-left:8px;padding-right:8px}

px;line-height:2\">\u003cli>查看「试产启动」的设备缺口。\u003c/li>\u003cli>打开高温试验箱，将第二批预计可用日期改为 2026-10-15。\u003c/li>\u003cli>对已到货的 1 台执行使用者签字验收。\u003c/li>\u003cli>在设备详情中将对应问题标记已解决。\u003c/li>\u003cli>返回总览，展开「最近变更」查看记录。\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"muted small\">业务日期固定为 2026-09-08；签名为演示模拟。Hookup 费用暂按 KCNY 单独显示。导入导出使用 Excel 可打开的 CSV，不包含批次或签名记录。\u003c/p>\u003cbutton type=\"button\" class=\"danger\" style=\"margin-top:15px\" onclick=\"resetModal()\">恢复初始演示数据\u003c/button>`,'知道了',()=>{closeModal()})}\nfunction resetModal(){modal('恢复演示数据',`\u003cp>将清除本原型在当前浏览器中的修改、签字验收和问题记录，恢复初始Case。\u003c/p>`,'确认恢复',()=>{state=clone(seed);state.baseline=clone(seed.equipment);state.baseline[0].batches[1].eta='2026-10-15';state.baseline[6].batches[0].acceptances=[];state.baselineDate='2026-09-01';milestones.splice(0,milestones.length,...clone(defaultMilestones));selectedMs='m2';initializeStageNumbers();save();closeModal();closeDrawer();go('dashboard');toast('初始演示数据已恢复')})}\nconst legacyCsvKeys=['name','owner','module','area','sponsor','user','vendor','tool','count','origin','kcny','rmid','hookup','usd','year','category'];\nconst csvKeys=[...legacyCsvKeys,'equipmentType','equipmentModel','currentStage'];\nfunction csvString(rows){return '\\ufeff'+rows.map(row=>row.map(v=>'\"'+String(v??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n')}\nfunction download(name,text,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}\nfunction exportCSV(template=false){const rows=template?[]:visibleRows();download(template?'设备需求导入模板.csv':'设备需求.csv',csvString([csvKeys.map(k=>fieldLabels[k]),...rows.map(e=>csvKeys.map(k=>k==='usd'?(e.kcny/state.rate/1000).toFixed(3):k==='hookup'?e[k].toFixed(3):k==='kcny'?e[k].toFixed(2):/^[=+@\\-]/.test(String(e[k]))?\"'\"+e[k]:e[k]))]));toast(template?'模板已下载':'当前视图的设备主字段已导出')}\nfunction parseCSV(text){text=text.re function applyWorkspaceFilter(){

    check(editor&&editor.mode===ui.page,'筛选窗口已失效，请重新打开');

    check(['owner','status','caseId'].every(key=>typeof draft[key]==='string')&&['blocked','overdue','fromCard'].every(key=>typeof draft[key]==='boolean'),'筛选条件格式无效');
    check(draft.scope===null||Array.isArray(draft.scope)&&draft.scope.every(id=>id==='unassigned'||ids.includes(id)),'所选 Project 不存在或无权查看，请重新选择');
    check(!draft.status||(editor.mode==='cases'?sharedStatusOptions:taskStatusOptions).some(([value])=>value===draft.status),'筛选状态无效');
    check(!draft.fromCard||editor.mode==='cases'&&selectedCaseMetric(draft)!=='all'&&Object.hasOwn(caseMetricLabels,selectedCaseMetric(draft)),'统计卡片来源无效，请重新选择状态');

function removeWorkspaceFilter(key){

function openWorkEntry({kind,item}){return !['done','terminated','rejected'].includes(item.status)&&!(kind==='task'&&taskCase(db,item)?.status!=='active');}
function byDue(a,b){return (validDate(a.item.due)?a.item.due:'9999-12-31').localeCompare(validDate(b.item.due)?b.item.due:'9999-12-31');}




function myOwnedEntries(includeClosed=false){
  const projects=myScopeProjects().map(item=>({kind:'project',item})),cases=myScopeCases().map(item=>({kind:'case',item})),tasks=myScopeTasks().map(item=>({kind:'task',item}));
  return [...projects,...cases,...tasks].filter(entry=>entry.item.owner===CURRENT_USER&&(includeClosed||openWorkEntry(entry))).sort(byDue);
}
function caseCreationIdentity(state,instance){
  const named=value=>typeof value==='string'&&value.trim();
  if(Object.hasOwn(instance,'createdBy')||Object.hasOwn(instance,'initialOwner'))return named(instance.createdBy)&&named(instance.initialOwner)?{creator:instance.createdBy,owner:instance.initialOwner}:null;
  const records=(state.assignments||[]).filter(record=>record.kind==='case'&&record.object===instance.id&&record.source==='create'),first=records[0];
  if(!first||!named(first.actor)||!named(first.to)||records.some(record=>record.from||record.actor!==first.actor||record.to!==first.to))return null;
  return {creator:first.actor,owner:first.to};
}
function myDelegatedEntries(){
  return myScopeCases().filter(instance=>{const identity=caseCreationIdentity(db,instance);return identity?.creator===CURRENT_USER&&identity.owner!==CURRENT_USER;}).map(item=>({kind:'case',item})).sort(byDue);

function objectHistoryHtml(kind,item){
  if(!visibleTo(db,CURRENT_USER,kind,item))return '';
  const records=assignmentRecordsFor(db,CURRENT_USER).filter(record=>record.kind===kind&&record.object===item.id).slice().reverse();
  const byId=new Map(records.map(record=>[record.id,record])),rendered=new Set();
  const renderRecord=record=>`<details class="assignment-history-entry" id="assignment-history-${escapeHtml(record.id)}" data-assignment-history-id="${escapeHtml(record.id)}"><summary><span class="tag">${responsibilityRecordTag(record)}</span>${escapeHtml(record.at||record.date||'时间未记录')}${record.at?' UTC':''} · ${escapeHtml(responsibilitySummary(record))}</summary>${assignmentSnapshotDetails(record)}</details>`;
  const history=(item.history||[]).map(event=>{
    if(event.responsibilityRecordId&&rendered.has(event.responsibilityRecordId))return '';
    if(event.responsibilityRecordId)rendered.add(event.responsibilityRecordId);
    const record=byId.get(event.responsibilityRecordId);
    if(!record)return historyHtml([event]);
    return renderRecord(record);
  }).join('');
  const unlinked=records.filter(record=>!rendered.has(record.id));
  return history+(unlinked.length?`<section class="assignment-history"><h3>责任记录（本人操作） · ${unlinked.length}</h3><p class="small muted">原始记录未关联到日志事件，保留当时信息。</p>${unlinked.map(renderRecord).join('')}</section>`:'');
}

function applyCaseEditorChanges(id,data,dueReasons={}){
  const instance=requireCaseOwnerEdit(db,id,CURRENT_USER);
  const editor=caseEditorDraft?.caseId===id?caseEditorDraft:null;
  check(!editor||JSON.stringify(instance)===editor.caseSnapshot,'Case信息已变化，请重新打开编辑Case');
  const current={name:instance.name,owner:instance.owner,start:instance.start,due:instance.due,background:instance.background||'',goal:instance.goal,completionStandard:instance.completionStandard||''};
  const values=Object.fromEntries(Object.entries(current).map(([key,value])=>[key,Object.hasOwn(data,key)?data[key]:value]));
  values.name=String(values.name||'').trim();values.background=String(values.background||'').trim();values.goal=String(values.goal||'').trim();values.completionStandard=String(values.completionStandard||'').trim();
  
  const changed=Object.keys(current).some(key=>Object.hasOwn(data,key)&&values[key]!==(['name','background','goal','completionStandard'].includes(key)?String(current[key]||'').trim():current[key]));
  let projectId=Object.hasOwn(data,'project')?data.project:instance.project||'';
  check(typeof projectId==='string','请选择有效的所属 Project');
  if(projectId==='__new_project__'){
    const fields=Object.fromEntries(['name','owner','start','due','goal'].map(key=>[key,data['newProject-'+key]||'']));
    projectId=createProjectRecord(fields).id;
  }
  validateCaseProjectDates(db,values,projectId);
  if(editor)editedTaskPlans(templateDraft,caseTasks(db,id),values.start,values.due);
  const ownerChanged=values.owner!==instance.owner;
  if(ownerChanged)requireAssignmentTarget(db,CURRENT_USER,'case',instance,values.owner);
  if(changed&&Object.keys(current).some(key=>key!=='owner'&&values[key]!==current[key])){
    const basicValues={name:values.name,owner:instance.owner,start:values.start,due:values.due,goal:values.goal,...(Object.hasOwn(data,'background')?{background:values.background}:{}),...(Object.hasOwn(data,'completionStandard')?{completionStandard:values.completionStandard}:{})};
    editCase(db,id,basicValues,CURRENT_USER,dueReasons['case:'+id],projectId);
  }
  if(projectId!==(instance.project||'')){moveCase(db,id,projectId,CURRENT_USER);if(projectId)db.selectedProject=projectId;}
  if(editor)saveCaseTaskList(db,id,templateDraft,CURRENT_USER,editor.tasksSnapshot,dueReasons);
  if(ownerChanged)assignWork(db,'case',id,values.owner,data.assignmentReason||'编辑Case时调整负责人',CURRENT_USER);
  return findCase(db,id);
}

async function readLocalAttachmentFiles(files,existing){
  check(files.every(file=>file.size<=750*1024),'单份文件不能超过 750 KB');
  check(files.reduce((total,file)=>total+file.size,0)+existing.reduce((total,file)=>total+file.size,0)<=2*1024*1024,'本次文件合计不能超过 2 MB');
  return Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({id:makeId('file'),name:file.name,size:file.size,type:file.type,data:reader.result});reader.onerror=()=>reject(Error('文件读取失败：'+file.name));reader.readAsDataURL(file);})));
}
async function readEvidenceFiles(input){

function ganttTaskLifecycle(task){
  const start=validDate(task.start)?task.start:'',due=validDate(task.due)?task.due:'';
  const explicitEnd=task.status==='done'?task.completedAt:task.status==='rejected'?task.rejectedAt:task.status==='terminated'?task.terminatedAt:'';
  const progressEnd=validDate(explicitEnd)?explicitEnd:validDate(start)&&validDate(db.today)&&db.today>=start?db.today:'';
  const normalizedEnd=validDate(start)&&validDate(progressEnd)&&progressEnd>=start?progressEnd:'';
  const tone=task.status==='done'?'completed':task.status==='active'?'active':'inactive',overdue=validDate(due)&&validDate(normalizedEnd)&&normalizedEnd>due;
  return {start,due,progressStart:normalizedEnd?start:'',progressEnd:normalizedEnd,endedAt:validDate(explicitEnd)?explicitEnd:'',tone,overdue,state:overdue?'overdue':tone};
}
function ganttScheduleCaption(task,lifecycle=ganttTaskLifecycle(task)){
  const due=lifecycle.due;

  panel.style.left=left+'px';panel.style.top=top+'px';

  closeWorkspaceFilter(false);closeSuggestions();
  notificationPopoverState={anchor};anchor.setAttribute?.('aria-expanded','true');
  document.getElementById('modalRoot').innerHTML='<div id="notificationPopoverOverlay" class="notification-overlay" onclick="if(event.target===this)closeNotificationPopover()"><section id="notificationPopover" class="notification-popover" role="dialog" aria-modal="true" aria-label="通知" tabindex="-1"></section></div>';
  renderNotificationPopover();
  const panel=document.getElementById('notificationPopover');(panel.querySelector?.('button')||panel).focus?.({preventScroll:true});
}
function closeNotificationPopover(restoreFocus=true){
  const previous=notificationPopoverState;if(!previous)return;
  notificationPopoverState=null;document.getElementById('notificationPopoverOverlay')?.remove?.();
  previous.anchor?.setAttribute?.('aria-expanded','false');
  if(restoreFocus&&previous.anchor?.isConnected)previous.anchor.focus({preventScroll:true});
}
function notificationsPage(){return notificationPopoverContent();}
function runNoticeScan(){handleOperation(()=>{const count=scanNotifications(db);ui.scanCount=count;},'时间线已检查，重复提醒已去重');}
function openNotification(id){
  const entry=personalNotificationEntries().find(({message})=>message.id===id);
  if(!entry)return toast('通知已失效或对应工作无权查看');
  closeNotificationPopover();
  if(!openObject(entry.message.kind,entry.message.object))return;
  if(!entry.message.read){
    try{transact(()=>{db.messages.find(message=>message.id===id).read=true;});}
    catch(error){toast('通知已打开，但已读状态未保存：'+error.message);}
  }
}
function messageDetails(id){const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object);modal('双渠道发送记录',`<div class="stack"><div class="note">同一通知事件，两个独立渠道；全部为本地模拟结果。</div><dl class="detail-grid"><div><dt>接收人</dt><dd>${message.recipient}</dd></div><div><dt>通知类型</dt><dd>${message.overdue?'超期提醒':'普通提醒'}</dd></div><div class="wide"><dt>业务对象</dt><dd>${escapeHtml(item?.name)}</dd></div></dl>${Object.entries(message.channels).map(([channel,result])=>`<div class="between"><div><h3>${channel==='email'?'邮件':'Hems'}</h3><span class="small muted">${result.status==='simulated'?'模拟已发送':result.status==='failed'?'模拟失败':'旧提醒已取消'} · 尝试 ${result.attempts} 次</span></div>${result.status==='simulated'?`<button type="button" onclick="simulateDeliveryFailure('${id}','${channel}')">模拟发送失败</button>`:result.status==='failed'?`<button type="button" onclick="retryDelivery('${id}','${channel}')">重试此渠道</button>`:''}</div>`).join('')}</div>`,'关闭',closeModal);}
function simulateDeliveryFailure(id,channel){try{transact(()=>{db.messages.find(item=>item.id===id).channels[channel].status='failed';});messageDetails(id);}catch(error){toast(error.message);}}
function retryDelivery(id,channel){try{transact(()=>{const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object),delivery=message.channels[channel];check(delivery.status==='failed','仅重试失败渠道');check(delivery.attempts<=db.notification.retries,'已达到建议重试上限，请联系通知维护人员');if(!item||!visibleTo(db,message.recipient,message.kind,item)||(message.reason==='daily'&&(item.status==='done'||item.due!==message.due||item.status!==message.objectStatus))||(message.reason==='event'&&item.status!==message.objectStatus)){delivery.status='cancelled';return;}delivery.attempts++;delivery.status='simulated';});messageDetails(id);render();}catch(error){toast(error.message);}}
function noticeRulesModal(){
  const config=db.notification;modal('时间线提醒规则',`<div class="fields">${inputField('首次临期 · 提前天数','lead',config.lead,'number',false,'required min="2" max="30"')}${inputField('再次临期 · 提前天数','near',config.near,'number',false,'required min="1" max="29"')}${inputField('每日检查时点 · 小时','scanHour',config.scanHour,'number',false,'required min="0" max="23"')}</div>`,'保存',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');const lead=Number(data.lead),near=Number(data.near),scanHour=Number(data.scanHour);check(Number.isInteger(lead)&&Number.isInteger(near)&&lead>near&&near>0&&Number.isInteger(scanHour)&&scanHour>=0&&scanHour<=23,'提醒日期或检查时点无效');Object.assign(db.notification,{lead,near,scanHour});},'提醒规则已保存'));
}
function settingsPage(){const project=selectedProject(),heading=pageHead('Project设置','',`<button onclick="assignmentPermissionsModal()">责任权限</button>`);if(!project)return heading+empty('请先创建 Project');return heading+`<div class="setting-grid"><section class="panel"><div class="panel-head between"><h2>Project责任与时间</h2><button class="link small" ${can('settings')?'':'disabled'} onclick="editProjectModal()">编辑</button></div><div class="panel-body"><dl class="detail-grid">${project.goal?.trim()?`<div class="wide"><dt>目标与交付</dt><dd>${escapeHtml(project.goal)}</dd></div>`:''}<div><dt>Project负责人</dt><dd>${escapeHtml(project.owner)}</dd></div><div><dt>开始日期</dt><dd>${project.start}</dd></div><div><dt>完成日期</dt><dd>${project.due}</dd></div><div><dt>当前状态</dt><dd>${badge(project)}</dd></div></dl></div></section><section class="panel"><div class="panel-head between"><h2>演示时间与保存</h2><button class="link small" onclick="demoDateModal()">调整日期</button></div><div class="panel-body"><div class="between"><strong style="font-size:28px" class="mono">${db.today}</strong><span class="tag">Asia/Shanghai</span></div><p class="small muted" style="margin:15px 0">页面打开期间每分钟检查业务日期下的提醒。关闭页面后不运行服务。实际发送、生产权限与身份认证需后端接入。</p><button onclick="showHelp()">${icon('help')} 演示约定</button><div class="row wrap" style="margin-top:17px"><button onclick="downloadPrototype()">${icon('download')} 下载完整 HTML${PROTOTYPE_FEATURES.equipmentWbs?'（含设备页）':''}</button>${PROTOTYPE_FEATURES.equipmentWbs?`<button class="link small" onclick="navTo('equipment')">查看内置设备 WBS</button>`:''}</div><p class="small muted">只需一个 HTML，无需其他文件或压缩包。下载包含演示程序，不包含当前浏览器的业务数据与上传附件。</p></div></section></div><section class="panel" style="margin-top:22px"><div class="panel-head between"><h2>角色权限</h2><button class="link small" onclick="permissionModal()" ${can('settings')?'':'disabled'}>配置</button></div><table class="role-table"><thead><tr><th>角色</th><th>数据查看</th><th>创建与管理</th><th>模版配置</th><th>设置管理</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${escapeHtml(roleLabel(role))}</td><td>${policy.view==='all'?'全部Project范围':'本人参与对象及相关上层'}</td><td>${policy.caseEdit?'允许':'不允许'}</td><td>${policy.template?'允许':'不允许'}</td><td>${policy.settings?'允许':'不允许'}</td></tr>`).join('')}</tbody></table><div class="summary-line">创建与管理沿用原创建、Task编辑及受控终止权限；编辑Case另按当前Owner及状态校验，不因管理员角色越权。完成只由对象负责人确认。</div></section><details class="panel"><summary class="panel-head">Project与设置修改记录</summary><div class="panel-body">${historyHtml(db.events.filter(record=>record.object===project.id||!record.object).slice(0,25))}</div></details>`;}
function demoDateModal(){modal('调整演示业务日期',`${inputField('业务日期','today',db.today,'date',true,'required')}<div class="notice" style="margin-top:16px">用于演示临期、到期和超期提醒，不修改Task日期或完成结果。建议向后推进；不会向外部发送任何消息。</div>`,'更新并检查',data=>handleOperation(()=>{check(validDate(data.today),'日期无效');check(data.today>=db.today,'为保留历史时序，业务日期只允许向后推进；需要回退请恢复初始Case');db.today=data.today;scanNotifications(db);if(PROTOTYPE_FEATURES.reports)runScheduledReports(db);},PROTOTYPE_FEATURES.reports?'业务日期已更新，提醒和报表计划已检查':'业务日期已更新，提醒已检查'));}
function projectForm(project={},prefix=''){
  const field=key=>prefix+key;
  return `<div class="fields">${inputField('Project名称',field('name'),project.name||'','text',true,'required maxlength="80"')}${peopleSelect(field('owner'),project.owner||CURRENT_USER,'Project负责人').replace('class="field"','class="field full"')}${inputField('开始日期',field('start'),project.start||db.today,'date',false,'required')}${inputField('完成日期',field('due'),project.due||shiftDate(db.today,45),'date',false,'required')}<div class="field full"><label for="${field('goal')}">目标与交付</label><textarea id="${field('goal')}" name="${field('goal')}">${escapeHtml(project.goal||'')}</textarea></div></div>`;
}
function validateProjectData(data){
  requireOwnerOnlyData(data);
  const name=String(data.name||'').trim();check(name&&name.length<=80,'请填写80字以内的Project名称');check(PEOPLE.includes(data.owner),'请选择有效的Project负责人');check(validDate(data.start)&&validDate(data.due)&&data.due>=data.start,'Project日期无效');
  return {name,goal:String(data.goal||'').trim(),owner:data.owner,start:data.start,due:data.due};
}
function editProject(state,id,data,actor,dueReason=''){
  requirePermission(state,actor,'settings');const current=findProject(state,id);
  check(current&&visibleTo(state,actor,'project',current),'Project不存在或无权查看');
  check(current.status==='active','已完成Project不能修改责任与日期');
  const values=validateProjectData(data);validateProjectCasesDates(state,id,values.start,values.due);
  const dateReason=dueDateChangeReason(current,values.due,dueReason),previousDue=current.due,previous=current.owner,before=assignmentSnapshot(state,'project',current);
  if(values.owner!==previous)requireAssignmentTarget(state,actor,'project',current,values.owner);
  Object.assign(current,values);const adjustment=logEvent(state,current,'更新Project责任与有效日期',actor);
  recordDueDateChange(state,current,previousDue,current.due,dateReason,actor);
  if(previous!==current.owner){const record=recordAssignment(state,'project',current,actor,previous,'调整 Project 负责人','edit',before);linkResponsibilityEvent(current,adjustment,record);}
  return current;
}
function newProjectModal(){if(!can('caseEdit'))return toast('没有新建权限');modal('新建 Project',projectForm()+`<section style="margin-top:20px"><h3>关联未归属 Case（可选）</h3>${unassignedCaseChoices()}</section>`,'创建Project',(data,form)=>handleOperation(()=>{const project=createProjectRecord(data,form?[...new FormData(form).getAll('caseIds')]:[]);db.selectedProject=project.id;navigationHistory.length=0;Object.assign(ui,{page:'overview',caseId:null,summaryQuery:'',summaryOwner:'',summaryStatus:'',summaryProjectIds:null});},'Project已创建'));}
function editProjectModal(id=selectedProject()?.id){
  const project=findProject(db,id);if(!project||!visibleTo(db,CURRENT_USER,'project',project)||!can('settings'))return toast('Project不存在或没有设置权限');
  const form=projectForm(project).replace(peopleSelect('owner',project.owner,'Project负责人'),responsibilityOwnerField('project',project,'Project负责人'));
  modal('编辑Project',form,'保存Project',data=>{
    try{
      const values=validateProjectData(data),current=findProject(db,id);validateProjectCasesDates(db,id,values.start,values.due);
      const entries=current&&current.due!==values.due?[{key:'project:'+id,kind:'Project',name:current.name,from:current.due,to:values.due}]:[];
      requestDueDateChangeReasons(entries,reasons=>handleOperation(()=>editProject(db,id,data,CURRENT_USER,reasons['project:'+id]),'Project设置已保存'));
    }catch(error){const target=document.getElementById('modalError');if(target)target.textContent=error.message;else toast(error.message);}
  });
}
function permissionModal(){if(!can('settings'))return toast('没有设置权限');modal('分级权限配置',`<table><thead><tr><th>角色</th><th>查看范围</th><th>创建与管理</th><th>模版配置</th><th>设置</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${escapeHtml(roleLabel(role))}</td><td><select name="${role}-view"><option value="assigned" ${policy.view==='assigned'?'selected':''}>参与对象</option><option value="all" ${policy.view==='all'?'selected':''}>全部范围</option></select></td>${['caseEdit','template','settings'].map(key=>`<td><input type="checkbox" aria-label="${role} ${key}" name="${role}-${key}" ${policy[key]?'checked':''} ${role==='leader'&&key==='settings'?'disabled':''}></td>`).join('')}</tr>`).join('')}</tbody></table><div class="note" style="margin-top:15px">创建与管理保留原创建、Task编辑及受控终止权限；编辑Case仅由当前Owner在允许状态下操作。只有设置权限人员可保存配置，生产授权需在服务端执行。</div><div class="fields" style="margin-top:15px">${peopleSelect('preview','王宇','权限范围预览')}<div class="field"><label>查看结果</label><button type="button" onclick="previewPermission(document.querySelector('[name=preview]').value)">检查当前权限</button></div></div><div id="permissionPreview" class="small muted" style="margin-top:12px"></div>`,'保存权限',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');for(const role of Object.keys(db.permissions)){db.permissions[role]={...db.permissions[role],view:data[role+'-view'],caseEdit:!!data[role+'-caseEdit'],template:!!data[role+'-template'],settings:role==='leader'||!!data[role+'-settings']};}logEvent(db,null,'更新角色权限配置');},'权限配置已保存'),true);}
function previewPermission(actor){const cases=db.cases.filter(item=>visibleTo(db,actor,'case',item)),tasks=db.tasks.filter(item=>visibleTo(db,actor,'task',item)),policy=db.permissions[db.userRoles[actor]],editable=cases.filter(item=>!caseEditBlockReason(db,item,actor));document.getElementById('permissionPreview').textContent=`${actor}：可查看 ${cases.length} 个 Case、${tasks.length} 项 Task；当前可编辑本人 Case ${editable.length} 个；模版配置${policy.template?'允许':'不允许'}，创建与管理${policy.caseEdit?'允许':'不允许'}。` ;}

document.addEventListener('keydown',event=>{if(event.key==='Escape'){const caseMenu=document.getElementById('projectCaseAddMenu');if(caseMenu?.hidden===false){event.preventDefault();closeProjectCaseMenu(true);return;}if(notificationPopoverState){event.preventDefault();closeNotificationPopover();return;}if(workspaceFilterState){event.preventDefault();closeWorkspaceFilter();return;}if(taskRequirementEditorState){event.preventDefault();closeTaskRequirementEditor();return;}if(caseDraftChoiceState){event.preventDefault();cancelCaseDraftChoice();return;}if(document.getElementById('modalRoot').innerHTML)closeModal();else closeDrawer();}if(event.key==='Tab'){const dialog=document.querySelector('.notification-popover')||document.querySelector('.workspace-filter-popover')||document.querySelector('.task-requirement-popover')||document.querySelector('.case-draft-choice-modal')||document.querySelector('.modal')||document.querySelector('.drawer');if(!dialog)return;const controls=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary')].filter(node=>node.getClientRects().length);if(!controls.length){if(notificationPopoverState){event.preventDefault();dialog.focus();}return;}const first=controls[0],last=controls.at(-1);if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}}});
