kindLabels[message.kind]} · ${escapeHtml(item?.name||'对象已移除')} · 接收人 ${escapeHtml(message.recipient)}</div><div class="row" style="margin-top:8px">${Object.entries(message.channels).map(([channel,result])=>`<span class="channel ${result.status==='failed'?'bad':''}">${icon(channel==='email'?'mail':'external')} ${channel==='email'?'邮件':'Hems'} · ${result.status==='simulated'?'模拟已发送':result.status==='failed'?'模拟失败':'已取消'}${result.attempts>1?' · '+result.attempts+' 次':''}</span>`).join('')}${item?.status==='done'?'<span class="small good">当前已完成</span>':''}</div></div><div class="row" style="justify-content:flex-end"><button class="icon" title="发送记录" aria-label="查看发送记录" onclick="messageDetails('${message.id}')">${icon('eye')}</button>${!message.read?`<button class="icon" title="标记已读" aria-label="标记已读" onclick="handleOperation(()=>{db.messages.find(item=>item.id==='${message.id}').read=true},'已标记已读')">${icon('check')}</button>`:''}</div></div>`}).join('')||empty('暂无符合条件的通知')}<div class="summary-line">同一对象、接收人、业务日期去重；邮件与 Hems 分别记录结果。${messages.length>100?'当前展示最近 100 条。':''}</div></section>`;}
function runNoticeScan(){handleOperation(()=>{const count=scanNotifications(db);ui.scanCount=count;},'时间线已检查，重复提醒已去重');}
function openNotification(id){const message=db.messages.find(item=>item.id===id);if(!message)return;message.read=true;try{persist();}catch{}render();openObject(message.kind,message.object);}
function messageDetails(id){const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object);modal('双渠道发送记录',`<div class="stack"><div class="note">同一通知事件，两个独立渠道；全部为本地模拟结果。</div><dl class="detail-grid"><div><dt>接收人</dt><dd>${message.recipient}</dd></div><div><dt>通知等级</dt><dd>${message.level?'L'+message.level:'普通提醒'}</dd></div><div class="wide"><dt>业务对象</dt><dd>${escapeHtml(item?.name)}</dd></div></dl>${Object.entries(message.channels).map(([channel,result])=>`<div class="between"><div><h3>${channel==='email'?'邮件':'Hems'}</h3><span class="small muted">${result.status==='simulated'?'模拟已发送':result.status==='failed'?'模拟失败':'旧提醒已取消'} · 尝试 ${result.attempts} 次</span></div>${result.status==='simulated'?`<button type="button" onclick="simulateDeliveryFailure('${id}','${channel}')">模拟发送失败</button>`:result.status==='failed'?`<button type="button" onclick="retryDelivery('${id}','${channel}')">重试此渠道</button>`:''}</div>`).join('')}</div>`,'关闭',closeModal);}
function simulateDeliveryFailure(id,channel){try{transact(()=>{db.messages.find(item=>item.id===id).channels[channel].status='failed';});messageDetails(id);}catch(error){toast(error.message);}}
function retryDelivery(id,channel){try{transact(()=>{const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object),delivery=message.channels[channel];check(delivery.status==='failed','仅重试失败渠道');check(delivery.attempts<=db.notification.retries,'已达到建议重试上限，请联系通知维护人员');if(!item||!visibleTo(db,message.recipient,message.kind,item)||(message.reason==='daily'&&(item.status==='done'||item.due!==message.due||item.status!==message.objectStatus))||(message.reason==='event'&&item.status!==message.objectStatus)){delivery.status='cancelled';return;}delivery.attempts++;delivery.status='simulated';});messageDetails(id);render();}catch(error){toast(error.message);}}
function noticeRulesModal(){const config=db.notification;modal('时间线提醒规则',`<div class="notice" style="margin-bottom:18px">建议默认值，可配置；当前演示工作区共用规则。不会改变任务验收层级。</div><div class="fields">${inputField('首次临期 · 提前天数','lead',config.lead,'number',false,'required min="2" max="30" step="1"')}${inputField('再次临期 · 提前天数','near',config.near,'number',false,'required min="1" max="29" step="1"')}${inputField('二级报警 · 超期天数','second',config.second,'number',false,'required min="2" max="60" step="1"')}${inputField('三级报警 · 超期天数','third',config.third,'number',false,'required min="3" max="90" step="1"')}${inputField('验收等待 · 天数','wait',config.wait,'number',false,'required min="1" max="30" step="1"')}${inputField('每日检查时点 · 小时','scanHour',config.scanHour,'number',false,'required min="0" max="23" step="1"')}</div><div class="note" style="margin-top:15px">一级报警从超期第 1 天起。Task 二级增加 Case 负责人、三级增加 Project 负责人；Case 二级增加 Project 负责人，三级增加监督接收人。未配置监督接收人时不虚构人员。</div>`,'保存规则',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');const next=Object.fromEntries(Object.entries(data).map(([key,value])=>[key,Number(value)]));check(Object.values(next).every(Number.isInteger)&&next.lead>next.near&&next.near>0&&next.third>next.second&&next.second>1&&next.wait>0&&next.scanHour>=0&&next.scanHour<=23,'请满足提前天数递减、报警天数递增的规则');Object.assign(db.notification,next);logEvent(db,null,'更新时间线通知规则');},'提醒规则已保存'));}
function settingsPage(){const project=selectedProject();return pageHead('项目设置','',`<button ${can('caseEdit')?'':'disabled'} onclick="newProjectModal()">${icon('plus')} 新建 Project</button>`)+`<div class="setting-grid"><section class="panel"><div class="panel-head between"><h2>项目责任与时间</h2><button class="link small" ${can('settings')?'':'disabled'} onclick="editProjectModal()">编辑</button></div><div class="panel-body"><dl class="detail-grid"><div class="wide"><dt>项目目标</dt><dd>${escapeHtml(project.goal)}</dd></div><div><dt>项目负责人</dt><dd>${project.owner}</dd></div><div><dt>Project 验收人</dt><dd>${project.reviewers.join(' → ')}</dd></div><div><dt>计划开始</dt><dd>${project.start}</dd></div><div><dt>计划完成</dt><dd>${project.due}</dd></div><div><dt>监督接收人</dt><dd>${project.oversight||'未配置'}</dd></div><div><dt>当前状态</dt><dd>${badge(project)}</dd></div></dl></div></section><section class="panel"><div class="panel-head between"><h2>演示时间与保存</h2><button class="link small" onclick="demoDateModal()">调整日期</button></div><div class="panel-body"><div class="between"><strong style="font-size:28px" class="mono">${db.today}</strong><span class="tag">Asia/Shanghai</span></div><p class="small muted" style="margin:15px 0">页面打开期间每分钟检查业务日期下的通知与报表计划。关闭页面后不运行服务。实际发送、生产权限与身份认证需后端接入。</p><button onclick="showHelp()">${icon('help')} 演示约定</button><div class="row wrap" style="margin-top:17px"><button onclick="downloadPrototype()">${icon('download')} 下载原型 HTML</button><a class="small" href="Equipment-WBS-prototype.html" target="_blank">原设备 WBS</a></div></div></section></div><section class="panel" style="margin-top:22px"><div class="panel-head between"><h2>角色权限</h2><button class="link small" onclick="permissionModal()" ${can('settings')?'':'disabled'}>配置</button></div><table class="role-table"><thead><tr><th>角色</th><th>数据查看</th><th>Case 创建 / 调整</th><th>模板配置</th><th>设置管理</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${{leader:'Leader',member:'执行成员',reviewer:'验收人员'}[role]}</td><td>${policy.view==='all'?'全部项目范围':'本人参与对象及相关上层'}</td><td>${policy.caseEdit?'允许':'不允许'}</td><td>${policy.template?'允许':'不允许'}</td><td>${policy.settings?'允许':'不允许'}</td></tr>`).join('')}</tbody></table><div class="summary-line">角色决定可见与操作范围；具体任务执行、各层验收仍由指定人员负责，不因角色权限自动成为验收人。</div></section><details class="panel"><summary class="panel-head">项目与设置修改记录</summary><div class="panel-body">${historyHtml(db.events.filter(record=>record.object===project.id||!record.object).slice(0,25))}</div></details>`;}
function demoDateModal(){modal('调整演示业务日期',`${inputField('业务日期','today',db.today,'date',true,'required')}<div class="notice" style="margin-top:16px">用于演示临期和超期升级，不修改任务日期或验收结果。建议向后推进；不会向外部发送任何消息。</div>`,'更新并检查',data=>handleOperation(()=>{check(validDate(data.today),'日期无效');check(data.today>=db.today,'为保留历史时序，业务日期只允许向后推进；需要回退请恢复初始案例');db.today=data.today;scanNotifications(db);runScheduledReports(db);},'业务日期已更新，提醒和报表计划已检查'));}
function projectForm(project={}){return `<div class="fields">${inputField('项目名称','name',project.name||'','text',true,'required maxlength="80"')}<div class="field full"><label>项目目标</label><textarea name="goal" required>${escapeHtml(project.goal||'')}</textarea></div>${peopleSelect('owner',project.owner||'陈昊','负责人')}${peopleSelect('reviewer',project.reviewers?.[0]||'刘洋','Project 验收人')}${peopleSelect('oversight',project.oversight||'','监督接收人',true)}${inputField('开始日期','start',project.start||db.today,'date',false,'required')}${inputField('完成日期','due',project.due||shiftDate(db.today,45),'date',false,'required')}</div>`;}
function validateProjectData(data){check(data.name.trim()&&data.goal.trim(),'请填写名称和目标');check(validDate(data.start)&&validDate(data.due)&&data.due>=data.start,'项目日期无效');return {...data,name:data.name.trim(),goal:data.goal.trim(),reviewers:[data.reviewer]};}
function newProjectModal(){modal('新建 Project',projectForm(),'创建项目',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'caseEdit');const project={...validateProjectData(data),id:makeId('project'),status:'active',approval:0,round:0,history:[]};db.projects.push(project);db.selectedProject=project.id;logEvent(db,project,'建立项目');navigationHistory.length=0;ui.page='overview';},'项目已创建'));}
function editProjectModal(){const project=selectedProject();modal('编辑项目',projectForm(project),'保存项目',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');check(['active','returned'].includes(project.status),'待验收或已完成项目不能修改责任与计划');Object.assign(project,validateProjectData(data));logEvent(db,project,'更新项目责任与有效计划日期');},'项目设置已保存'));}
function permissionModal(){modal('分级权限配置',`<table><thead><tr><th>角色</th><th>查看范围</th><th>Case 编辑</th><th>模板配置</th><th>设置</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${{leader:'Leader',member:'执行成员',reviewer:'验收人员'}[role]}</td><td><select name="${role}-view"><option value="assigned" ${policy.view==='assigned'?'selected':''}>参与对象</option><option value="all" ${policy.view==='all'?'selected':''}>全部范围</option></select></td>${['caseEdit','template','settings'].map(key=>`<td><input type="checkbox" aria-label="${role} ${key}" name="${role}-${key}" ${policy[key]?'checked':''} ${role==='leader'&&key==='settings'?'disabled':''}></td>`).join('')}</tr>`).join('')}</tbody></table><div class="note" style="margin-top:15px">固定 Leader 演示会话，不切换登录角色。保留当前设置管理入口，生产授权需在服务端执行。可在下方检查指定人员对业务对象的可见性。</div><div class="fields" style="margin-top:15px">${peopleSelect('preview','王宇','权限范围预览')}<div class="field"><label>查看结果</label><button type="button" onclick="previewPermission(document.querySelector('[name=preview]').value)">检查当前权限</button></div></div><div id="permissionPreview" class="small muted" style="margin-top:12px"></div>`,'保存权限',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');for(const role of Object.keys(db.permissions)){db.permissions[role]={view:data[role+'-view'],caseEdit:!!data[role+'-caseEdit'],template:!!data[role+'-template'],settings:role==='leader'||!!data[role+'-settings']};}logEvent(db,null,'更新角色权限配置');},'权限配置已保存'),true);}
function previewPermission(actor){const cases=db.cases.filter(item=>visibleTo(db,actor,'case',item)),tasks=db.tasks.filter(item=>visibleTo(db,actor,'task',item)),policy=db.permissions[db.userRoles[actor]];document.getElementById('permissionPreview').textContent=`${actor}：可查看 ${cases.length} 个 Case、${tasks.length} 项 Task；模板配置${policy.template?'允许':'不允许'}，Case 编辑${policy.caseEdit?'允许':'不允许'}。` ;}
function downloadPrototype(){const bundle=location.pathname.includes('/DH-WBS/WBS-main/')?'../../WBS-DH.zip':'WBS-DH.zip';modal('下载原型',`<div class="stack"><p>设备页复用独立 HTML 文件。离线使用时，两个 HTML 需放在同一目录；下载包已包含完整文件。</p><a href="${bundle}" download="WBS-DH.zip">${icon('download')} 下载完整原型包</a><a href="WBS-DH-prototype.html" download="WBS-DH-prototype.html">下载项目管理 HTML</a><a href="Equipment-WBS-prototype.html" download="Equipment-WBS-prototype.html">下载设备 WBS HTML</a><p class="small muted">下载不包含当前浏览器内的业务数据或上传文件。</p></div>`,'关闭',closeModal);}
function showHelp(){modal('原型演示说明',`<div class="stack"><p>这是可离线打开的桌面端原型。数据与上传文件保存在当前浏览器，不构成正式生产系统。</p><div class="notice">邮件与 Hems 仅生成模拟发送记录，不向外部系统实际发送。页面关闭时不会运行定时任务。</div><p class="small muted">当前固定陈昊 / Leader 视角。执行和验收弹窗会明确显示代办身份；生产系统需由服务端鉴权。</p><p class="small muted">演示采用保守规则：仅调整未开始 Task；下层全部验收后，负责人才能提交上层验收；退回后重新走本对象全部验收。以上为演示约定，详细规则待业务确认。</p><div class="row"><a href="Equipment-WBS-prototype.html" target="_blank">原设备 WBS 原型</a><span class="muted">·</span><button type="button" class="link danger" onclick="resetDemo()">恢复初始演示数据</button></div></div>`,'关闭',closeModal);}
function resetDemo(){modal('恢复初始演示数据','<p>仅清除新版项目管理原型的本地修改与上传文件。原设备 WBS 数据不受影响。</p>','确认恢复',()=>{try{db=createSeed();scanNotifications(db);persist();navigationHistory.length=0;ui.page='overview';closeDrawer();closeModal();render();toast('已恢复初始案例');}catch(error){toast(error.message);}});}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('modalRoot').innerHTML)closeModal();else closeDrawer();}if(event.key==='Tab'){const dialog=document.querySelector('.modal')||document.querySelector('.drawer');if(!dialog)return;const controls=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(node=>node.getClientRects().length);if(!controls.length)return;const first=controls[0],last=controls.at(-1);if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}}});
render();
setInterval(()=>{try{const count=transact(()=>scanNotifications(db,false)+runScheduledReports(db));if(count&&['notifications','reports'].includes(ui.page))render();}catch(error){storageNotice='自动检查无法保存，请检查浏览器存储。';}},60000);
</script>
</body>
</html>
