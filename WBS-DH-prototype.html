function sampleEvidence(name,text) { return {id:makeId('file'),name,size:text.length,type:'text/plain',data:'data:text/plain;charset=utf-8,'+encodeURIComponent(text),sample:true}; }

function reviewObject(state,kind,id,actor,pass,note) {
  const item=objectRef(state,kind,id);check(item&&item.status==='review','当前对象不在待验收状态');check(currentHandler(item)===actor,'只有当前环节验收人可以处理');

function notificationLevel(today,due,config) {

  if(distance>=config.second)return {level:2,title:'二级超期报警',days:distance};
  if(distance>=1)return {level:1,title:'一级超期报警',days:distance};

function badge(item){return `<span class="pill ${item.status}">${statusLabels[item.status]||'推进中'}</span>`;}
function late(item){return item.status!=='done'&&validDate(item.due)&&item.due<db.today;}
function dateCell(item){return `<span class="mono ${late(item)?'bad':''}">${escapeHtml(item.due||'待确定')}</span>${late(item)?`<div class="small bad">超期 ${elapsedDays(item.due,db.today)} 天</div>`:''}`;}
function counts(tasks){return {total:tasks.length,done:tasks.filter(task=>task.status==='done').length,review:tasks.filter(task=>task.status==='review').length,active:tasks.filter(task=>task.status==='active').length};}
function progress(tasks){const count=counts(tasks);return `<span class="small mono">${count.done} / ${count.total} Task 已验收</span><div class="progress-track"><span style="width:${count.total?count.done/count.total*100:0}%"></span><span class="review" style="width:${count.total?count.review/count.total*100:0}%"></span><span class="active" style="width:${count.total?count.active/count.total*100:0}%"></span></div>`;}
function empty(message){return `<div class="empty">${icon('folder')}<div>${escapeHtml(message)}</div></div>`;}
function pageHead(title,context,actions=''){return `<div class="page-head between"><div><div class="eyebrow">${context}</div><h1>${title}</h1></div><div class="row">${actions}</div></div>`;}
function navTo(page){ui.page=page;ui.query='';ui.category='';ui.filter='';closeDrawer();closeModal();render();window.scrollTo(0,0);}
function openCase(id){const instance=findCase(db,id);if(!instance||!visibleTo(db,CURRENT_USER,'case',instance))return toast('无权查看此 Case');db.selectedProject=instance.project;ui.caseId=id;ui.page='case';closeDrawer();render();window.scrollTo(0,0);}
function switchProject(value){db.selectedProject=value;ui.page='overview';ui.caseId=null;ui.query='';ui.category='';closeDrawer();try{persist();}catch{}render();}
function equipmentPage(){return '<iframe id="equipmentFrame" class="equipment-frame" title="设备 WBS · 独立设备总表" src="Equipment-WBS-prototype.html#embedded-wbs"></iframe>';}
function navigationContext(){if(ui.page==='equipment')return '<span class="muted small">研发资源</span><strong>独立设备总表</strong>';return `<span class="muted small">Project</span><select aria-label="当前项目" onchange="switchProject(this.value)">${db.projects.filter(item=>visibleTo(db,CURRENT_USER,'project',item)).map(item=>`<option value="${item.id}" ${item.id===selectedProject().id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`;}
function toggleSidebar(){ui.collapsed=!ui.collapsed;if(ui.page!=='equipment')return render();document.body.classList.toggle('sidebar-collapsed',ui.collapsed);const button=document.querySelector('.side-footer button');const label=(ui.collapsed?'展开':'收起')+'侧边栏';button.title=label;button.setAttribute('aria-label',label);}
function handleEquipmentMessage(event){const frame=document.getElementById('equipmentFrame');if(!frame||event.source!==frame.contentWindow||ui.page!=='equipment')return;if(event.data?.type==='wbs-equipment:overview')navTo('overview');else if(event.data?.type==='wbs-equipment:fullscreen'&&typeof event.data.active==='boolean')document.body.classList.toggle('equipment-fullscreen',event.data.active);}
if(typeof window!=='undefined'){
  window.addEventListener('message',handleEquipmentMessage);
  window.addEventListener('keydown',event=>{if(event.key==='Escape'&&ui.page==='equipment'){document.body.classList.remove('equipment-fullscreen');document.getElementById('equipmentFrame')?.contentWindow.postMessage({type:'wbs-equipment:exit-fullscreen'},'*');}});
}
function render(){
  const menus=[['overview','grid','项目总览'],['cases','folder','Case 列表'],['equipment','template','设备 WBS'],['gantt','gantt','任务甘特图'],['work','task','我的工作'],['templates','template','类型与模板'],['reports','chart','统计报表'],['notifications','bell','通知中心'],['settings','settings','项目设置']];
  const unread=db.messages.filter(message=>message.project===selectedProject().id&&!message.read&&message.recipient===CURRENT_USER).length;
  document.body.classList.toggle('sidebar-collapsed',ui.collapsed);
  if(ui.page!=='equipment')document.body.classList.remove('equipment-fullscreen');
  document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><span class="brand-symbol">${icon('grid')}</span><span class="brand-label">WBS-DH</span></div><div class="nav-label">项目协同管理</div><nav class="nav">${menus.map(([key,symbol,label])=>`<button class="${ui.page===key||(key==='cases'&&ui.page==='case')?'active':''}" title="${label}" aria-label="${label}" onclick="navTo('${key}')">${icon(symbol)}<span class="nav-text">${label}</span>${key==='notifications'&&unread?`<span class="count">${unread}</span>`:''}</button>`).join('')}</nav><div class="side-footer"><div class="small">研发中心 · 建设项目</div><button onclick="toggleSidebar()" title="${ui.collapsed?'展开':'收起'}侧边栏" aria-label="${ui.collapsed?'展开':'收起'}侧边栏">${icon('collapse')}<span class="nav-text">收起侧边栏</span></button></div></aside><header class="topbar">${navigationContext()}<span class="spacer"></span>${ui.page==='equipment'?'':`<span class="small muted mono">业务日期 ${db.today}</span>`}<span class="demo-mark">本地演示</span><button class="icon" title="演示说明" aria-label="演示说明" onclick="showHelp()">${icon('help')}</button><span style="height:24px;border-left:1px solid var(--line)"></span><span class="avatar">陈</span><span class="small">陈昊 · Leader</span></header><main class="main ${ui.page==='equipment'?'equipment-main':''}">${storageNotice?`<div class="notice">${escapeHtml(storageNotice)}</div>`:''}${({overview:overviewPage,cases:casesPage,case:casePage,equipment:equipmentPage,gantt:ganttPage,work:workPage,templates:templatesPage,reports:reportsPage,notifications:notificationsPage,settings:settingsPage})[ui.page]()}${ui.page==='equipment'?'':'<div class="footer-note">WBS-DH · Project / Case / Task</div>'}</main>`;
}
function overviewPage(){
  const project=selectedProject(),cases=projectCases(),tasks=projectTasks(),stats=counts(tasks),lateCases=cases.filter(late),lateTasks=tasks.filter(late);
  const reviews=[...tasks.filter(item=>item.status==='review').map(item=>({kind:'task',item})),...cases.filter(item=>item.status==='review').map(item=>({kind:'case',item})),...(project.status==='review'?[{kind:'project',item:project}]:[])];
  return pageHead(project.name,'项目总览 / 建设阶段',`<button onclick="openObject('project','${project.id}')">${icon('check')} 项目验收</button><button class="primary" ${can('caseEdit')?'':'disabled'} onclick="newCaseModal()">${icon('plus')} 新建 Case</button>`)+`<div class="metrics"><button class="metric blue" onclick="navTo('cases')"><div class="muted">子项目 · Case</div><div class="number">${cases.length}<small>个</small></div><div class="caption">${cases.filter(item=>item.status==='done').length} 个已完成本层验收</div></button><button class="metric green" onclick="navTo('gantt')"><div class="muted">已验收 Task</div><div class="number">${stats.done}<small>/ ${stats.total} 项</small></div><div class="caption">按任务验收结果统计</div></button><button class="metric amber" onclick="navTo('work');ui.workTab='review';render()"><div class="muted">待验收事项</div><div class="number">${reviews.length}<small>项</small></div><div class="caption">Task ${stats.review} · Case ${cases.filter(item=>item.status==='review').length} · Project ${project.status==='review'?1:0}</div></button><button class="metric red" onclick="navTo('cases');ui.filter='overdue';render()"><div class="muted">超期工作</div><div class="number">${lateTasks.length}<small>项 Task</small></div><div class="caption">Case ${lateCases.length} · Project ${late(project)?1:0}</div></button></div><div class="grid-main"><div><section class="panel"><div class="panel-head between"><h2>子项目推进情况</h2><button class="link small" onclick="navTo('cases')">全部 Case ${icon('arrow')}</button></div>${caseTable(cases)}<div class="summary-line">项目计划 ${project.start} 至 ${project.due} <span style="float:right">Project 验收 ${badge(project)}</span></div></section><section class="panel"><div class="panel-head between"><h2>当前待验收</h2><button class="link small" onclick="navTo('work')">查看待办 ${icon('arrow')}</button></div>${reviews.length?`<table><thead><tr><th>验收对象</th><th>层次</th><th>当前验收人</th><th>计划完成</th></tr></thead><tbody>${reviews.slice(0,5).map(({kind,item})=>`<tr><td class="title-cell"><button class="link" onclick="openObject('${kind}','${item.id}')">${escapeHtml(item.name)}</button></td><td><span class="tag">${kindLabels[kind]}</span></td><td>${escapeHtml(currentHandler(item))}${kind==='task'?`<div class="subline">第 ${item.approval+1} / ${item.reviewers.length} 级</div>`:''}</td><td>${dateCell(item)}</td></tr>`).join('')}</tbody></table>`:empty('暂无待验收事项')}</section></div><aside><section class="panel"><div class="panel-head"><h2>按 Category 看工作</h2></div>${db.categories.map((category,index)=>{const list=cases.filter(item=>item.category===category.id),related=tasks.filter(task=>list.some(instance=>instance.id===task.caseId));return `<div class="distribution"><div class="between"><button class="link" onclick="navTo('cases');ui.category='${category.id}';render()">${escapeHtml(category.name)}</button><span class="small muted">${list.length} 个 Case</span></div><div class="between" style="margin-top:8px"><span class="small muted">${related.length} 项 Task</span><span class="small">${related.filter(task=>task.status==='done').length} 已验收</span></div><div class="color-line"><span style="width:${related.length?related.filter(task=>task.status==='done').length/related.length*100:0}%;background:${['#4889df','#329d8e','#bc9652'][index%3]}"></span></div></div>`}).join('')}</section><section class="panel"><div class="panel-head between"><h2>近期处理记录</h2>${icon('clock')}</div><div class="panel-body">${historyHtml(db.events.slice(0,4))}</div></section></aside></div>`;
}
function filteredCases(){return projectCases().filter(item=>(!ui.category||item.category===ui.category)&&(!ui.query||[item.name,item.owner,item.goal].join(' ').toLowerCase().includes(ui.query.toLowerCase()))&&(!ui.filter||(ui.filter==='overdue'?late(item)||caseTasks(db,item.id).some(late):item.status===ui.filter)));}
function caseTable(items){return items.length?`<div class="table-scroll"><table><thead><tr><th>Case / 子项目</th><th>Category</th><th>负责人</th><th>Task 进展</th><th>本层状态</th><th>计划完成</th></tr></thead><tbody>${items.map(item=>`<tr><td class="title-cell"><button class="link" onclick="openCase('${item.id}')">${escapeHtml(item.name)}</button><div class="subline">模板 v${item.templateVersion}</div></td><td>${escapeHtml(categoryName(item.category))}</td><td>${escapeHtml(item.owner)}</td><td>${progress(caseTasks(db,item.id))}</td><td>${badge(item)}</td><td>${dateCell(item)}</td></tr>`).join('')}</tbody></table></div>`:empty('没有符合条件的 Case');}
function categoriesSelect(){return `<select aria-label="Category 筛选" onchange="ui.category=this.value;render()"><option value="">全部 Category</option>${db.categories.map(category=>`<option value="${category.id}" ${ui.category===category.id?'selected':''}>${escapeHtml(category.name)}</option>`).join('')}</select>`;}
function searchInput(label){return `<input class="search" id="mainSearch" placeholder="${label}" aria-label="${label}" value="${escapeHtml(ui.query)}" oninput="updateSearch(this)">`;}
function updateSearch(input){const position=input.selectionStart;ui.query=input.value;render();const replacement=document.getElementById('mainSearch');replacement?.focus();replacement?.setSelectionRange(position,position);}
function casesPage(){const cases=filteredCases();return pageHead('Case 列表',escapeHtml(selectedProject().name),`<button class="primary" ${can('caseEdit')?'':'disabled'} onclick="newCaseModal()">${icon('plus')} 新建 Case</button>`)+`<section class="panel"><div class="toolbar">${searchInput('搜索 Case、负责人…')}${categoriesSelect()}<select aria-label="Case 状态筛选" onchange="ui.filter=this.value;render()"><option value="">全部状态</option>${[['active','执行中'],['review','待验收'],['done','已验收完成'],['overdue','包含超期工作']].map(([value,label])=>`<option value="${value}" ${ui.filter===value?'selected':''}>${label}</option>`).join('')}</select></div>${caseTable(cases)}<div class="summary-line">${cases.length} 个 Case</div></section>`;}
function casePage(){const instance=findCase(db,ui.caseId);if(!instance)return empty('Case 不存在');const tasks=caseTasks(db,instance.id);return pageHead(escapeHtml(instance.name),`<button class="link small" onclick="navTo('cases')">Case 列表</button> / ${escapeHtml(categoryName(instance.category))}`,`<button onclick="openObject('case','${instance.id}')">${icon('check')} Case 验收</button><button onclick="ui.page='gantt';ui.filter='${instance.id}';render()">${icon('gantt')} 时间轴</button>`)+`<div class="panel"><div class="panel-body"><p>${escapeHtml(instance.goal)}</p><div class="inline-meta"><span>负责人<strong>${escapeHtml(instance.owner)}</strong></span><span>验收人<strong>${escapeHtml(instance.reviewers.join(' → '))}</strong></span><span>计划<strong>${instance.start} 至 ${instance.due}</strong></span><span>模板<strong>v${instance.templateVersion} · 创建时版本</strong></span></div></div><div class="accept-strip">${badge(instance)}<span class="small muted">Case 整体验收</span><span class="spacer"></span>${progress(tasks)}<button class="link small" onclick="openObject('case','${instance.id}')">查看验收与记录 ${icon('arrow')}</button></div></div><section class="panel"><div class="panel-head between"><h2>分段 Task</h2><span class="small muted">${tasks.length} 项 · ${tasks.filter(task=>task.status==='review').length} 项待验收</span></div>${taskTable(tasks,true)}<div class="summary-line">${tasks.filter(task=>task.status==='blocked').length} 项等待前置 · ${tasks.filter(task=>task.status==='ready').length} 项可执行 · ${tasks.filter(task=>task.status==='active').length} 项执行中</div></section><details class="panel"><summary class="panel-head">Case 修改记录</summary><div class="panel-body">${historyHtml(instance.history)}</div></details>`;}
function taskTable(tasks,editing=false){return tasks.length?`<div class="table-scroll"><table><thead><tr><th>Task</th><th>执行人</th><th>验收安排</th><th>状态</th><th>计划完成</th><th>前置任务</th>${editing?'<th></th>':''}</tr></thead><tbody>${tasks.map((task,index)=>`<tr><td class="title-cell"><button class="link" onclick="openObject('task','${task.id}')">${index+1}. ${escapeHtml(task.name)}</button><div class="subline">${task.duration} 天 · ${escapeHtml(task.evidence)}</div></td><td>${escapeHtml(task.owner)}</td><td><span class="small">${escapeHtml(task.reviewers.join(' → '))}</span>${task.status==='review'?`<div class="subline">当前第 ${task.approval+1} / ${task.reviewers.length} 级</div>`:''}</td><td>${badge(task)}</td><td>${dateCell(task)}</td><td style="max-width:175px"><span class="small muted">${task.deps.map(id=>escapeHtml(objectRef(db,'task',id)?.name)).join('、')||'无'}</span></td>${editing?`<td>${['ready','blocked'].includes(task.status)&&can('caseEdit')?`<button class="link small" onclick="editTaskModal('${task.id}')">调整</button>`:''}</td>`:''}</tr>`).join('')}</tbody></table></div>`:empty('暂无任务');}
function workPage(){let entries=ui.workTab==='review'?[...projectTasks().filter(item=>item.status==='review').map(item=>({kind:'task',item})),...projectCases().filter(item=>item.status==='review').map(item=>({kind:'case',item})),...(selectedProject().status==='review'?[{kind:'project',item:selectedProject()}]:[])]:projectTasks().filter(item=>['ready','active','returned'].includes(item.status)).map(item=>({kind:'task',item}));if(ui.workScope==='mine')entries=entries.filter(({item})=>currentHandler(item)===CURRENT_USER);return pageHead('我的工作',escapeHtml(selectedProject().name))+`<section class="panel"><div class="between"><div class="tabs"><button class="${ui.workTab==='review'?'active':''}" onclick="ui.workTab='review';render()">待验收</button><button class="${ui.workTab==='execute'?'active':''}" onclick="ui.workTab='execute';render()">待执行</button></div><select aria-label="工作范围" style="margin-right:18px" onchange="ui.workScope=this.value;render()"><option value="team" ${ui.workScope==='team'?'selected':''}>团队工作 · Leader 可见</option><option value="mine" ${ui.workScope==='mine'?'selected':''}>仅与我相关</option></select></div>${entries.length?`<table><thead><tr><th>工作事项</th><th>层次</th><th>当前处理人</th><th>状态</th><th>计划完成</th><th></th></tr></thead><tbody>${entries.map(({kind,item})=>`<tr><td class="title-cell"><button class="link" onclick="openObject('${kind}','${item.id}')">${escapeHtml(item.name)}</button>${kind==='task'?`<div class="subline">${escapeHtml(taskCase(db,item).name)}</div>`:''}</td><td><span class="tag">${kindLabels[kind]}</span></td><td>${escapeHtml(currentHandler(item))}</td><td>${badge(item)}</td><td>${dateCell(item)}</td><td><button onclick="openObject('${kind}','${item.id}')">查看 ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table>`:empty(ui.workScope==='mine'?'陈昊当前没有待处理事项':'暂无待处理事项')}</section>`;}
function historyHtml(history){return history.length?history.map(record=>`<div class="history-item"><small>${escapeHtml(record.at)} · ${escapeHtml(record.actor||'系统')}${record.round?' · 第 '+record.round+' 次提交':''}</small>${escapeHtml(record.text)}${record.files?.length?`<div class="small muted">Evidence：${record.files.map(file=>escapeHtml(file.name)).join('、')}</div>`:''}</div>`).join(''):'<span class="small muted">暂无记录</span>';}
function openObject(kind,id){const item=objectRef(db,kind,id);if(!item||!visibleTo(db,CURRENT_USER,kind,item))return toast('无权查看此对象');ui.drawer={kind,id};renderDrawer();setTimeout(()=>document.querySelector('.drawer .icon')?.focus(),0);}
function closeDrawer(){ui.drawer=null;document.getElementById('drawerRoot').innerHTML='';}
function renderDrawer(){if(!ui.drawer)return;const {kind,id}=ui.drawer,item=objectRef(db,kind,id);if(!item)return closeDrawer();const instance=kind==='task'?taskCase(db,item):kind==='case'?item:null;let actions='';
  if(kind==='task'&&item.status==='blocked')actions='<span class="small muted">等待前置任务完成所需验收</span>';
  if(kind==='task'&&item.status==='ready')actions=`<button class="primary" onclick="startTaskModal('${id}')">${icon('play')} 开始任务</button>`;
  if(kind==='task'&&['active','returned'].includes(item.status))actions=`<button class="primary" onclick="submitTaskModal('${id}')">${icon('file')} ${item.status==='returned'?'修改后重提':'上传并提交验收'}</button>`;
  if(kind!=='task'&&['active','returned'].includes(item.status))actions=`<button class="primary" ${readyForAcceptance(db,kind,item)?'':'disabled'} onclick="parentSubmitModal('${kind}','${id}')">提交${kind==='case'?'子项目':'项目'}验收</button>`;
  if(item.status==='review')actions=`<button class="danger" onclick="reviewModal('${kind}','${id}',false)">退回修改</button><button class="primary" onclick="reviewModal('${kind}','${id}',true)">${icon('check')} 验收通过</button>`;
  document.getElementById('drawerRoot').innerHTML=`<div class="drawer-mask" onclick="closeDrawer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${kindLabels[kind]} 详情"><div class="drawer-head"><div class="between"><span class="small muted">${kindLabels[kind]} 详情 ${instance&&kind==='task'?' / '+escapeHtml(instance.name):''}</span><button class="icon" aria-label="关闭详情" onclick="closeDrawer()">${icon('close')}</button></div><h1>${escapeHtml(item.name)}</h1><div class="row" style="margin-top:12px">${badge(item)}${late(item)?`<span class="pill overdue">超期 ${elapsedDays(item.due,db.today)} 天</span>`:''}</div></div><div class="drawer-body"><section class="section"><h2>${kind==='task'?'工作要求':'目标与交付'}</h2><p>${escapeHtml(item.evidence||item.goal)}</p><dl class="detail-grid"><div><dt>${kind==='task'?'执行人':'负责人'}</dt><dd>${escapeHtml(item.owner)}</dd></div><div><dt>计划周期</dt><dd>${item.start||'待确定'} 至 ${item.due||'待确定'}</dd></div>${instance?`<div><dt>Category</dt><dd>${escapeHtml(categoryName(instance.category))}</dd></div><div><dt>模板版本</dt><dd>v${instance.templateVersion}</dd></div>`:''}</dl></section><section class="section"><h2>${kindLabels[kind]} 验收安排</h2><div class="task-flow">${item.reviewers.map((person,index)=>`${index?icon('chevron'):''}<span class="level-node ${index<item.approval?'passed':item.status==='review'&&index===item.approval?'current':''}">${index+1}. ${escapeHtml(person)} ${index<item.approval?'已通过':''}</span>`).join('')}</div>${kind!=='task'?`<div class="note" style="margin-top:16px">${kind==='case'?'子项目整体交付验收':'项目整体建设成果验收'}。下层全部验收完成后，由负责人单独提交；下层完成不会自动通过本层验收。</div>`:''}${kind==='task'&&item.status==='blocked'?`<p class="small muted" style="margin-top:12px">等待 ${item.deps.filter(dependency=>objectRef(db,'task',dependency)?.status!=='done').map(dependency=>escapeHtml(objectRef(db,'task',dependency)?.name)).join('、')} 完成验收。</p>`:''}</section>${kind==='task'?`<section class="section"><div class="between"><h2>Evidence</h2><span class="small muted">${item.files.length} 份</span></div>${item.files.length?item.files.map((file,index)=>`<div class="file-row">${icon('file')}<div class="spacer"><div>${escapeHtml(file.name)}</div><span class="small muted">${file.sample?'演示材料 · ':''}${Math.ceil(file.size/1024)||1} KB</span></div><button class="icon" title="下载 ${escapeHtml(file.name)}" aria-label="下载 Evidence" onclick="downloadEvidence('${id}',${index})">${icon('download')}</button></div>`).join(''):'<span class="small muted">尚未上传交付物</span>'}</section>`:`<section class="section"><h2>下层交付情况</h2>${kind==='case'?progress(caseTasks(db,item.id)):`<p>${db.cases.filter(child=>child.project===id&&child.status==='done').length} / ${db.cases.filter(child=>child.project===id).length} 个 Case 已验收</p>`}</section>`}<section class="section"><h2>提交与验收记录</h2>${historyHtml(item.history)}</section></div><div class="drawer-foot">${actions||'<span class="small good">本层验收已完成</span>'}</div></aside>`;
}
function modal(title,body,submitLabel,handler,wide=false){modalReturnFocus=document.activeElement;document.getElementById('modalRoot').innerHTML=`<div class="modal-mask"><section class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><form id="dialogForm"><div class="modal-head between"><h2>${escapeHtml(title)}</h2><button class="icon" type="button" aria-label="关闭弹窗" onclick="closeModal()">${icon('close')}</button></div><div class="modal-body">${body}<div class="error" id="modalError" role="alert"></div></div><div class="modal-foot"><button type="button" onclick="closeModal()">取消</button><button class="primary" type="submit">${escapeHtml(submitLabel)}</button></div></form></section></div>`;document.getElementById('dialogForm').onsubmit=async event=>{event.preventDefault();const form=event.target,button=form.querySelector('[type=submit]');button.disabled=true;try{await handler(Object.fromEntries(new FormData(form)),form);}catch(error){const target=document.getElementById('modalError');if(target)target.textContent=error.message;}finally{button.disabled=false;}};setTimeout(()=>document.querySelector('#dialogForm input,#dialogForm select,#dialogForm textarea,#dialogForm button')?.focus(),0);}
function closeModal(){document.getElementById('modalRoot').innerHTML='';modalReturnFocus?.isConnected&&modalReturnFocus.focus();}
function inputField(label,name,value='',type='text',full=false,attrs=''){return `<div class="field ${full?'full':''}"><label for="field-${name}">${label}</label><input id="field-${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${attrs}></div>`;}
function peopleSelect(name,value,label,optional=false){return `<div class="field"><label for="field-${name}">${label}</label><select id="field-${name}" name="${name}">${optional?'<option value="">无</option>':''}${PEOPLE.map(person=>`<option ${value===person?'selected':''}>${person}</option>`).join('')}</select></div>`;}
function simulationNote(actor,action){return `<div class="notice" style="margin-bottom:18px">模拟操作身份：<strong>${escapeHtml(actor)}</strong> · ${action}。当前为 Leader 演示代办，不代表真实登录鉴权。</div>`;}
function newCaseModal(){if(!can('caseEdit'))return toast('没有新建权限');modal('新建 Case',`<div class="fields"><div class="field full"><label for="field-templateId">Category / 流程模板</label><select id="field-templateId" name="templateId" onchange="previewCaseTemplate(this.value)">${db.templates.map(template=>`<option value="${template.id}">${escapeHtml(categoryName(template.category))} · ${escapeHtml(template.name)} · v${latestVersion(template).version}</option>`).join('')}</select></div>${inputField('Case 名称','name','','text',true,'required maxlength="80"')}<div class="field full"><label for="field-goal">目标与交付要求</label><textarea id="field-goal" name="goal" required></textarea></div>${peopleSelect('owner','李敏','Case 负责人')}${peopleSelect('reviewer','周岚','Case 验收人')}${inputField('计划开始','start',db.today,'date',false,'required')}${inputField('计划完成','due',shiftDate(db.today,25),'date',false,'required')}</div><div id="caseTemplatePreview" class="note" style="margin-top:18px"></div>`,'创建 Case',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'caseEdit');const instance=instantiate(db,{...data,project:selectedProject().id,reviewers:[data.reviewer]});ui.caseId=instance.id;ui.page='case';},'Case 已创建，任务与模板版本已保存'));previewCaseTemplate(db.templates[0].id);}
function previewCaseTemplate(id){const template=db.templates.find(item=>item.id===id);document.getElementById('caseTemplatePreview').innerHTML=latestVersion(template).tasks.map((task,index)=>`${index+1}. ${escapeHtml(task.name)} · ${task.duration} 天 · ${task.reviewers.length} 级验收`).join('<br>');}
function startTaskModal(id){const task=objectRef(db,'task',id);modal('开始任务',simulationNote(task.owner,'执行人')+`<p>${escapeHtml(task.name)}</p>`,'确认开始',()=>handleOperation(()=>startTask(db,id,task.owner),'任务已开始'));}
function submitTaskModal(id){const task=objectRef(db,'task',id);pendingFiles=clone(task.files);modal(task.status==='returned'?'修改后重新提交':'上传 Evidence 并提交',simulationNote(task.owner,'执行人')+`<p class="small" style="margin-bottom:16px">交付要求：${escapeHtml(task.evidence)}</p><div class="field"><label for="evidenceUpload">交付物文件</label><input id="evidenceUpload" type="file" multiple onchange="readEvidenceFiles(this)"><span class="small muted">单份不超过 750 KB，当前上传合计不超过 2 MB；保存在当前浏览器。</span></div><div id="pendingFiles" style="margin-top:15px"></div>`,'提交验收',()=>handleOperation(()=>submitTask(db,id,pendingFiles,task.owner),'已提交，验收待办和模拟通知已生成'));renderPendingFiles();}
async function readEvidenceFiles(input){try{const files=[...input.files];check(files.every(file=>file.size<=750*1024),'单份文件不能超过 750 KB');check(files.reduce((total,file)=>total+file.size,0)+pendingFiles.reduce((total,file)=>total+file.size,0)<=2*1024*1024,'本次交付物不能超过 2 MB');const loaded=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({id:makeId('file'),name:file.name,size:file.size,type:file.type,data:reader.result});reader.onerror=()=>reject(Error('文件读取失败'));reader.readAsDataURL(file);})));pendingFiles.push(...loaded);renderPendingFiles();document.getElementById('modalError').textContent='';}catch(error){document.getElementById('modalError').textContent=error.message;}input.value='';}
function renderPendingFiles(){const target=document.getElementById('pendingFiles');if(target)target.innerHTML=pendingFiles.map((file,index)=>`<div class="file-row">${icon('file')}<span class="spacer">${escapeHtml(file.name)}</span><button type="button" class="icon danger" title="移除文件" aria-label="移除 ${escapeHtml(file.name)}" onclick="pendingFiles.splice(${index},1);renderPendingFiles()">${icon('close')}</button></div>`).join('')||'<span class="small muted">尚未选择文件</span>';}
function downloadEvidence(id,index){const file=objectRef(db,'task',id)?.files[index];if(!file)return;const anchor=document.createElement('a');anchor.href=file.data;anchor.download=file.name;anchor.click();}
function reviewModal(kind,id,pass){const item=objectRef(db,kind,id),actor=currentHandler(item);modal(pass?'确认验收通过':'退回修改',simulationNote(actor,`${kindLabels[kind]} 验收人${kind==='task'?' · 第 '+(item.approval+1)+' 级':''}`)+`<p style="margin-bottom:15px">${escapeHtml(item.name)}</p><div class="field"><label for="reviewNote">${pass?'验收结论':'修改要求'}</label><textarea id="reviewNote" name="note" required placeholder="${pass?'说明验收依据及结论':'填写需要补充或修改的内容'}"></textarea></div>` ,pass?'确认通过':'确认退回',data=>handleOperation(()=>reviewObject(db,kind,id,actor,pass,data.note),pass?'验收结果已记录，后续流程已同步':'已退回，原提交记录保留'));}
function parentSubmitModal(kind,id){const item=objectRef(db,kind,id);modal('提交 '+kindLabels[kind]+' 整体验收',simulationNote(item.owner,'对象负责人')+`<div class="field"><label for="parentNote">整体交付说明</label><textarea id="parentNote" name="note" required></textarea></div>`,'提交验收',data=>handleOperation(()=>submitParent(db,kind,id,item.owner,data.note),'已提交本层验收'));}
function editTaskModal(id){const task=objectRef(db,'task',id);modal('调整当前 Case 的 Task',`<div class="note" style="margin-bottom:17px">仅调整尚未开始的任务；不修改公共模板或其他 Case。不会自动重排后续任务日期。</div><div class="fields">${inputField('任务名称','name',task.name,'text',true,'required')}${inputField('Evidence 要求','evidence',task.evidence,'text',true,'required')}${peopleSelect('owner',task.owner,'执行人')}${peopleSelect('reviewer1',task.reviewers[0],'一级验收人')}${peopleSelect('reviewer2',task.reviewers[1]||'','二级验收人',true)}${inputField('开始日期','start',task.start,'date',false,'required')}${inputField('完成日期','due',task.due,'date',false,'required')}<div class="field full"><label>前置任务（全部通过后可执行）</label><div class="checklist">${caseTasks(db,task.caseId).filter(item=>item.id!==id).map(item=>`<label><input type="checkbox" name="dependency" value="${item.id}" ${task.deps.includes(item.id)?'checked':''}>${escapeHtml(item.name)}</label>`).join('')}</div></div></div>`,'保存当前 Case', (data,form)=>handleOperation(()=>editPendingTask(db,id,{name:data.name.trim(),evidence:data.evidence.trim(),owner:data.owner,reviewers:[data.reviewer1,data.reviewer2].filter(Boolean),deps:[...new FormData(form).getAll('dependency')],start:data.start,due:data.due},CURRENT_USER),'当前任务已调整，模板保持不变'));}
function ganttPage(){
  const start=ui.ganttStart,days=ui.ganttDays,cell=days===42?30:20,width=days*cell,todayOffset=dayNumber(db.today)-dayNumber(start),todayLine=todayOffset>=0&&todayOffset<days?`<span class="today-line" style="left:${todayOffset*cell}px"></span>`:'';
  const cases=projectCases().filter(instance=>(!ui.category||instance.category===ui.category)&&(!ui.filter||instance.id===ui.filter));
  let rows='';
  for(const category of db.categories){const grouped=cases.filter(instance=>instance.category===category.id);if(!grouped.length)continue;
    rows+=`<div class="gantt-row gantt-group"><div class="gantt-label">${escapeHtml(category.name)} <span class="muted" style="margin-left:10px">${grouped.length} Case</span></div><div class="gantt-track" style="width:${width}px"></div></div>`;
    for(const instance of grouped){rows+=`<div class="gantt-row gantt-case"><div class="gantt-label"><button class="link" onclick="openCase('${instance.id}')">${escapeHtml(instance.name)}</button></div><div class="gantt-track" style="width:${width}px">${todayLine}</div></div>`;
      for(const task of caseTasks(db,instance.id)){
        const valid=validDate(task.start)&&validDate(task.due),offset=valid?dayNumber(task.start)-dayNumber(start):0,extent=valid?dayNumber(task.due)-dayNumber(task.start)+1:0,left=Math.max(0,offset),right=Math.min(days,offset+extent),show=valid&&right>left;
        const title=`${task.name} · ${statusLabels[task.status]} · ${task.start||'待确定'} 至 ${task.due||'待确定'} · ${task.owner}`;
        rows+=`<div class="gantt-row"><div class="gantt-label" style="padding-left:35px"><button class="link" title="${escapeHtml(title)}" onclick="openObject('task','${task.id}')">${escapeHtml(task.name)}</button><span class="small muted">${escapeHtml(task.owner)}${late(task)?' · 超期 '+elapsedDays(task.due,db.today)+' 天':''}</span></div><div class="gantt-track" style="width:${width}px;background-size:${cell}px 100%">${todayLine}${show?`<button class="gantt-bar ${task.status}" style="left:${left*cell+2}px;width:${Math.max(5,(right-left)*cell-4)}px" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}" onclick="openObject('task','${task.id}')">${escapeHtml(statusLabels[task.status])}${(right-left)*cell>160?' · '+escapeHtml(task.name):''}</button>`:`<span class="small muted" style="position:absolute;left:12px;top:13px">${valid?'时间区间外 · '+task.start+' 至 '+task.due:'计划时间待确定'} · ${statusLabels[task.status]}</span>`}</div></div>`;
      }
    }
  }
  return pageHead('任务甘特图',escapeHtml(selectedProject().name),`<button onclick="ui.ganttStart=shiftDate(db.today,-7);render()">${icon('clock')} 今天</button>`)+`<section class="panel"><div class="toolbar">${categoriesSelect()}<select aria-label="甘特图 Case 筛选" onchange="ui.filter=this.value;render()"><option value="">全部 Case</option>${projectCases().map(instance=>`<option value="${instance.id}" ${ui.filter===instance.id?'selected':''}>${escapeHtml(instance.name)}</option>`).join('')}</select><span class="spacer"></span><button class="icon" title="前移两周" aria-label="前移两周" onclick="ui.ganttStart=shiftDate(ui.ganttStart,-14);render()">${icon('back')}</button><input aria-label="时间轴起始日期" type="date" value="${start}" onchange="if(validDate(this.value)){ui.ganttStart=this.value;render()}"><button class="icon" title="后移两周" aria-label="后移两周" onclick="ui.ganttStart=shiftDate(ui.ganttStart,14);render()">${icon('arrow')}</button><select aria-label="时间轴范围" onchange="ui.ganttDays=Number(this.value);render()"><option value="42" ${days===42?'selected':''}>6 周</option><option value="84" ${days===84?'selected':''}>12 周</option></select></div><div class="gantt-scroll"><div class="gantt-table"><div class="gantt-row gantt-axis"><div class="gantt-label">Category / Case / Task</div><div class="gantt-days" style="width:${width}px">${Array.from({length:days},(_,index)=>{const date=shiftDate(start,index),day=new Date(date+'T12:00:00Z').getUTCDay();return `<div class="gantt-day ${day===0||day===6?'weekend':''} ${date===db.today?'today':''}" style="width:${cell}px"><span>${index===0||date.endsWith('-01')?date.slice(5,7)+'月':''}</span><strong>${date.slice(-2)}</strong></div>`}).join('')}</div></div>${rows||`<div class="empty">没有符合条件的任务</div>`}</div></div><div class="summary-line between"><span>计划时间 · 业务日期 ${db.today} · 分类来自所属 Case 的 Category</span><div class="legend">${[['#dceafb','执行中'],['#ffedc2','待验收'],['#d9eee4','已完成'],['#f8dede','待修改'],['#edf0f5','等待前置']].map(([color,label])=>`<span><i style="background:${color}"></i>${label}</span>`).join('')}</div></div></section>`;
}
function templatesPage(){return pageHead('类型与流程模板','Category / 标准任务 / 版本',`<button ${can('template')?'':'disabled'} onclick="newCategoryModal()">${icon('plus')} 新增类型</button>`)+`<div class="template-grid">${db.templates.map(template=>{const version=latestVersion(template),parallel=version.tasks.filter(task=>task.deps.length===1).length;return `<article class="template-card"><header><div class="between"><span class="pill ready">${escapeHtml(categoryName(template.category))}</span><span class="tag">当前版本 v${version.version}</span></div><h2 style="margin-top:14px">${escapeHtml(template.name)}</h2><div class="subline">${version.tasks.length} 项 Task · ${version.tasks.filter(task=>task.reviewers.length>1).length} 项多级验收</div></header><div class="template-steps">${version.tasks.map((task,index)=>`<div class="step-row"><span class="step-number">${index+1}</span><span class="spacer">${escapeHtml(task.name)}</span><span class="muted">${task.duration} 天</span></div>`).join('')}</div><footer>${template.versions.length>1?`<button class="link small" onclick="templateVersions('${template.id}')">${icon('clock')} 发布记录</button>`:'<span aria-hidden="true"></span>'}<button ${can('template')?'':'disabled'} onclick="editTemplateModal('${template.id}')">配置新版本 ${icon('arrow')}</button></footer></article>`}).join('')}</div><div class="note" style="margin-top:20px">已创建 Case 保留原模板版本及任务设置。发布新版本只用于之后创建的 Case；模板验收层级由 Task 性质确定。</div>`;}
function newCategoryModal(){modal('新增 Case 类型',`<div class="fields">${inputField('Category 名称','name','','text',true,'required maxlength="30"')}${inputField('流程模板名称','templateName','','text',true,'required maxlength="60"')}</div>`,'创建类型与模板',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'template');check(data.name.trim()&&data.templateName.trim(),'请填写类型及模板名称');check(!db.categories.some(category=>category.name.toLowerCase()===data.name.trim().toLowerCase()),'Category 名称已存在');const categoryId=makeId('cat');db.categories.push({id:categoryId,name:data.name.trim()});db.templates.push({id:makeId('tpl'),category:categoryId,name:data.templateName.trim(),versions:[{version:1,date:db.today,tasks:[definition('s1','需求与交付确认',3,'王宇',['李敏'],[],'交付说明与确认材料')]}]});logEvent(db,null,'新增 Category：'+data.name);},'已创建，可继续配置模板任务'));}
function templateVersions(id){const template=db.templates.find(item=>item.id===id);modal('发布记录 · '+template.name,`<div class="stack">${[...template.versions].reverse().map(version=>`<div><div class="between"><h3>v${version.version}${version.version===latestVersion(template).version?' · 当前版本':''}</h3><span class="small muted">${version.date}</span></div><p class="small muted">${version.tasks.length} 项 Task · ${db.cases.filter(instance=>instance.templateId===id&&instance.templateVersion===version.version).length} 个 Case 创建时采用</p><details><summary>查看版本任务</summary>${version.tasks.map(task=>`<p class="small">${escapeHtml(task.name)} · ${task.duration} 天 · ${escapeHtml(task.reviewers.join(' → '))}</p>`).join('')}</details></div>`).join('')}</div>`,'关闭',closeModal);}
function editTemplateModal(id){if(!can('template'))return toast('无模板配置权限');templateEditingId=id;templateDraft=clone(latestVersion(db.templates.find(item=>item.id===id)).tasks);modal('配置模板新版本',`<div class="between" style="margin-bottom:14px"><div class="small muted">修改发布为新版本，在途 Case 不受影响。</div><button type="button" onclick="collectTemplateDraft();templateDraft.push(definition(makeId('step'),'新任务',3,'王宇',['李敏'],[],'交付说明'));renderTemplateDraft()">${icon('plus')} 新增 Task</button></div><div class="table-scroll" id="templateDraftTable"></div>`,'发布新版本',()=>{collectTemplateDraft();handleOperation(()=>publishTemplate(db,templateEditingId,templateDraft,CURRENT_USER),'新版本已发布，原 Case 保持不变');},true);renderTemplateDraft();}
function startConditionText(task,tasks){const names=task.deps.map(id=>tasks.find(item=>item.id===id)?.name||'未命名任务');return names.length?names.join('、')+(names.length>1?'均验收通过后':'验收通过后'):'Case 启动后';}
function templateStartCondition(task,index){return `<div class="condition-description" data-condition-text>${escapeHtml(startConditionText(task,templateDraft))}</div><details class="condition-editor" ontoggle="this.querySelector('summary').textContent=this.open?'收起':'调整'"><summary aria-label="调整任务 ${index+1} 开始条件">调整</summary><div class="deps">${templateDraft.filter(item=>item.id!==task.id).map(item=>`<label><input type="checkbox" data-dependency="${item.id}" ${task.deps.includes(item.id)?'checked':''} onchange="updateTemplateConditions()"><span data-dependency-name>${escapeHtml(item.name||'未命名任务')}</span></label>`).join('')||'<span class="small muted">无其他任务</span>'}</div></details>`;}
function updateTemplateConditions(){collectTemplateDraft();for(const row of document.querySelectorAll('#templateDraftTable [data-step]')){const task=templateDraft.find(item=>item.id===row.dataset.step);row.querySelector('[data-condition-text]').textContent=startConditionText(task,templateDraft);for(const input of row.querySelectorAll('[data-dependency]'))input.nextElementSibling.textContent=templateDraft.find(item=>item.id===input.dataset.dependency)?.name||'未命名任务';}}
function renderTemplateDraft(){document.getElementById('templateDraftTable').innerHTML=`<table class="template-tasks"><thead><tr><th style="width:18%">Task 名称 / Evidence</th><th style="width:8%">周期（天）</th><th style="width:13%">执行人</th><th style="width:13%">一级验收人</th><th style="width:13%">二级验收人</th><th>开始条件</th><th></th></tr></thead><tbody>${templateDraft.map((task,index)=>`<tr data-step="${task.id}"><td><input aria-label="任务 ${index+1} 名称" data-name value="${escapeHtml(task.name)}" oninput="updateTemplateConditions()" required><input aria-label="任务 ${index+1} Evidence" style="margin-top:8px" data-evidence value="${escapeHtml(task.evidence)}" required></td><td><input aria-label="任务 ${index+1} 周期" data-duration type="number" min="1" max="365" step="1" value="${task.duration}" required></td><td><select data-owner aria-label="任务 ${index+1} 执行人">${PEOPLE.map(person=>`<option ${person===task.owner?'selected':''}>${person}</option>`).join('')}</select></td><td><select data-reviewer1 aria-label="任务 ${index+1} 一级验收人">${PEOPLE.map(person=>`<option ${person===task.reviewers[0]?'selected':''}>${person}</option>`).join('')}</select></td><td><select data-reviewer2 aria-label="任务 ${index+1} 二级验收人"><option value="">无</option>${PEOPLE.map(person=>`<option ${person===task.reviewers[1]?'selected':''}>${person}</option>`).join('')}</select></td><td class="start-condition">${templateStartCondition(task,index)}</td><td><button class="icon danger" type="button" title="移除任务" aria-label="移除任务 ${index+1}" onclick="collectTemplateDraft();removeDraftTask('${task.id}')">${icon('close')}</button></td></tr>`).join('')}</tbody></table>`;}
function collectTemplateDraft(){for(const row of document.querySelectorAll('[data-step]')){const task=templateDraft.find(item=>item.id===row.dataset.step);Object.assign(task,{name:row.querySelector('[data-name]').value.trim(),evidence:row.querySelector('[data-evidence]').value.trim(),duration:Number(row.querySelector('[data-duration]').value),owner:row.querySelector('[data-owner]').value,reviewers:[row.querySelector('[data-reviewer1]').value,row.querySelector('[data-reviewer2]').value].filter(Boolean),deps:[...row.querySelectorAll('[data-dependency]:checked')].map(input=>input.dataset.dependency)});}}
function removeDraftTask(id){if(templateDraft.length===1)return toast('至少保留一个 Task');if(templateDraft.some(task=>task.deps.includes(id)))return toast('请先解除其他 Task 对此任务的依赖');templateDraft=templateDraft.filter(task=>task.id!==id);renderTemplateDraft();}
function reportsPage(){const reports=db.reports.filter(report=>report.project===selectedProject().id),last=reports[0];return pageHead('统计报表',escapeHtml(selectedProject().name),`<button onclick="reportScheduleModal()" ${can('settings')?'':'disabled'}>${icon('clock')} 周期配置</button><button class="primary" onclick="generateReportModal()">${icon('plus')} 生成报表</button>`)+`<div class="panel"><div class="panel-body between"><div><h2>自动生成计划</h2><p class="subline">${db.reportSchedule.enabled?'已开启':'已暂停'} · ${db.reportSchedule.period==='week'?'每周':'每月'} · 下次 ${db.reportSchedule.next}</p></div><span class="tag">页面运行或重新打开时检查</span></div></div>${last?`<section class="panel"><div class="panel-head between"><h2>最近一期 · ${last.from} 至 ${last.to}</h2><button class="link" onclick="exportReport('${last.id}')">${icon('download')} 导出 CSV</button></div><div class="panel-body report-numbers"><div><span class="small muted">周期内验收完成 Task</span><strong>${last.completed}</strong></div><div><span class="small muted">生成时待验收 Task</span><strong>${last.review}</strong></div><div><span class="small muted">完成周期均值 · 自然日</span><strong>${last.executionMean??'—'}</strong><span class="small muted">开始至完成，包含验收</span></div></div></section>`:''}<section class="panel"><div class="panel-head"><h2>报表历史</h2></div>${reports.length?`<table><thead><tr><th>统计区间</th><th>生成方式</th><th>完成 Task</th><th>待验收 Task</th><th>超期 Task</th><th>退回次数</th><th></th></tr></thead><tbody>${reports.map(report=>`<tr><td>${report.from} 至 ${report.to}</td><td>${report.automatic?'周期生成':'手动生成'}</td><td>${report.completed}</td><td>${report.review}</td><td>${report.overdue}</td><td>${report.returns}</td><td><button class="icon" title="导出 CSV" aria-label="导出报表" onclick="exportReport('${report.id}')">${icon('download')}</button></td></tr>`).join('')}</tbody></table>`:empty('暂无报表，可生成当前周期统计')}</section><div class="note">待验收与超期数量为生成时快照；完成及退回数量按统计区间计算。任务周期不相加为 Case 总工期，不将 Task 完成率作为 Project 验收结果。离线原型关闭期间不运行定时服务。</div>`;}
function generateReportModal(){modal('生成项目进度与流转效率报表',`<div class="fields">${inputField('统计开始','from',shiftDate(db.today,-7),'date',false,'required')}${inputField('统计截止','to',db.today,'date',false,'required')}</div>`,'生成报表',data=>handleOperation(()=>{check(data.to===db.today,'本地快照报表的统计截止需为当前业务日期');buildReport(db,selectedProject().id,data.from,data.to);},'报表快照已生成'));}
function reportScheduleModal(){modal('周期报表配置',`<div class="fields"><div class="field"><label>自动生成</label><select name="enabled"><option value="yes" ${db.reportSchedule.enabled?'selected':''}>开启</option><option value="no" ${!db.reportSchedule.enabled?'selected':''}>暂停</option></select></div><div class="field"><label>时间周期</label><select name="period"><option value="week" ${db.reportSchedule.period==='week'?'selected':''}>每周</option><option value="month" ${db.reportSchedule.period==='month'?'selected':''}>每月（月初）</option></select></div>${inputField('下次生成日期','next',db.reportSchedule.next,'date',true,'required')}</div><div class="note" style="margin-top:16px">演示为工作区统一计划。若关闭期间错过多期，重新打开时合并生成一份至当前业务日期的快照，不虚构历史状态。</div>`,'保存计划',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');check(validDate(data.next),'日期无效');db.reportSchedule={enabled:data.enabled==='yes',period:data.period,next:data.next};runScheduledReports(db);},'周期计划已保存'));}
function downloadText(name,text,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportReport(id){const report=db.reports.find(item=>item.id===id);if(!report)return;const rows=[['项目','统计开始','统计截止','生成日期','Case数量','Task数量','周期完成Task','生成时待验收Task','生成时超期Task','已验收Case','Project已验收','完成周期均值(自然日含验收)','周期退回次数'],[findProject(db,report.project).name,report.from,report.to,report.generated,report.caseCount,report.taskCount,report.completed,report.review,report.overdue,report.caseAccepted,report.projectAccepted?'是':'否',report.executionMean??'',report.returns]];downloadText('WBS-DH-项目进度-'+report.to+'.csv','\ufeff'+rows.map(row=>row.map(value=>'"'+String(value).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"').join(',')).join('\r\n'));toast('报表已导出');}
function notificationsPage(){let messages=db.messages.filter(message=>message.project===selectedProject().id&&(ui.notificationTab!=='mine'||message.recipient===CURRENT_USER)&&(ui.notificationTab!=='overdue'||message.level>0));const config=db.notification;return pageHead('通知中心','邮件 / Hems · 模拟发送',`<button onclick="noticeRulesModal()" ${can('settings')?'':'disabled'}>${icon('settings')} 提醒规则</button><button class="primary" onclick="runNoticeScan()">${icon('refresh')} 检查当前时间线</button>`)+`<div class="notice" style="margin-bottom:18px">本地演示：通知仅生成模拟记录，不发送真实邮件或 Hems 消息。已读不会改变任务或验收状态。</div><section class="panel"><div class="panel-body"><div class="between"><h2>时间线分级提醒</h2><span class="small muted">自然日 · Asia/Shanghai · 每日 ${String(config.scanHour).padStart(2,'0')}:00</span></div><div class="timeline-rules">${[['D − '+config.lead,'临期提醒'],['D − '+config.near,'再次提醒'],['D 当天','今日到期'],['D + 1','一级报警'],['D + '+config.second,'二级 · Case 负责人'],['D + '+config.third,'三级 · Project 负责人']].map(([day,label])=>`<div class="rule-stop"><span>${day}</span><strong>${label}</strong></div>`).join('')}</div></div></section><section class="panel"><div class="between"><div class="tabs">${[['all','项目通知'],['mine','发给我的'],['overdue','超期报警']].map(([value,label])=>`<button class="${ui.notificationTab===value?'active':''}" onclick="ui.notificationTab='${value}';render()">${label}</button>`).join('')}</div><span class="small muted" style="margin-right:20px">${messages.length} 条接收记录</span></div>${messages.slice(0,100).map(message=>{const item=objectRef(db,message.kind,message.object);return `<div class="notification-row ${message.read?'':'unread'}"><span class="pill ${message.level?'overdue':'ready'}" style="height:28px;padding:5px">${icon(message.level?'alert':'bell')}</span><div><div class="between"><button class="link" style="font-weight:600" onclick="openNotification('${message.id}')">${escapeHtml(message.title)}</button><span class="small muted mono">${message.date}</span></div><div class="subline">${kindLabels[message.kind]} · ${escapeHtml(item?.name||'对象已移除')} · 接收人 ${escapeHtml(message.recipient)}</div><div class="row" style="margin-top:8px">${Object.entries(message.channels).map(([channel,result])=>`<span class="channel ${result.status==='failed'?'bad':''}">${icon(channel==='email'?'mail':'external')} ${channel==='email'?'邮件':'Hems'} · ${result.status==='simulated'?'模拟已发送':result.status==='failed'?'模拟失败':'已取消'}${result.attempts>1?' · '+result.attempts+' 次':''}</span>`).join('')}${item?.status==='done'?'<span class="small good">当前已完成</span>':''}</div></div><div class="row" style="justify-content:flex-end"><button class="icon" title="发送记录" aria-label="查看发送记录" onclick="messageDetails('${message.id}')">${icon('eye')}</button>${!message.read?`<button class="icon" title="标记已读" aria-label="标记已读" onclick="handleOperation(()=>{db.messages.find(item=>item.id==='${message.id}').read=true},'已标记已读')">${icon('check')}</button>`:''}</div></div>`}).join('')||empty('暂无符合条件的通知')}<div class="summary-line">同一对象、接收人、业务日期去重；邮件与 Hems 分别记录结果。${messages.length>100?'当前展示最近 100 条。':''}</div></section>`;}
function runNoticeScan(){handleOperation(()=>{const count=scanNotifications(db);ui.scanCount=count;},'时间线已检查，重复提醒已去重');}
function openNotification(id){const message=db.messages.find(item=>item.id===id);if(!message)return;message.read=true;try{persist();}catch{}render();openObject(message.kind,message.object);}
function messageDetails(id){const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object);modal('双渠道发送记录',`<div class="stack"><div class="note">同一通知事件，两个独立渠道；全部为本地模拟结果。</div><dl class="detail-grid"><div><dt>接收人</dt><dd>${message.recipient}</dd></div><div><dt>通知等级</dt><dd>${message.level?'L'+message.level:'普通提醒'}</dd></div><div class="wide"><dt>业务对象</dt><dd>${escapeHtml(item?.name)}</dd></div></dl>${Object.entries(message.channels).map(([channel,result])=>`<div class="between"><div><h3>${channel==='email'?'邮件':'Hems'}</h3><span class="small muted">${result.status==='simulated'?'模拟已发送':result.status==='failed'?'模拟失败':'旧提醒已取消'} · 尝试 ${result.attempts} 次</span></div>${result.status==='simulated'?`<button type="button" onclick="simulateDeliveryFailure('${id}','${channel}')">模拟发送失败</button>`:result.status==='failed'?`<button type="button" onclick="retryDelivery('${id}','${channel}')">重试此渠道</button>`:''}</div>`).join('')}</div>`,'关闭',closeModal);}
function simulateDeliveryFailure(id,channel){try{transact(()=>{db.messages.find(item=>item.id===id).channels[channel].status='failed';});messageDetails(id);}catch(error){toast(error.message);}}
function retryDelivery(id,channel){try{transact(()=>{const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object),delivery=message.channels[channel];check(delivery.status==='failed','仅重试失败渠道');check(delivery.attempts<=db.notification.retries,'已达到建议重试上限，请联系通知维护人员');if(!item||!visibleTo(db,message.recipient,message.kind,item)||(message.reason==='daily'&&(item.status==='done'||item.due!==message.due||item.status!==message.objectStatus))||(message.reason==='event'&&item.status!==message.objectStatus)){delivery.status='cancelled';return;}delivery.attempts++;delivery.status='simulated';});messageDetails(id);render();}catch(error){toast(error.message);}}
function noticeRulesModal(){const config=db.notification;modal('时间线提醒规则',`<div class="notice" style="margin-bottom:18px">建议默认值，可配置；当前演示工作区共用规则。不会改变任务验收层级。</div><div class="fields">${inputField('首次临期 · 提前天数','lead',config.lead,'number',false,'required min="2" max="30" step="1"')}${inputField('再次临期 · 提前天数','near',config.near,'number',false,'required min="1" max="29" step="1"')}${inputField('二级报警 · 超期天数','second',config.second,'number',false,'required min="2" max="60" step="1"')}${inputField('三级报警 · 超期天数','third',config.third,'number',false,'required min="3" max="90" step="1"')}${inputField('验收等待 · 天数','wait',config.wait,'number',false,'required min="1" max="30" step="1"')}${inputField('每日检查时点 · 小时','scanHour',config.scanHour,'number',false,'required min="0" max="23" step="1"')}</div><div class="note" style="margin-top:15px">一级报警从超期第 1 天起。Task 二级增加 Case 负责人、三级增加 Project 负责人；Case 二级增加 Project 负责人，三级增加监督接收人。未配置监督接收人时不虚构人员。</div>`,'保存规则',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');const next=Object.fromEntries(Object.entries(data).map(([key,value])=>[key,Number(value)]));check(Object.values(next).every(Number.isInteger)&&next.lead>next.near&&next.near>0&&next.third>next.second&&next.second>1&&next.wait>0&&next.scanHour>=0&&next.scanHour<=23,'请满足提前天数递减、报警天数递增的规则');Object.assign(db.notification,next);logEvent(db,null,'更新时间线通知规则');},'提醒规则已保存'));}
function settingsPage(){const project=selectedProject();return pageHead('项目设置',escapeHtml(project.name),`<button ${can('caseEdit')?'':'disabled'} onclick="newProjectModal()">${icon('plus')} 新建 Project</button>`)+`<div class="setting-grid"><section class="panel"><div class="panel-head between"><h2>项目责任与时间</h2><button class="link small" ${can('settings')?'':'disabled'} onclick="editProjectModal()">编辑</button></div><div class="panel-body"><dl class="detail-grid"><div class="wide"><dt>项目目标</dt><dd>${escapeHtml(project.goal)}</dd></div><div><dt>项目负责人</dt><dd>${project.owner}</dd></div><div><dt>Project 验收人</dt><dd>${project.reviewers.join(' → ')}</dd></div><div><dt>计划开始</dt><dd>${project.start}</dd></div><div><dt>计划完成</dt><dd>${project.due}</dd></div><div><dt>监督接收人</dt><dd>${project.oversight||'未配置'}</dd></div><div><dt>当前状态</dt><dd>${badge(project)}</dd></div></dl></div></section><section class="panel"><div class="panel-head between"><h2>演示时间与保存</h2><button class="link small" onclick="demoDateModal()">调整日期</button></div><div class="panel-body"><div class="between"><strong style="font-size:28px" class="mono">${db.today}</strong><span class="tag">Asia/Shanghai</span></div><p class="small muted" style="margin:15px 0">页面打开期间每分钟检查业务日期下的通知与报表计划。关闭页面后不运行服务。实际发送、生产权限与身份认证需后端接入。</p><button onclick="showHelp()">${icon('help')} 演示约定</button><div class="row wrap" style="margin-top:17px"><button onclick="downloadPrototype()">${icon('download')} 下载原型 HTML</button><a class="small" href="Equipment-WBS-prototype.html" target="_blank">原设备 WBS</a></div></div></section></div><section class="panel" style="margin-top:22px"><div class="panel-head between"><h2>角色权限</h2><button class="link small" onclick="permissionModal()" ${can('settings')?'':'disabled'}>配置</button></div><table class="role-table"><thead><tr><th>角色</th><th>数据查看</th><th>Case 创建 / 调整</th><th>模板配置</th><th>设置管理</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${{leader:'Leader',member:'执行成员',reviewer:'验收人员'}[role]}</td><td>${policy.view==='all'?'全部项目范围':'本人参与对象及相关上层'}</td><td>${policy.caseEdit?'允许':'不允许'}</td><td>${policy.template?'允许':'不允许'}</td><td>${policy.settings?'允许':'不允许'}</td></tr>`).join('')}</tbody></table><div class="summary-line">角色决定可见与操作范围；具体任务执行、各层验收仍由指定人员负责，不因角色权限自动成为验收人。</div></section><details class="panel"><summary class="panel-head">项目与设置修改记录</summary><div class="panel-body">${historyHtml(db.events.filter(record=>record.object===project.id||!record.object).slice(0,25))}</div></details>`;}
function demoDateModal(){modal('调整演示业务日期',`${inputField('业务日期','today',db.today,'date',true,'required')}<div class="notice" style="margin-top:16px">用于演示临期和超期升级，不修改任务日期或验收结果。建议向后推进；不会向外部发送任何消息。</div>`,'更新并检查',data=>handleOperation(()=>{check(validDate(data.today),'日期无效');check(data.today>=db.today,'为保留历史时序，业务日期只允许向后推进；需要回退请恢复初始案例');db.today=data.today;scanNotifications(db);runScheduledReports(db);},'业务日期已更新，提醒和报表计划已检查'));}
function projectForm(project={}){return `<div class="fields">${inputField('项目名称','name',project.name||'','text',true,'required maxlength="80"')}<div class="field full"><label>项目目标</label><textarea name="goal" required>${escapeHtml(project.goal||'')}</textarea></div>${peopleSelect('owner',project.owner||'陈昊','负责人')}${peopleSelect('reviewer',project.reviewers?.[0]||'刘洋','Project 验收人')}${peopleSelect('oversight',project.oversight||'','监督接收人',true)}${inputField('开始日期','start',project.start||db.today,'date',false,'required')}${inputField('完成日期','due',project.due||shiftDate(db.today,45),'date',false,'required')}</div>`;}
function validateProjectData(data){check(data.name.trim()&&data.goal.trim(),'请填写名称和目标');check(validDate(data.start)&&validDate(data.due)&&data.due>=data.start,'项目日期无效');return {...data,name:data.name.trim(),goal:data.goal.trim(),reviewers:[data.reviewer]};}
function newProjectModal(){modal('新建 Project',projectForm(),'创建项目',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'caseEdit');const project={...validateProjectData(data),id:makeId('project'),status:'active',approval:0,round:0,history:[]};db.projects.push(project);db.selectedProject=project.id;logEvent(db,project,'建立项目');ui.page='overview';},'项目已创建'));}
function editProjectModal(){const project=selectedProject();modal('编辑项目',projectForm(project),'保存项目',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');check(['active','returned'].includes(project.status),'待验收或已完成项目不能修改责任与计划');Object.assign(project,validateProjectData(data));logEvent(db,project,'更新项目责任与有效计划日期');},'项目设置已保存'));}
function permissionModal(){modal('分级权限配置',`<table><thead><tr><th>角色</th><th>查看范围</th><th>Case 编辑</th><th>模板配置</th><th>设置</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${{leader:'Leader',member:'执行成员',reviewer:'验收人员'}[role]}</td><td><select name="${role}-view"><option value="assigned" ${policy.view==='assigned'?'selected':''}>参与对象</option><option value="all" ${policy.view==='all'?'selected':''}>全部范围</option></select></td>${['caseEdit','template','settings'].map(key=>`<td><input type="checkbox" aria-label="${role} ${key}" name="${role}-${key}" ${policy[key]?'checked':''} ${role==='leader'&&key==='settings'?'disabled':''}></td>`).join('')}</tr>`).join('')}</tbody></table><div class="note" style="margin-top:15px">固定 Leader 演示会话，不切换登录角色。保留当前设置管理入口，生产授权需在服务端执行。可在下方检查指定人员对业务对象的可见性。</div><div class="fields" style="margin-top:15px">${peopleSelect('preview','王宇','权限范围预览')}<div class="field"><label>查看结果</label><button type="button" onclick="previewPermission(document.querySelector('[name=preview]').value)">检查当前权限</button></div></div><div id="permissionPreview" class="small muted" style="margin-top:12px"></div>`,'保存权限',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');for(const role of Object.keys(db.permissions)){db.permissions[role]={view:data[role+'-view'],caseEdit:!!data[role+'-caseEdit'],template:!!data[role+'-template'],settings:role==='leader'||!!data[role+'-settings']};}logEvent(db,null,'更新角色权限配置');},'权限配置已保存'),true);}
function previewPermission(actor){const cases=db.cases.filter(item=>visibleTo(db,actor,'case',item)),tasks=db.tasks.filter(item=>visibleTo(db,actor,'task',item)),policy=db.permissions[db.userRoles[actor]];document.getElementById('permissionPreview').textContent=`${actor}：可查看 ${cases.length} 个 Case、${tasks.length} 项 Task；模板配置${policy.template?'允许':'不允许'}，Case 编辑${policy.caseEdit?'允许':'不允许'}。` ;}
function downloadPrototype(){const bundle=location.pathname.includes('/DH-WBS/WBS-main/')?'../../WBS-DH.zip':'WBS-DH.zip';modal('下载原型',`<div class="stack"><p>设备页复用独立 HTML 文件。离线使用时，两个 HTML 需放在同一目录；下载包已包含完整文件。</p><a href="${bundle}" download="WBS-DH.zip">${icon('download')} 下载完整原型包</a><a href="WBS-DH-prototype.html" download="WBS-DH-prototype.html">下载项目管理 HTML</a><a href="Equipment-WBS-prototype.html" download="Equipment-WBS-prototype.html">下载设备 WBS HTML</a><p class="small muted">下载不包含当前浏览器内的业务数据或上传文件。</p></div>`,'关闭',closeModal);}
function showHelp(){modal('原型演示说明',`<div class="stack"><p>这是可离线打开的桌面端原型。数据与上传文件保存在当前浏览器，不构成正式生产系统。</p><div class="notice">邮件与 Hems 仅生成模拟发送记录，不向外部系统实际发送。页面关闭时不会运行定时任务。</div><p class="small muted">当前固定陈昊 / Leader 视角。执行和验收弹窗会明确显示代办身份；生产系统需由服务端鉴权。</p><p class="small muted">演示采用保守规则：仅调整未开始 Task；下层全部验收后，负责人才能提交上层验收；退回后重新走本对象全部验收。以上为演示约定，详细规则待业务确认。</p><div class="row"><a href="Equipment-WBS-prototype.html" target="_blank">原设备 WBS 原型</a><span class="muted">·</span><button type="button" class="link danger" onclick="resetDemo()">恢复初始演示数据</button></div></div>`,'关闭',closeModal);}
function resetDemo(){modal('恢复初始演示数据','<p>仅清除新版项目管理原型的本地修改与上传文件。原设备 WBS 数据不受影响。</p>','确认恢复',()=>{try{db=createSeed();scanNotifications(db);persist();ui.page='overview';closeDrawer();closeModal();render();toast('已恢复初始案例');}catch(error){toast(error.message);}});}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('modalRoot').innerHTML)closeModal();else closeDrawer();}if(event.key==='Tab'){const dialog=document.querySelector('.modal')||document.querySelector('.drawer');if(!dialog)return;const controls=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(node=>node.getClientRects().length);if(!controls.length)return;const first=controls[0],last=controls.at(-1);if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}}});
render();
setInterval(()=>{try{const count=transact(()=>scanNotifications(db,false)+runScheduledReports(db));if(count&&['notifications','reports'].includes(ui.page))render();}catch(error){storageNotice='自动检查无法保存，请检查浏览器存储。';}},60000);
</script>
</body>
</html>
