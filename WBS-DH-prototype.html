.step-number{border:0;background:var(--ea-color-primary-tint);color:var(--blue);border-radius:8px;font-size:10px}
.setting-grid{gap:16px}
.rule-stop{padding-right:8px;overflow-wrap:anywhere}
.notification-row{padding:16px 20px;gap:12px;border-color:var(--ea-color-divider);overflow-wrap:anywhere}
.notification-row.unread{background:var(--blue-soft)}
.report-numbers strong{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.report-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.report-metrics .metric{min-height:106px}
.report-metrics .metric[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft)}
.report-context{padding:16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.report-context>div{min-width:0}.report-context p{overflow-wrap:anywhere}
.report-facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:12px;font-size:12px;color:var(--muted)}
.report-facts strong{font-weight:500;color:var(--ink)}
.report-tabs{justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.report-tabs>.row{min-width:0;max-width:100%}
.report-tabs select{width:240px;max-width:100%;height:36px;text-overflow:ellipsis}
.report-table{min-width:1220px}
.report-table .mono{white-space:nowrap}
.report-table td{vertical-align:top}
.report-table th.number-cell,.report-table td.number-cell{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.report-table .title-cell{min-width:200px;max-width:300px;overflow-wrap:anywhere}
.report-table .report-reason{min-width:190px;max-width:290px;white-space:normal;overflow-wrap:anywhere}
.report-detail-summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.report-detail-summary .pill{flex-shrink:0}
.report-section{margin:20px 0}.report-section h3{font-size:13px;margin-bottom:12px}
.report-scope{padding:12px 0;margin-bottom:16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.gantt-label{padding-left:var(--table-inset);color:var(--ea-color-body)}
.gantt-bar{height:25px;min-height:25px;padding:0 7px;border-radius:4px;font-size:11px;background:var(--ea-color-divider);border-color:var(--line);color:var(--ea-color-label)}
.gantt-bar.review,.gantt-bar.returned{background:var(--ea-color-divider);border-color:var(--line);color:var(--ea-color-label)}
.gantt-bar.done{background:var(--blue-soft);border-color:var(--ea-color-focus);color:var(--blue)}
.gantt-bar:hover:not(:disabled){border-color:var(--ea-color-focus)}
.gantt-case{min-height:112px}
.gantt-case .gantt-label{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;white-space:normal;background:#fff}
.gantt-case .gantt-label>.link{max-width:100%;min-height:0;line-height:20px;white-space:normal;overflow-wrap:anywhere;text-align:left}
.gantt-case-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:400}
.gantt-case-progress{font-weight:400}
.gantt-case-progress .progress-track{width:128px;max-width:100%}
.gantt-case .gantt-track{height:auto;align-self:stretch;background-color:#fff}
.gantt-case .gantt-bar{top:50%;transform:translateY(-50%);height:28px;min-height:28px;padding:0;overflow:hidden}
.gantt-case .gantt-bar.active,.gantt-case .gantt-bar.returned{background:var(--blue-soft);border-color:var(--ea-color-focus);color:var(--blue)}
.gantt-case .gantt-bar.review{background:#fff6d6;border-color:#d6a700;color:#8a6500}
.gantt-case .gantt-bar.done{background:#e8f6ef;border-color:#329d8e;color:#23766b}
.gantt-case .gantt-bar.overdue{background:#fff0f0;border-color:#d94848;color:#b42318}
.gantt-case-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(72,137,223,.24);pointer-events:none}
.gantt-case .gantt-bar.review .gantt-case-fill{background:#ffe29a}
.gantt-case .gantt-bar.done .gantt-case-fill{background:#bfe8d9}
.gantt-case .gantt-bar.overdue .gantt-case-fill{background:#ffc9c9}
.gantt-case-bar-label{position:relative;display:block;padding:0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-case-unplanned{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.gantt-day.today{background:var(--ea-color-primary-tint);color:var(--blue)}
.today-line{background:var(--ea-color-focus)}
.main.equipment-main{padding:0;overflow:hidden}
.equipment-frame{max-width:none;height:100%;background:var(--bg)}
.equipment-fullscreen #app{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
.equipment-fullscreen .equipment-frame{height:100%}
.sidebar-collapsed{--side:64px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div id="app"></div><div id="drawerRoot"></div><div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
<script>
'use strict';
const STORAGE_KEY = 'wbs-dh-project-v1';
const PEOPLE = ['陈昊','李敏','王宇','赵宁','周岚','刘洋'];
const CURRENT_USER = '陈昊';
const clone = value => JSON.parse(JSON.stringify(value));
const unique = values => [...new Set(values.filter(Boolean))];
const makeId = prefix => prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const dayNumber = date => Date.parse(date + 'T00:00:00Z') / 86400000;
const validDate = date => /^\d{4}-\d{2}-\d{2}$/.test(date || '') && Number.isFinite(dayNumber(date)) && new Date(dayNumber(date)*86400000).toISOString().slice(0,10) === date;
const shiftDate = (date, days) => new Date((dayNumber(date)+days)*86400000).toISOString().slice(0,10);
const elapsedDays = (start, end) => Math.max(0, dayNumber(end)-dayNumber(start));
const check = (value, message) => { if (!value) throw Error(message); };
function definition(id, name, duration, owner, reviewers, evidence) {
  return {id,name,duration,owner,reviewers,evidence};
}
function createSeed() {
  const procurement = [
    definition('s1','需求与技术规格确认',3,'王宇',['李敏'],'设备需求说明及技术规格清单'),
    definition('s2','设备采购与交付准备',8,'赵宁',['李敏','周岚'],'采购确认文件与供应商交付计划'),
    definition('s3','场地、电力与接口准备',6,'王宇',['周岚'],'现场检查清单及接口确认记录'),
    definition('s4','设备安装与调试',3,'赵宁',['李敏'],'安装调试报告'),
    definition('s5','使用验证与交付确认',2,'王宇',['李敏','周岚'],'使用验证报告及交付清单')
  ];
  const program = [
    definition('s1','测试需求确认',2,'王宇',['李敏'],'测试需求与覆盖范围'),
    definition('s2','程序开发',6,'王宇',['李敏'],'程序版本与开发说明'),
    definition('s3','测试用例准备',4,'赵宁',['周岚'],'测试用例清单'),
    definition('s4','集成验证',3,'王宇',['李敏','周岚'],'验证结果及问题关闭记录')
  ];
  const product = [
    definition('s1','研发目标确认',2,'李敏',['周岚'],'目标及验收标准'),
    definition('s2','方案设计',4,'王宇',['李敏','周岚'],'设计方案及评审材料'),
    definition('s3','工程验证',3,'赵宁',['李敏'],'工程验证报告')
  ];
  const state = {
    schema:1,today:'2026-09-14',selectedProject:'p1',categories:[{id:'cat1',name:'设备采购'},{id:'cat2',name:'程序开发'},{id:'cat3',name:'产品研发'}],
    templates:[{id:'tpl1',category:'cat1',name:'设备采购标准流程',versions:[{version:1,date:'2026-09-01',tasks:procurement}]},{id:'tpl2',category:'cat2',name:'测试程序开发流程',versions:[{version:1,date:'2026-09-01',tasks:program}]},{id:'tpl3',category:'cat3',name:'产品研发标准流程',versions:[{version:1,date:'2026-09-01',tasks:product}]}],
    projects:[{id:'p1',name:'研发实验室建设',goal:'完成测试环境、设备与研发能力建设，支撑试产验证。',owner:'陈昊',reviewers:['刘洋'],start:'2026-09-01',due:'2026-10-15',status:'active',approval:0,round:0,history:[]}],
    cases:[],tasks:[],events:[],messages:[],reports:[],lastReportDate:'2026-09-07',
    notification:{lead:3,near:1,wait:2,scanHour:9,retries:3},
    reportSchedule:{enabled:true,period:'week',next:'2026-09-21'},
    assignments:[],assignmentExempt:['刘洋'],
    permissions:{leader:{view:'all',caseEdit:true,template:true,settings:true,assign:true,assignScope:'all',assignmentAudit:'all'},member:{view:'assigned',caseEdit:false,template:false,settings:false},reviewer:{view:'assigned',caseEdit:false,template:false,settings:false}},
    userRoles:{'陈昊':'leader','李敏':'reviewer','王宇':'member','赵宁':'member','周岚':'reviewer','刘洋':'reviewer'}
  };
  const caseSpecs = [
    ['c1','测试设备采购与交付','tpl1','2026-09-03','2026-09-23','李敏','周岚'],
    ['c2','晶圆测试程序开发','tpl2','2026-09-10','2026-09-28','王宇','李敏'],
    ['c3','可靠性验证设备采购','tpl1','2026-09-01','2026-09-30','赵宁','李敏'],
    ['c4','测量模块研发','tpl3','2026-09-01','2026-09-14','李敏','周岚']
  ];
  for (const [id,name,templateId,start,due,owner,reviewer] of caseSpecs) {
    const instance = instantiate(state,{id,name,templateId,start,due,owner,reviewers:[reviewer],project:'p1',goal:'完成' + name + '并形成独立交付。'},false);
    for (const task of caseTasks(state,instance.id)) {
      if (task.sourceId==='s1' || instance.id==='c4') seedComplete(task,task.due);
    }
  }
  const first = caseTasks(state,'c1');
  const reviewTask = first.find(task=>task.sourceId==='s2');
  reviewTask.status='review'; reviewTask.submittedAt='2026-09-11'; reviewTask.startedAt='2026-09-06'; reviewTask.round=1;
  reviewTask.files=[sampleEvidence('供应商交付计划.txt','设备交付计划：2026-09-16 完成交付准备。')];
  reviewTask.history.push({at:'2026-09-11',actor:reviewTask.owner,text:'提交验收',round:1,files:clone(reviewTask.files)});
  first.find(task=>task.sourceId==='s3').status='active';
  first.find(task=>task.sourceId==='s3').startedAt='2026-09-06';
  for (const task of caseTasks(state,'c2')) if (['s2','s3'].includes(task.sourceId)) {task.status='active';task.startedAt='2026-09-12';}
  const late = caseTasks(state,'c3').find(task=>task.sourceId==='s2');late.status='returned';late.due='2026-09-07';late.startedAt='2026-09-04';late.round=1;late.files=[sampleEvidence('采购需求.txt','待补充供应商确认文件。')];late.history.push({at:'2026-09-10',actor:'李敏',text:'退回：请补充供应商确认日期。',round:1});
  const prepared = state.cases.find(item=>item.id==='c4');prepared.status='review';prepared.round=1;prepared.submittedAt='2026-09-12';prepared.history.push({at:'2026-09-12',actor:prepared.owner,text:'提交 Case 整体验收'});
  state.events.push({id:'seed-event',at:'2026-09-12',actor:'李敏',object:'c4',text:'测量模块研发已提交 Case 整体验收。'});
  return state;
}
function sampleEvidence(name,text) { return {id:makeId('file'),name,size:text.length,type:'text/plain',data:'data:text/plain;charset=utf-8,'+encodeURIComponent(text),sample:true}; }
function seedComplete(task,date) {
  task.status='done';task.approval=task.reviewers.length;task.completedAt=date;task.startedAt=task.start;task.round=1;task.files=[sampleEvidence('交付记录.txt',task.name+'：演示交付记录。')];
  task.history.push({at:date,actor:task.reviewers.at(-1),text:'全部验收通过（初始示例）',round:1,files:clone(task.files)});
}
function addSummaryDemoProjects(state) {
  if(state.summaryDemoVersion>=2)return 0;
  const previousVersion=state.summaryDemoVersion||0;
  const demo=createSeed();
  demo.today=state.today;demo.projects=[];demo.cases=[];demo.tasks=[];demo.messages=[];
  demo.templates=state.templates.filter(template=>['tpl1','tpl2','tpl3'].includes(template.id)&&template.versions.length).map(template=>({...clone(template),versions:[clone(template.versions[0])]}));
  const specs=[
    {id:'summary-demo-pilot',name:'试产验证平台升级',owner:'王宇',reviewers:['周岚'],start:-20,due:25,status:'active',goal:'完成试产测试设备与验证程序升级，支持新产品试产。',cases:[
      {id:'summary-demo-pilot-equipment',name:'试产测试设备升级',templateId:'tpl1',owner:'李敏',reviewers:['周岚'],start:-10,due:15,status:'active'},
      {id:'summary-demo-pilot-program',name:'试产验证程序开发',templateId:'tpl2',owner:'王宇',reviewers:['李敏'],start:-20,due:4,status:'review'},
      {id:'summary-demo-pilot-overdue',name:'试产数据接口联调（超期演示）',templateId:'tpl3',owner:'赵宁',reviewers:['周岚'],start:-14,due:-3,status:'active'}
    ]},
    {id:'summary-demo-reliability',name:'可靠性测试能力扩建',owner:'赵宁',reviewers:['刘洋'],start:-40,due:7,status:'review',goal:'完成可靠性测试设备交付及测量模块验证，形成扩建成果。',cases:[
      {id:'summary-demo-reliability-equipment',name:'可靠性测试设备交付',templateId:'tpl1',owner:'李敏',reviewers:['周岚'],start:-35,due:-5,status:'done'},
      {id:'summary-demo-reliability-module',name:'可靠性测量模块验证',templateId:'tpl3',owner:'赵宁',reviewers:['李敏'],start:-25,due:-4,status:'done'}
    ]},
    {id:'summary-demo-data',name:'测试数据平台一期',owner:'李敏',reviewers:['刘洋'],start:-50,due:-5,status:'done',goal:'完成测试数据采集与分析模块建设并通过独立Project验收。',cases:[
      {id:'summary-demo-data-program',name:'测试数据采集程序开发',templateId:'tpl2',owner:'王宇',reviewers:['李敏'],start:-45,due:-15,status:'done'},
      {id:'summary-demo-data-module',name:'测试数据分析模块研发',templateId:'tpl3',owner:'赵宁',reviewers:['周岚'],start:-40,due:-12,status:'done'}
    ]}
  ];
  function acceptParent(item,date){item.status='done';item.approval=item.reviewers.length;item.round=1;item.submittedAt=shiftDate(date,-1);item.completedAt=date;item.history.push({at:date,actor:item.reviewers.at(-1),text:'整体验收通过（演示数据）',round:1});}
  function submitParentSample(item,date){item.status='review';item.round=1;item.submittedAt=date;item.history.push({at:date,actor:item.owner,text:'提交整体验收（演示数据）',round:1});}
  function seedActiveCase(instance){
    const tasks=caseTasks(demo,instance.id);seedComplete(tasks[0],tasks[0].due);
    for(const task of tasks.slice(1)){task.status='active';task.startedAt=task.start;}
    const reviewTask=tasks.find(task=>task.status==='active');
    if(reviewTask){reviewTask.status='review';reviewTask.round=1;reviewTask.submittedAt=shiftDate(state.today,-1);reviewTask.files=[sampleEvidence('设备升级交付计划.txt','设备升级交付与验证计划（演示数据）。')];reviewTask.history.push({at:reviewTask.submittedAt,actor:reviewTask.owner,text:'提交验收（演示数据）',round:1,files:clone(reviewTask.files)});}
  }
  if(previousVersion===1){
    const project=state.projects.find(item=>item.id==='summary-demo-pilot'),values=specs[0].cases.find(item=>item.id==='summary-demo-pilot-overdue');
    if(project&&!state.cases.some(item=>item.id===values.id)&&demo.templates.some(template=>template.id===values.templateId)){
      demo.projects.push(clone(project));
      const instance=instantiate(demo,{id:values.id,name:values.name,templateId:values.templateId,owner:values.owner,reviewers:values.reviewers,start:shiftDate(state.today,values.start),due:shiftDate(state.today,values.due),project:project.id,goal:'完成'+values.name+'并提交独立交付成果。'},false);
      seedActiveCase(instance);state.cases.push(...demo.cases);state.tasks.push(...demo.tasks);
    }
    state.summaryDemoVersion=2;return 1;
  }
  for(const spec of specs){
    if(state.projects.some(project=>project.id===spec.id)||spec.cases.some(instance=>state.cases.some(existing=>existing.id===instance.id)||!demo.templates.some(template=>template.id===instance.templateId)))continue;
    const project={id:spec.id,name:spec.name,goal:spec.goal,owner:spec.owner,reviewers:spec.reviewers,start:shiftDate(state.today,spec.start),due:shiftDate(state.today,spec.due),status:'active',approval:0,round:0,history:[]};
    demo.projects.push(project);
    for(const values of spec.cases){
      const instance=instantiate(demo,{id:values.id,name:values.name,templateId:values.templateId,owner:values.owner,reviewers:values.reviewers,start:shiftDate(state.today,values.start),due:shiftDate(state.today,values.due),project:project.id,goal:'完成'+values.name+'并提交独立交付成果。'},false);
      const tasks=caseTasks(demo,instance.id);
      if(values.status==='active'){
        seedActiveCase(instance);
      }else{
        tasks.forEach(task=>seedComplete(task,task.due));
        if(values.status==='done')acceptParent(instance,instance.due);
        else submitParentSample(instance,shiftDate(state.today,-1));
      }
    }
    if(spec.status==='done')acceptParent(project,shiftDate(state.today,-7));
    else if(spec.status==='review')submitParentSample(project,shiftDate(state.today,-2));
  }
  state.projects.push(...demo.projects);state.cases.push(...demo.cases);state.tasks.push(...demo.tasks);state.summaryDemoVersion=2;
  return demo.projects.length;
}
function addMyWorkDemoProject(state){
  if(state.myWorkDemoVersion>=1)return 0;
  const projectId='my-work-demo',activeCaseId='my-work-demo-environment',reviewCaseId='my-work-demo-documents';
  if(state.projects.some(project=>project.id===projectId)||state.cases.some(instance=>[activeCaseId,reviewCaseId].includes(instance.id)))return 0;
  const template=state.templates.find(item=>item.versions?.length);if(!template)return 0;
  const demo={...state,projects:[],cases:[],tasks:[],events:[],messages:[]},date=offset=>shiftDate(state.today,offset);
  const project={id:projectId,name:'我的工作演示',goal:'演示个人Task执行、多人验收和 Case 整体验收。',owner:CURRENT_USER,reviewers:['刘洋'],start:date(-10),due:date(15),status:'active',approval:0,round:0,history:[]};
  demo.projects.push(project);
  const active=instantiate(demo,{id:activeCaseId,name:'测试环境部署与验证（演示）',templateId:template.id,owner:'李敏',reviewers:['周岚'],project:projectId,start:date(-8),due:date(8),goal:'完成环境、接口与回归验证，形成可验收的测试环境。'},false,[
    definition('work-review-environment','测试环境配置验收',3,'王宇',[CURRENT_USER],'环境配置清单与连通性验证结果'),
    definition('work-review-interface','接口联调结果验收',4,'赵宁',[CURRENT_USER,'周岚'],'接口联调报告与问题关闭记录'),
    definition('work-ready','编写回归测试计划',5,CURRENT_USER,['李敏'],'回归范围、测试清单及排期'),
    definition('work-active','执行关键场景回归',5,CURRENT_USER,['周岚'],'回归记录与缺陷清单'),
    definition('work-returned','补充异常场景验证报告',3,CURRENT_USER,['李敏'],'异常复现步骤、修复说明和验证结果')
  ]);
  const tasks=caseTasks(demo,active.id);
  for(const [index,offset] of [[0,-2],[1,1]]){
    const task=tasks[index];Object.assign(task,{status:'review',duration:offset+7,start:date(-6),due:date(offset),startedAt:date(-6),submittedAt:date(-3),round:1,acceptedReviewers:index===1?['周岚']:[],approval:index===1?1:0});
    task.files=[sampleEvidence('验收材料（演示）.txt',task.name+'：配置及验证结果，仅用于演示。')];
    task.history.push({at:task.submittedAt,actor:task.owner,text:'提交验收（演示数据）',round:1,files:clone(task.files)});
    if(index===1)task.history.push({at:date(-2),actor:'周岚',text:'验收通过，等待其他验收人（演示数据）',round:1});
  }
  Object.assign(tasks[2],{start:date(0),due:date(4)});
  Object.assign(tasks[3],{status:'active',start:date(-2),due:date(2),startedAt:date(-2)});
  tasks[3].history.push({at:date(-2),actor:CURRENT_USER,text:'开始执行（演示数据）'});

function myReviewState(kind,item){
  if(item.status==='terminated')return 'terminated';

  const passed=kind==='task'?acceptedTaskReviewers(item).includes(CURRENT_USER):item.status==='done'||item.status==='review'&&item.reviewers.indexOf(CURRENT_USER)<item.approval;
  return passed?'passed':'waiting';

function myReviewEntries(includeClosed=false){return [...myScopeTasks().map(item=>({kind:'task',item})),...myScopeCases().map(item=>({kind:'case',item})),...myScopeProjects().map(item=>({kind:'project',item}))].filter(entry=>entry.item.reviewers.includes(CURRENT_USER)&&(includeClosed||openWorkEntry(entry)));}
function myOwnedEntries(includeClosed=false){

function modal(title,body,submitLabel,handler,wide=false,footerStart=''){modalReturnFocus=document.activeElement;document.getElementById('modalRoot').innerHTML=`<div class="modal-mask"><section class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><form id="dialogForm" novalidate><div class="modal-head between"><h2>${escapeHtml(title)}</h2><button class="icon" type="button" aria-label="关闭弹窗" onclick="closeModal()">${icon('close')}</button></div><div class="modal-body">${body}<div class="error" id="modalError" role="alert"></div></div><div class="modal-foot">${footerStart}<button type="button" onclick="closeModal()">取消</button><button class="primary" type="submit">${escapeHtml(submitLabel)}</button></div></form></section></div>`;document.getElementById('dialogForm').onsubmit=async event=>{event.preventDefault();const form=event.target,invalid=form.checkValidity&&!form.checkValidity()?form.querySelector(':invalid'):null;if(invalid){const label=invalid.id?form.querySelector(`label[for="${invalid.id}"]`):null,name=(label?.textContent||invalid.getAttribute('aria-label')||'必填项').replace('*','').trim(),target=document.getElementById('modalError');if(target)target.textContent='请填写必填项：'+name;invalid.reportValidity?.();invalid.focus?.();return;}const button=form.querySelector('[type=submit]');button.disabled=true;try{await handler(Object.fromEntries(new FormData(form)),form);}catch(error){const target=document.getElementById('modalError');if(target)target.textContent=error.message;}finally{button.disabled=false;}};setTimeout(()=>document.querySelector('#dialogForm input,#dialogForm select,#dialogForm textarea,#dialogForm button')?.focus(),0);}

function caseAssociationBlockReason(instance,targetId){

  const source=findProject(db,instance.project);
  if(source&&['review','done'].includes(source.status))return '原 Project 已进入验收或完成';
  return '';

function caseAssociationCases(){
  const state=caseAssociationState;if(!state)return [];
  const query=state.query.trim().toLowerCase();
  return db.cases.filter(instance=>visibleTo(db,CURRENT_USER,'case',instance))
    .filter(instance=>state.project==='all'||(state.project==='unassigned'?!instance.project:instance.project===state.project))
    .filter(instance=>!state.status||matchesSharedStatus(instance,state.status))
    .filter(instance=>!query||[instance.name,instance.owner].join(' ').toLowerCase().includes(query))
    .sort((a,b)=>caseProjectName(a).localeCompare(caseProjectName(b),'zh-CN')||a.name.localeCompare(b.name,'zh-CN'));

function reportCaseTable(report){

function reportTaskDetail(reportId,taskId){

  modal('Task 历史快照',`<div class="report-detail-summary">${badge(task)}<span class="small muted">快照 ${report.generated} · 统计 ${report.from} 至 ${report.to}</span></div><h3>${escapeHtml(task.name)}</h3><p class="subline">${escapeHtml(instance?.name)}</p><dl class="detail-grid"><div><dt>执行人</dt><dd>${escapeHtml(task.owner)}</dd></div><div><dt>验收人员</dt><dd>${escapeHtml(task.reviewers.join('、'))}</dd></div><div><dt>计划周期</dt><dd>${task.start||'未记录'} 至 ${task.due||'未记录'}</dd></div><div><dt>实际开始 / 完成</dt><dd>${task.startedAt||'未记录'} / ${task.completedAt||'未完成'}</dd></div><div><dt>期末超期</dt><dd>${reportOverdue(task,report.generated)?elapsedDays(task.due,report.generated)+' 天':'否'}</dd></div><div><dt>待验收人员 / 等待（快照时）</dt><dd>${task.status==='review'?escapeHtml(currentHandler(task)||'未记录')+' · '+(wait===null?'起点未记录':wait+' 天'):'不在待验收'}</dd></div><div class="wide"><dt>交付要求</dt><dd>${escapeHtml(task.evidence)}</dd></div></dl><section class="report-section"><h3>本期退回记录 · ${events.length} 次</h3>${historyHtml(events)}</section><details class="report-section"><summary>截至快照的Task记录</summary><div style="margin-top:16px">${historyHtml(task.history)}</div></details><div class="report-scope"><button type="button" class="link" ${available?'':'disabled'} onclick="openCurrentReportTask('${report.id}','${task.id}')">${icon('external')} 查看当前Task</button>${available?'<span class="small muted"> · 当前状态可能与本期快照不同</span>':'<span class="small muted"> · Task已不存在或无查看权限</span>'}</div>`,'关闭',closeModal);

function openCurrentReportTask(reportId,taskId){const report=accessibleReport(reportId),task=objectRef(db,'task',taskId);if(!report?.snapshot?.tasks.some(item=>item.id===taskId)||!task||!visibleTo(db,CURRENT_USER,'task',task))return toast('当前Task不存在或没有查看权限');closeModal();openObject('task',taskId);}
function generateReportModal(){if(!canReadProjectReport(selectedProject()?.id))return toast('没有Project完整报表查看权限');modal('生成Project周会报表',`<div class="fields">${inputField('统计开始','from',shiftDate(db.today,-6),'date',false,'required')}${inputField('统计截止','to',db.today,'date',false,'required')}</div>`,'生成报表',data=>handleOperation(()=>{check(canReadProjectReport(selectedProject()?.id),'没有Project完整报表查看权限');const report=buildReport(db,selectedProject()?.id,data.from,data.to);rememberPage();Object.assign(ui,{reportId:report.id,reportTab:'cases',reportMetric:'all',reportCaseId:''});},'周会报表已生成'))}
function reportScheduleModal(){modal('周期报表配置',`<div class="fields"><div class="field"><label>自动生成</label><select name="enabled"><option value="yes" ${db.reportSchedule.enabled?'selected':''}>开启</option><option value="no" ${!db.reportSchedule.enabled?'selected':''}>暂停</option></select></div><div class="field"><label>时间周期</label><select name="period"><option value="week" ${db.reportSchedule.period==='week'?'selected':''}>每周</option><option value="month" ${db.reportSchedule.period==='month'?'selected':''}>每月（月初）</option></select></div>${inputField('下次生成日期','next',db.reportSchedule.next,'date',true,'required')}</div><div class="note" style="margin-top:16px">演示为工作区统一计划。若关闭期间错过多期，重新打开时合并生成一份至当前业务日期的快照，不虚构历史状态。</div>`,'保存计划',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');check(validDate(data.next),'日期无效');db.reportSchedule={enabled:data.enabled==='yes',period:data.period,next:data.next};runScheduledReports(db);},'周期计划已保存'));}
function downloadText(name,text,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function reportExportRows(report){
  const detailed=hasReportDetails(report),rows=[
    ['Project周会报表',detailed?'历史明细快照':'仅汇总：历史明细未记录'],
    ['Project','Project标识','统计开始','统计截止','生成业务日期','Case 数量','Task 数量','本期完成 Task','期末待验收 Task','期末超期 Task','累计已验收 Case','本期验收完成 Case','Project 已验收','完成周期均值（自然日含验收）','周期有效样本数','本期退回次数'],
    [report.snapshot?.project.name||'历史Project（名称未记录）',report.project,report.from,report.to,report.generated,report.caseCount,report.taskCount,report.completed,report.review,report.overdue,report.caseAccepted,report.caseCompleted??'',report.projectAccepted?'是':'否',report.executionMean??'',report.cycleSamples??'',report.returns]
  ];
  if(!detailed)return rows;
  const project=report.snapshot.project;
  rows.push([],['Project快照'],['Project目标','负责人','验收人','期末状态','计划开始日期','计划完成日期'],[project.goal,project.owner,project.reviewers.join(' / '),statusLabels[project.status]||project.status,project.start,project.due],[],['Case 明细'],['Case 标识','Case 名称','目标','负责人','验收人','期末状态','计划开始日期','计划完成日期','实际完成','本期验收完成','期末超期天数','Task 总数','本期完成 Task','期末待验收 Task','期末超期 Task','本期退回次数']);
  for(const instance of report.snapshot.cases){
    const summary=reportTaskSummary(report.snapshot.tasks.filter(task=>task.caseId===instance.id),report.from,report.to,report.generated);
    rows.push([instance.id,instance.name,instance.goal,instance.owner,instance.reviewers.join(' / '),statusLabels[instance.status]||instance.status,instance.start,instance.due,instance.completedAt,reportCompleted(instance,report.from,report.to)?'是':'否',reportOverdue(instance,report.generated)?elapsedDays(instance.due,report.generated):'',summary.taskCount,summary.completed,summary.review,summary.overdue,summary.returns]);
  }
  rows.push([],['Task 明细'],['Task 标识','Task 名称','所属 Case','执行人','验收人','期末状态','计划开始日期','计划完成日期','实际开始','实际完成','本期完成','完成周期（自然日含验收）','期末超期天数','期末处理人','验收等待（天）','等待起点','交付要求','本期退回次数']);
  for(const task of report.snapshot.tasks){
    const instance=report.snapshot.cases.find(item=>item.id===task.caseId);
    rows.push([task.id,task.name,instance?.name||'',task.owner,task.reviewers.join(' / '),statusLabels[task.status]||task.status,task.start,task.due,task.startedAt,task.completedAt,reportCompleted(task,report.from,report.to)?'是':'否',task.status==='done'?reportCycle(task)??'':'',reportOverdue(task,report.generated)?elapsedDays(task.due,report.generated):'',task.status==='done'?'':currentHandler(task)||'',reportWait(task,report.generated)??'',task.status==='review'?task.submittedAt:'',task.evidence,reportReturns(task,report.from,report.to).length]);
  }
  rows.push([],['本期退回记录'],['Task 标识','Task 名称','所属 Case','日期','操作人','提交轮次','退回记录']);
  for(const task of report.snapshot.tasks)for(const event of reportReturns(task,report.from,report.to))rows.push([task.id,task.name,report.snapshot.cases.find(item=>item.id===task.caseId)?.name||'',event.at,event.actor,event.round||'',event.text]);
  return rows;
}
function reportCSV(report){const rows=reportExportRows(report),width=Math.max(...rows.map(row=>row.length));return '\ufeff'+rows.map(row=>Array.from({length:width},(_,index)=>{let text=String(row[index]??'');if(/^\s*[=+@-]|^[\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
function exportReport(id){const report=accessibleReport(id);if(!report)return toast('报表不存在或没有查看权限');downloadText('WBS-DH-周会报表-'+report.to+'.csv',reportCSV(report));toast(hasReportDetails(report)?'Project汇总、Case、Task 和退回记录已导出':'旧版汇总已导出，历史明细未记录');}
function notificationsPage(){let messages=db.messages.filter(message=>(message.project===selectedProject()?.id||!message.project)&&!message.closedAt&&(ui.notificationTab!=='mine'||message.recipient===CURRENT_USER)&&(ui.notificationTab!=='overdue'||message.overdue));const config=db.notification;return pageHead('通知中心','邮件 / Hems · 模拟发送',`<button onclick="noticeRulesModal()" ${can('settings')?'':'disabled'}>${icon('settings')} 提醒规则</button><button class="primary" onclick="runNoticeScan()">${icon('refresh')} 检查当前时间线</button>`)+`<div class="notice" style="margin-bottom:18px">本地演示：通知仅生成模拟记录，不发送真实邮件或 Hems 消息。已读不会改变Task或验收状态。</div><section class="panel"><div class="panel-body"><div class="between"><h2>时间线提醒</h2><span class="small muted">自然日 · Asia/Shanghai · 每日 ${String(config.scanHour).padStart(2,'0')}:00</span></div><div class="timeline-rules">${[['D − '+config.lead,'临期提醒'],['D − '+config.near,'再次提醒'],['D 当天','今日到期'],['D + 1 起','超期提醒']].map(([day,label])=>`<div class="rule-stop"><span>${day}</span><strong>${label}</strong></div>`).join('')}</div></div></section><section class="panel"><div class="between"><div class="tabs">${[['all','Project通知'],['mine','发给我的'],['overdue','超期提醒']].map(([value,label])=>`<button class="${ui.notificationTab===value?'active':''}" onclick="ui.notificationTab='${value}';render()">${label}</button>`).join('')}</div><span class="small muted" style="margin-right:20px">${messages.length} 条接收记录</span></div>${messages.slice(0,100).map(message=>{const item=objectRef(db,message.kind,message.object);return `<div class="notification-row ${message.read?'':'unread'}"><span class="pill ${message.overdue?'overdue':'ready'}" style="height:28px;padding:5px">${icon(message.overdue?'alert':'bell')}</span><div><div class="between"><button class="link" style="font-weight:600" onclick="openNotification('${message.id}')">${escapeHtml(message.title)}</button><span class="small muted mono">${message.date}</span></div><div class="subline">${kindLabels[message.kind]} · ${escapeHtml(item?.name||'对象已移除')} · 接收人 ${escapeHtml(message.recipient)}</div><div class="row" style="margin-top:8px">${Object.entries(message.channels).map(([channel,result])=>`<span class="channel ${result.status==='failed'?'bad':''}">${icon(channel==='email'?'mail':'external')} ${channel==='email'?'邮件':'Hems'} · ${result.status==='simulated'?'模拟已发送':result.status==='failed'?'模拟失败':'已取消'}${result.attempts>1?' · '+result.attempts+' 次':''}</span>`).join('')}${item?.status==='done'?'<span class="small good">当前已完成</span>':''}</div></div><div class="row" style="justify-content:flex-end"><button class="icon" title="发送记录" aria-label="查看发送记录" onclick="messageDetails('${message.id}')">${icon('eye')}</button>${!message.read?`<button class="icon" title="标记已读" aria-label="标记已读" onclick="handleOperation(()=>{db.messages.find(item=>item.id==='${message.id}').read=true},'已标记已读')">${icon('check')}</button>`:''}</div></div>`}).join('')||empty('暂无符合条件的通知')}<div class="summary-line">同一对象、接收人、业务日期去重；邮件与 Hems 分别记录结果。${messages.length>100?'当前展示最近 100 条。':''}</div></section>`;}
function runNoticeScan(){handleOperation(()=>{const count=scanNotifications(db);ui.scanCount=count;},'时间线已检查，重复提醒已去重');}
function openNotification(id){const message=db.messages.find(item=>item.id===id);if(!message)return;message.read=true;try{persist();}catch{}render();openObject(message.kind,message.object);}
function messageDetails(id){const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object);modal('双渠道发送记录',`<div class="stack"><div class="note">同一通知事件，两个独立渠道；全部为本地模拟结果。</div><dl class="detail-grid"><div><dt>接收人</dt><dd>${message.recipient}</dd></div><div><dt>通知类型</dt><dd>${message.overdue?'超期提醒':'普通提醒'}</dd></div><div class="wide"><dt>业务对象</dt><dd>${escapeHtml(item?.name)}</dd></div></dl>${Object.entries(message.channels).map(([channel,result])=>`<div class="between"><div><h3>${channel==='email'?'邮件':'Hems'}</h3><span class="small muted">${result.status==='simulated'?'模拟已发送':result.status==='failed'?'模拟失败':'旧提醒已取消'} · 尝试 ${result.attempts} 次</span></div>${result.status==='simulated'?`<button type="button" onclick="simulateDeliveryFailure('${id}','${channel}')">模拟发送失败</button>`:result.status==='failed'?`<button type="button" onclick="retryDelivery('${id}','${channel}')">重试此渠道</button>`:''}</div>`).join('')}</div>`,'关闭',closeModal);}
function simulateDeliveryFailure(id,channel){try{transact(()=>{db.messages.find(item=>item.id===id).channels[channel].status='failed';});messageDetails(id);}catch(error){toast(error.message);}}
function retryDelivery(id,channel){try{transact(()=>{const message=db.messages.find(item=>item.id===id),item=objectRef(db,message.kind,message.object),delivery=message.channels[channel];check(delivery.status==='failed','仅重试失败渠道');check(delivery.attempts<=db.notification.retries,'已达到建议重试上限，请联系通知维护人员');if(!item||!visibleTo(db,message.recipient,message.kind,item)||(message.reason==='daily'&&(item.status==='done'||item.due!==message.due||item.status!==message.objectStatus))||(message.reason==='event'&&item.status!==message.objectStatus)){delivery.status='cancelled';return;}delivery.attempts++;delivery.status='simulated';});messageDetails(id);render();}catch(error){toast(error.message);}}
function noticeRulesModal(){const config=db.notification;modal('时间线提醒规则',`<div class="notice" style="margin-bottom:18px">当前阶段只保留临期、到期、超期和验收等待提醒，不设置报警级别或额外接收人。</div><div class="fields">${inputField('首次临期 · 提前天数','lead',config.lead,'number',false,'required min="2" max="30" step="1"')}${inputField('再次临期 · 提前天数','near',config.near,'number',false,'required min="1" max="29" step="1"')}${inputField('验收等待 · 天数','wait',config.wait,'number',false,'required min="1" max="30" step="1"')}${inputField('每日检查时点 · 小时','scanHour',config.scanHour,'number',false,'required min="0" max="23" step="1"')}</div>`,'保存规则',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');const next=Object.fromEntries(Object.entries(data).map(([key,value])=>[key,Number(value)]));check(Object.values(next).every(Number.isInteger)&&next.lead>next.near&&next.near>0&&next.wait>0&&next.scanHour>=0&&next.scanHour<=23,'请满足提前天数递减及检查时点有效的规则');Object.assign(db.notification,next);logEvent(db,null,'更新时间线通知规则');},'提醒规则已保存'));}
function settingsPage(){const project=selectedProject();if(!project)return pageHead('Project设置','')+empty('请先创建 Project');return pageHead('Project设置','')+`<div class="setting-grid"><section class="panel"><div class="panel-head between"><h2>Project责任与时间</h2><button class="link small" ${can('settings')?'':'disabled'} onclick="editProjectModal()">编辑</button></div><div class="panel-body"><dl class="detail-grid">${project.goal?.trim()?`<div class="wide"><dt>目标与交付</dt><dd>${escapeHtml(project.goal)}</dd></div>`:''}<div><dt>Project负责人</dt><dd>${escapeHtml(project.owner)}</dd></div><div><dt>Project验收人</dt><dd>${project.reviewers.map(escapeHtml).join(' → ')}</dd></div><div><dt>计划开始日期</dt><dd>${project.start}</dd></div><div><dt>计划完成日期</dt><dd>${project.due}</dd></div><div><dt>当前状态</dt><dd>${badge(project)}</dd></div></dl></div></section><section class="panel"><div class="panel-head between"><h2>演示时间与保存</h2><button class="link small" onclick="demoDateModal()">调整日期</button></div><div class="panel-body"><div class="between"><strong style="font-size:28px" class="mono">${db.today}</strong><span class="tag">Asia/Shanghai</span></div><p class="small muted" style="margin:15px 0">页面打开期间每分钟检查业务日期下的通知与报表计划。关闭页面后不运行服务。实际发送、生产权限与身份认证需后端接入。</p><button onclick="showHelp()">${icon('help')} 演示约定</button><div class="row wrap" style="margin-top:17px"><button onclick="downloadPrototype()">${icon('download')} 下载原型 HTML</button><a class="small" href="Equipment-WBS-prototype.html" target="_blank">原设备 WBS</a></div></div></section></div><section class="panel" style="margin-top:22px"><div class="panel-head between"><h2>角色权限</h2><button class="link small" onclick="permissionModal()" ${can('settings')?'':'disabled'}>配置</button></div><table class="role-table"><thead><tr><th>角色</th><th>数据查看</th><th>Case 创建 / 调整</th><th>模版配置</th><th>设置管理</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${escapeHtml(roleLabel(role))}</td><td>${policy.view==='all'?'全部Project范围':'本人参与对象及相关上层'}</td><td>${policy.caseEdit?'允许':'不允许'}</td><td>${policy.template?'允许':'不允许'}</td><td>${policy.settings?'允许':'不允许'}</td></tr>`).join('')}</tbody></table><div class="summary-line">角色决定可见与操作范围；具体Task执行、各层验收仍由指定人员负责，不因角色权限自动成为验收人。</div></section><details class="panel"><summary class="panel-head">Project与设置修改记录</summary><div class="panel-body">${historyHtml(db.events.filter(record=>record.object===project.id||!record.object).slice(0,25))}</div></details>`;}
function demoDateModal(){modal('调整演示业务日期',`${inputField('业务日期','today',db.today,'date',true,'required')}<div class="notice" style="margin-top:16px">用于演示临期、到期和超期提醒，不修改Task日期或验收结果。建议向后推进；不会向外部发送任何消息。</div>`,'更新并检查',data=>handleOperation(()=>{check(validDate(data.today),'日期无效');check(data.today>=db.today,'为保留历史时序，业务日期只允许向后推进；需要回退请恢复初始Case');db.today=data.today;scanNotifications(db);runScheduledReports(db);},'业务日期已更新，提醒和报表计划已检查'));}
function projectForm(project={}){const reviewer=Object.hasOwn(project,'reviewers')?project.reviewers[0]||'':'刘洋';return `<div class="fields">${inputField('Project 名称','name',project.name||'','text',true,'required maxlength="80"')}${peopleSelect('owner',project.owner||CURRENT_USER,'Project负责人')}${project.reviewers?.length>1?`<div class="field"><label>Project验收人</label><div>${project.reviewers.map(escapeHtml).join(' → ')}</div></div>`:peopleSelect('reviewer',reviewer,'Project验收人',true,'暂无')}${inputField('计划开始日期','start',project.start||db.today,'date',false,'required')}${inputField('计划完成日期','due',project.due||shiftDate(db.today,45),'date',false,'required')}<div class="field full"><label for="project-goal">目标与交付</label><textarea id="project-goal" name="goal">${escapeHtml(project.goal||'')}</textarea></div></div>`;}
function validateProjectData(data,project=null){const name=String(data.name||'').trim(),reviewers=project?.reviewers?.length>1?clone(project.reviewers):data.reviewer?[data.reviewer]:[];check(name,'请填写 Project 名称');check(validDate(data.start)&&validDate(data.due)&&data.due>=data.start,'Project日期无效');check(PEOPLE.includes(data.owner)&&reviewers.every(person=>PEOPLE.includes(person)),'请选择有效的Project负责人和Project验收人');return {name,goal:String(data.goal||'').trim(),owner:data.owner,start:data.start,due:data.due,reviewers};}
function newProjectModal(){if(!can('caseEdit'))return toast('没有新建权限');modal('新建 Project',projectForm()+`<section style="margin-top:20px"><h3>关联未归属 Case（可选）</h3>${unassignedCaseChoices()}</section>`,'创建Project',(data,form)=>handleOperation(()=>{const project=createProjectRecord(data,form?[...new FormData(form).getAll('caseIds')]:[]);db.selectedProject=project.id;navigationHistory.length=0;Object.assign(ui,{page:'overview',caseId:null,summaryQuery:'',summaryOwner:'',summaryStatus:'',summaryProjectIds:null});},'Project已创建'));}
function editProjectModal(){const project=selectedProject();if(!project)return toast('请先创建 Project');modal('编辑Project',projectForm(project),'保存Project',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');check(['active','returned'].includes(project.status),'待验收或已完成Project不能修改责任与计划');const values=validateProjectData(data,project),previous=project.owner,before=assignmentSnapshot(db,'project',project);if(values.owner!==previous)requireAssignmentTarget(db,CURRENT_USER,'project',project,values.owner);Object.assign(project,values);logEvent(db,project,'更新Project责任与有效计划日期');if(previous!==project.owner)recordAssignment(db,'project',project,CURRENT_USER,previous,'调整 Project 负责人','edit',before);},'Project设置已保存'));}
function permissionModal(){if(!can('settings'))return toast('没有设置权限');modal('分级权限配置',`<table><thead><tr><th>角色</th><th>查看范围</th><th>Case 编辑</th><th>模版配置</th><th>设置</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${escapeHtml(roleLabel(role))}</td><td><select name="${role}-view"><option value="assigned" ${policy.view==='assigned'?'selected':''}>参与对象</option><option value="all" ${policy.view==='all'?'selected':''}>全部范围</option></select></td>${['caseEdit','template','settings'].map(key=>`<td><input type="checkbox" aria-label="${role} ${key}" name="${role}-${key}" ${policy[key]?'checked':''} ${role==='leader'&&key==='settings'?'disabled':''}></td>`).join('')}</tr>`).join('')}</tbody></table><div class="note" style="margin-top:15px">当前演示会话按实际角色校验；只有设置权限人员可保存，生产授权需在服务端执行。可在下方检查指定人员对业务对象的可见性。</div><div class="fields" style="margin-top:15px">${peopleSelect('preview','王宇','权限范围预览')}<div class="field"><label>查看结果</label><button type="button" onclick="previewPermission(document.querySelector('[name=preview]').value)">检查当前权限</button></div></div><div id="permissionPreview" class="small muted" style="margin-top:12px"></div>`,'保存权限',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');for(const role of Object.keys(db.permissions)){db.permissions[role]={...db.permissions[role],view:data[role+'-view'],caseEdit:!!data[role+'-caseEdit'],template:!!data[role+'-template'],settings:role==='leader'||!!data[role+'-settings']};}logEvent(db,null,'更新角色权限配置');},'权限配置已保存'),true);}
function previewPermission(actor){const cases=db.cases.filter(item=>visibleTo(db,actor,'case',item)),tasks=db.tasks.filter(item=>visibleTo(db,actor,'task',item)),policy=db.permissions[db.userRoles[actor]];document.getElementById('permissionPreview').textContent=`${actor}：可查看 ${cases.length} 个 Case、${tasks.length} 项 Task；模版配置${policy.template?'允许':'不允许'}，Case 编辑${policy.caseEdit?'允许':'不允许'}。` ;}
function downloadPrototype(){const bundle=location.pathname.includes('/DH-WBS/WBS-main/')?'../../WBS-DH.zip':'WBS-DH.zip';modal('下载原型',`<div class="stack"><p>设备页复用独立 HTML 文件。离线使用时，两个 HTML 需放在同一目录；下载包已包含完整文件。</p><a href="${bundle}" download="WBS-DH.zip">${icon('download')} 下载完整原型包</a><a href="WBS-DH-prototype.html" download="WBS-DH-prototype.html">下载Project管理 HTML</a><a href="Equipment-WBS-prototype.html" download="Equipment-WBS-prototype.html">下载设备 WBS HTML</a><p class="small muted">下载不包含当前浏览器内的业务数据或上传文件。</p></div>`,'关闭',closeModal);}
function showHelp(){modal('原型演示说明',`<div class="stack"><p>这是可离线打开的桌面端原型。数据与上传文件保存在当前浏览器，不构成正式生产系统。</p><div class="notice">邮件与 Hems 仅生成模拟发送记录，不向外部系统实际发送。页面关闭时不会运行定时Task。</div><p class="small muted">当前为陈昊 / PM 演示视角。执行和验收弹窗会明确显示代办身份；生产系统需由服务端鉴权。</p><p class="small muted">演示采用保守规则：仅调整未开始 Task；下层全部验收后，负责人才能提交上层验收；退回后重新走本对象全部验收。以上为演示约定，详细规则待业务确认。</p><div class="row"><a href="Equipment-WBS-prototype.html" target="_blank">原设备 WBS 原型</a><span class="muted">·</span><button type="button" class="link danger" onclick="resetDemo()">恢复初始演示数据</button></div></div>`,'关闭',closeModal);}
function resetDemo(){modal('恢复初始演示数据','<p>仅清除新版Project管理原型的本地修改与上传文件。原设备 WBS 数据不受影响。</p>','确认恢复',()=>{try{db=createSeed();addSummaryDemoProjects(db);scanNotifications(db);persist();navigationHistory.length=0;Object.assign(ui,{page:'overview',summaryQuery:'',summaryOwner:'',summaryStatus:'',summaryExpanded:[],summaryProjectIds:null});closeDrawer();closeModal();render();toast('已恢复初始Case');}catch(error){toast(error.message);}});}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('modalRoot').innerHTML)closeModal();else closeDrawer();}if(event.key==='Tab'){const dialog=document.querySelector('.modal')||document.querySelector('.drawer');if(!dialog)return;const controls=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(node=>node.getClientRects().length);if(!controls.length)return;const first=controls[0],last=controls.at(-1);if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}}});
render();
setInterval(()=>{try{const count=transact(()=>scanNotifications(db,false)+runScheduledReports(db));if(count&&['notifications','reports'].includes(ui.page))render();}catch(error){storageNotice='自动检查无法保存，请检查浏览器存储。';}},60000);
</script>
</body>
</html>
