<style id="eaTheme">
:root {
  --ea-color-primary:#0052D9;
  --ea-color-primary-hover:#003FA8;
  --ea-color-primary-tint:rgba(0,82,217,.08);
  --ea-color-focus:rgba(0,82,217,.4);
  --ea-color-canvas:oklch(98.4% .003 247.858);
  --ea-color-divider:oklch(96.8% .007 247.896);
  --ea-color-border:oklch(92.9% .013 255.508);
  --ea-color-heading:oklch(20.8% .042 265.755);
  --ea-color-body:oklch(37.2% .044 257.287);
  --ea-color-label:oklch(44.6% .043 257.281);
  --ea-color-secondary:oklch(55.4% .046 257.417);
  --ea-color-input:oklch(98.4% .003 247.858 / .6);
  --ea-font-sans:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
  --ea-font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  --ea-shadow-card:0 1px 2px rgba(15,23,42,.04);
  --ea-shadow-hover:0 8px 24px -12px rgba(0,82,217,.25);
  --ea-shadow-dialog:0 24px 80px -20px rgba(15,23,42,.3);
  --bg:var(--ea-color-canvas);--surface:#fff;--line:var(--ea-color-border);
  --ink:var(--ea-color-heading);--muted:var(--ea-color-secondary);--nav:#fff;
  --blue:var(--ea-color-primary);--blue-soft:#EFF6FF;
  --green:#007A55;--green-soft:#ECFDF5;--amber:#BB4D00;--amber-soft:#FFFBEB;
  --red:#E7000B;--red-soft:#FEF2F2;--side:236px;
}
html{font-size:16px}
body{height:100dvh;overflow:hidden;font:14px/1.625 var(--ea-font-sans);color:var(--ea-color-body);background:linear-gradient(135deg,var(--bg),#fff,var(--bg));letter-spacing:0}
#app{height:100%;display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
button{min-height:36px;padding:0 16px;gap:6px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ea-color-body);transition:color 150ms,background-color 150ms,border-color 150ms}
button:hover:not(:disabled){background:var(--bg);border-color:var(--line)}

button.danger:hover:not(:disabled){background:var(--red-soft);border-color:var(--red)}
button:disabled{opacity:.4}
button.icon{width:32px;height:32px;min-height:32px;padding:0;border-color:transparent;color:var(--muted)}
button.link{min-height:24px;height:auto;padding:0;background:transparent;border:0;font-size:inherit}
button.link:hover:not(:disabled){background:transparent;color:var(--ea-color-primary-hover)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ea-color-focus);outline-offset:2px}
input,select,textarea{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--ea-color-input);color:var(--ea-color-body);font-size:13px;padding:0 12px;transition:border-color 150ms,background-color 150ms}
input:not([type=checkbox]):not([type=radio]),select{height:40px}
textarea{height:132px;min-height:96px;padding:12px;line-height:1.625;border-radius:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff}
input:disabled,select:disabled,textarea:disabled{color:var(--muted);cursor:not-allowed}
input[type=checkbox],input[type=radio]{accent-color:var(--blue)}
h1{font-size:24px;font-weight:500;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
h2{font-size:13px;font-weight:500;line-height:1.5;color:var(--ink)}
h3{font-size:15px;font-weight:500;line-height:1.375;color:var(--ink)}
svg{stroke-width:2}
.mono{font-family:var(--ea-font-mono);font-variant-numeric:tabular-nums}

<script>
'use strict';
const STORAGE_KEY = 'wbs-dh-project-v1';
const PEOPLE = ['陈昊','李敏','王宇','赵宁','周岚','刘洋'];
const CURRENT_USER = '陈昊';
const clone = value => JSON.parse(JSON.stringify(value));
const unique = values => [...new Set(values.filter(Boolean))];
const makeId = prefix => prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const dayNumber = date => Date.parse(date + 'T00:00:00Z') / 86400000;
const validDate = date => /^\d{4}-\d{2}-\d{2}$/.test(date || '') && Number.isFinite(dayNumber(date)) && new Date(dayNumber(date)*86400000).toISOString().slice(0,10) === date;
const shiftDate = (date, days) => new Date((dayNumber(date)+days)*86400000).toISOString().slice(0,10);
const elapsedDays = (start, end) => Math.max(0, dayNumber(end)-dayNumber(start));
const check = (value, message) => { if (!value) throw Error(message); };
function definition(id, name, duration, owner, reviewers, deps, evidence) {
  return {id,name,duration,owner,reviewers,deps,evidence};
}
function createSeed() {
  const procurement = [
    definition('s1','需求与技术规格确认',3,'王宇',['李敏'],[],'设备需求说明及技术规格清单'),
    definition('s2','设备采购与交付准备',8,'赵宁',['李敏','周岚'],['s1'],'采购确认文件与供应商交付计划'),
    definition('s3','场地、电力与接口准备',6,'王宇',['周岚'],['s1'],'现场检查清单及接口确认记录'),
    definition('s4','设备安装与调试',3,'赵宁',['李敏'],['s2','s3'],'安装调试报告'),
    definition('s5','使用验证与交付确认',2,'王宇',['李敏','周岚'],['s4'],'使用验证报告及交付清单')
  ];
  const program = [
    definition('s1','测试需求确认',2,'王宇',['李敏'],[],'测试需求与覆盖范围'),
    definition('s2','程序开发',6,'王宇',['李敏'],['s1'],'程序版本与开发说明'),
    definition('s3','测试用例准备',4,'赵宁',['周岚'],['s1'],'测试用例清单'),
    definition('s4','集成验证',3,'王宇',['李敏','周岚'],['s2','s3'],'验证结果及问题关闭记录')
  ];
  const product = [
    definition('s1','研发目标确认',2,'李敏',['周岚'],[],'目标及验收标准'),
    definition('s2','方案设计',4,'王宇',['李敏','周岚'],['s1'],'设计方案及评审材料'),
    definition('s3','工程验证',3,'赵宁',['李敏'],['s2'],'工程验证报告')
  ];
  const state = {
    schema:1,today:'2026-09-14',selectedProject:'p1',categories:[{id:'cat1',name:'设备采购'},{id:'cat2',name:'程序开发'},{id:'cat3',name:'产品研发'}],
    templates:[{id:'tpl1',category:'cat1',name:'设备采购标准流程',versions:[{version:1,date:'2026-09-01',tasks:procurement}]},{id:'tpl2',category:'cat2',name:'测试程序开发流程',versions:[{version:1,date:'2026-09-01',tasks:program}]},{id:'tpl3',category:'cat3',name:'产品研发标准流程',versions:[{version:1,date:'2026-09-01',tasks:product}]}],
    projects:[{id:'p1',name:'研发实验室建设',goal:'完成测试环境、设备与研发能力建设，支撑试产验证。',owner:'陈昊',reviewers:['刘洋'],start:'2026-09-01',due:'2026-10-15',status:'active',approval:0,round:0,history:[],oversight:'周岚'}],
    cases:[],tasks:[],events:[],messages:[],reports:[],lastReportDate:'2026-09-07',
    notification:{lead:3,near:1,second:3,third:7,wait:2,scanHour:9,retries:3},
    reportSchedule:{enabled:true,period:'week',next:'2026-09-21'},
    permissions:{leader:{view:'all',caseEdit:true,template:true,settings:true},member:{view:'assigned',caseEdit:false,template:false,settings:false},reviewer:{view:'assigned',caseEdit:false,template:false,settings:false}},
    userRoles:{'陈昊':'leader','李敏':'reviewer','王宇':'member','赵宁':'member','周岚':'reviewer','刘洋':'reviewer'}
  };
  const caseSpecs = [
    ['c1','测试设备采购与交付','tpl1','2026-09-03','2026-09-23','李敏','周岚'],
    ['c2','晶圆测试程序开发','tpl2','2026-09-10','2026-09-28','王宇','李敏'],
    ['c3','可靠性验证设备采购','tpl1','2026-09-01','2026-09-30','赵宁','李敏'],
    ['c4','测量模块研发','tpl3','2026-09-01','2026-09-14','李敏','周岚']
  ];
  for (const [id,name,templateId,start,due,owner,reviewer] of caseSpecs) {
    const instance = instantiate(state,{id,name,templateId,start,due,owner,reviewers:[reviewer],project:'p1',goal:'完成' + name + '并形成独立交付。'},false);
    for (const task of caseTasks(state,instance.id)) {
      if (task.sourceId==='s1' || instance.id==='c4') seedComplete(task,task.due);
    }
  }
  const first = caseTasks(state,'c1');
  const reviewTask = first.find(task=>task.sourceId==='s2');
  reviewTask.status='review'; reviewTask.submittedAt='2026-09-11'; reviewTask.startedAt='2026-09-06'; reviewTask.round=1;
  reviewTask.files=[sampleEvidence('供应商交付计划.txt','设备交付计划：2026-09-16 完成交付准备。')];
  reviewTask.history.push({at:'2026-09-11',actor:reviewTask.owner,text:'提交验收',round:1,files:clone(reviewTask.files)});
  first.find(task=>task.sourceId==='s3').status='active';
  first.find(task=>task.sourceId==='s3').startedAt='2026-09-06';
  for (const task of caseTasks(state,'c2')) if (['s2','s3'].includes(task.sourceId)) {task.status='active';task.startedAt='2026-09-12';}
  const late = caseTasks(state,'c3').find(task=>task.sourceId==='s2');late.status='returned';late.due='2026-09-07';late.startedAt='2026-09-04';late.round=1;late.files=[sampleEvidence('采购需求.txt','待补充供应商确认文件。')];late.history.push({at:'2026-09-10',actor:'李敏',text:'退回：请补充供应商确认日期。',round:1});
  const prepared = state.cases.find(item=>item.id==='c4');prepared.status='review';prepared.round=1;prepared.submittedAt='2026-09-12';prepared.history.push({at:'2026-09-12',actor:prepared.owner,text:'提交 Case 整体验收'});
  refreshReady(state);
  state.events.push({id:'seed-event',at:'2026-09-12',actor:'李敏',object:'c4',text:'测量模块研发已提交 Case 整体验收。'});
  return state;
}
function sampleEvidence(name,text) { return {id:makeId('file'),name,size:text.length,type:'text/plain',data:'data:text/plain;charset=utf-8,'+encodeURIComponent(text),sample:true}; }
function seedComplete(task,date) {
  task.status='done';task.approval=task.reviewers.length;task.completedAt=date;task.startedAt=task.start;task.round=1;task.files=[sampleEvidence('交付记录.txt',task.name+'：演示交付记录。')];
  task.history.push({at:date,actor:task.reviewers.at(-1),text:'全部验收通过（初始示例）',round:1,files:clone(task.files)});
}
const findCase = (state,id) => state.cases.find(item=>item.id===id);
const findProject = (state,id) => state.projects.find(item=>item.id===id);
const caseTasks = (state,id) => state.tasks.filter(task=>task.caseId===id);
const taskCase = (state,task) => findCase(state,task.caseId);
const latestVersion = template => template.versions.at(-1);
function objectRef(state,kind,id) {return ({task:state.tasks,case:state.cases,project:state.projects})[kind]?.find(item=>item.id===id);}
function projectOf(state,kind,item) {return kind==='project'?item:findProject(state,kind==='case'?item.project:taskCase(state,item).project);}
function visibleTo(state,actor,kind,item) {
  const policy = state.permissions[state.userRoles[actor]];

function instantiate(state,values,audit=true) {

function refreshReady(state) {

function currentHandler(item){return item.status==='review'?item.reviewers[item.approval]:item.owner;}

function reviewObject(state,kind,id,actor,pass,note) {
  const item=objectRef(state,kind,id);check(item&&item.status==='review','当前对象不在待验收状态');check(currentHandler(item)===actor,'只有当前环节验收人可以处理');

function notificationLevel(today,due,config) {

  if(distance>=config.second)return {level:2,title:'二级超期报警',days:distance};
  if(distance>=1)return {level:1,title:'一级超期报警',days:distance};

function notificationConfig(state,kind,item){return projectOf(state,kind,item).notification||state.notification;}
function scanNotifications(state,manual=true) {

function pageHead(title,context,actions=''){return `<div class="page-head between"><div class="page-heading">${ui.page==='overview'?'':`<button type="button" class="icon back-button" title="${backLabel()}" aria-label="${backLabel()}" onclick="goBack()">${icon('arrow')}</button>`}<div>${context?`<div class="eyebrow">${context}</div>`:''}<h1>${title}</h1></div></div><div class="row">${actions}</div></div>`;}
function navTo(page){if(page==='overview')navigationHistory.length=0;else if(page!==ui.page)rememberPage();ui.page=page;if(page==='reports')ui.reportId='';if(page==='reviews')ui.reviewKind='';if(page==='gantt'){ui.taskView='list';ui.taskOverdue=false;}ui.query='';ui.category='';ui.filter='';closeDrawer();closeModal();render();}
function openCase(id){const instance=findCase(db,id);if(!instance||!visibleTo(db,CURRENT_USER,'case',instance))return toast('无权查看此 Case');if(instance.project!==db.selectedProject)navigationHistory.length=0;else if(ui.page!=='case'||ui.caseId!==id)rememberPage();db.selectedProject=instance.project;ui.caseId=id;ui.page='case';closeDrawer();render();}
function openCaseTimeline(id){const instance=findCase(db,id);if(!instance||!visibleTo(db,CURRENT_USER,'case',instance))return toast('无权查看此 Case');navTo('gantt');ui.taskView='gantt';ui.filter=id;render();}
function returnToCaseList(){
  const index=navigationHistory.findLastIndex(entry=>entry.state.page==='cases');
  if(index>=0){navigationHistory.length=index+1;goBack();return;}
  closeDrawer();closeModal();Object.assign(ui,{page:'cases',caseId:null,query:'',category:'',filter:''});render();
}
function switchProject(value){navigationHistory.length=0;db.selectedProject=value;ui.page='overview';ui.caseId=null;ui.reportId='';ui.query='';ui.category='';closeDrawer();try{persist();}catch{}render();}
function equipmentPage(){return '<iframe id="equipmentFrame" class="equipment-frame" title="设备 WBS · 独立设备总表" src="Equipment-WBS-prototype.html#embedded-wbs"></iframe>';}
function navigationContext(){if(ui.page==='equipment')return '<span class="muted small">研发资源</span><strong>独立设备总表</strong>';return `<span class="muted small">Project</span><select aria-label="当前项目" onchange="switchProject(this.value)">${db.projects.filter(item=>visibleTo(db,CURRENT_USER,'project',item)).map(item=>`<option value="${item.id}" ${item.id===selectedProject().id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`;}
function toggleSidebar(){ui.collapsed=!ui.collapsed;if(ui.page!=='equipment')return render();document.body.classList.toggle('sidebar-collapsed',ui.collapsed);const button=document.querySelector('.side-footer button');const label=(ui.collapsed?'展开':'收起')+'侧边栏';button.title=label;button.setAttribute('aria-label',label);}
function handleEquipmentMessage(event){const frame=document.getElementById('equipmentFrame');if(!frame||event.source!==frame.contentWindow||ui.page!=='equipment')return;if(event.data?.type==='wbs-equipment:overview')navTo('overview');else if(event.data?.type==='wbs-equipment:fullscreen'&&typeof event.data.active==='boolean')document.body.classList.toggle('equipment-fullscreen',event.data.active);}
if(typeof window!=='undefined'){
  window.addEventListener('message',handleEquipmentMessage);
  window.addEventListener('keydown',event=>{if(event.key==='Escape'&&ui.page==='equipment'){document.body.classList.remove('equipment-fullscreen');document.getElementById('equipmentFrame')?.contentWindow.postMessage({type:'wbs-equipment:exit-fullscreen'},'*');}});
}
function render(){
  const menus=[['overview','grid','项目总览'],['cases','folder','Case 列表'],['gantt','task','Task管理'],['equipment','template','设备 WBS'],['work','task','我的工作'],['templates','template','Category模版'],['reports','chart','统计报表'],['settings','settings','项目设置']];
  const unread=db.messages.filter(message=>message.project===selectedProject().id&&!message.read&&message.recipient===CURRENT_USER).length;
  document.body.classList.toggle('sidebar-collapsed',ui.collapsed);
  if(ui.page!=='equipment')document.body.classList.remove('equipment-fullscreen');
  document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><span class="brand-symbol">${icon('grid')}</span><span class="brand-label">WBS-DH</span></div><div class="nav-label">项目协同管理</div><nav class="nav">${menus.map(([key,symbol,label])=>`<button class="${ui.page===key||(key==='cases'&&ui.page==='case')||(key==='overview'&&ui.page==='reviews')?'active':''}" title="${label}" aria-label="${label}" onclick="navTo('${key}')">${icon(symbol)}<span class="nav-text">${label}</span>${key==='notifications'&&unread?`<span class="count">${unread}</span>`:''}</button>`).join('')}</nav><div class="side-footer"><div class="small">研发中心 · 建设项目</div><button onclick="toggleSidebar()" title="${ui.collapsed?'展开':'收起'}侧边栏" aria-label="${ui.collapsed?'展开':'收起'}侧边栏">${icon('collapse')}<span class="nav-text">收起侧边栏</span></button></div></aside><header class="topbar">${navigationContext()}<span class="spacer"></span>${ui.page==='equipment'?'':`<span class="small muted mono">业务日期 ${db.today}</span>`}<span class="demo-mark">本地演示</span><button class="icon" title="演示说明" aria-label="演示说明" onclick="showHelp()">${icon('help')}</button><span style="height:24px;border-left:1px solid var(--line)"></span><span class="avatar">陈</span><span class="small">陈昊 · Leader</span></header><main class="main ${ui.page==='equipment'?'equipment-main':''}">${storageNotice?`<div class="notice">${escapeHtml(storageNotice)}</div>`:''}${({overview:overviewPage,reviews:projectReviewsPage,cases:casesPage,case:casePage,equipment:equipmentPage,gantt:ganttPage,work:workPage,templates:templatesPage,reports:reportsPage,notifications:notificationsPage,settings:settingsPage})[ui.page]()}${ui.page==='equipment'?'':'<div class="footer-note">WBS-DH · Project / Case / Task</div>'}</main>`;
}
function projectOverviewStatus(project){
  const label=({active:'进行中',returned:'待修改',review:'待项目验收',done:'项目已验收'})[project.status]||'进行中';
  const canSubmit=['active','returned'].includes(project.status)&&project.owner===CURRENT_USER&&readyForAcceptance(db,'project',project);
  return `<div class="summary-line between wrap" id="projectStatus"><span>项目计划 ${project.start} 至 ${project.due}</span><div class="row wrap"><span>项目状态</span><span class="pill ${project.status}">${label}</span>${project.status==='review'?`<span>当前验收人 ${escapeHtml(currentHandler(project)||'未指定')}</span>`:''}${canSubmit?`<button class="primary" onclick="parentSubmitModal('project','${project.id}')">${icon('check')} 提交项目验收</button>`:''}${project.status==='done'?`<button class="link" onclick="openObject('project','${project.id}')">查看验收记录</button>`:''}</div></div>`;
}
function projectReviewEntries(){
  const project=selectedProject();
  return [...projectTasks().filter(item=>item.status==='review').map(item=>({kind:'task',item})),...projectCases().filter(item=>item.status==='review').map(item=>({kind:'case',item})),...(project.status==='review'&&visibleTo(db,CURRENT_USER,'project',project)?[{kind:'project',item:project}]:[])];
}
function setReviewKind(value){if(!['','case','task'].includes(value))return;ui.reviewKind=value;render();}
function projectReviewsPage(){
  const reviews=projectReviewEntries().filter(entry=>!ui.reviewKind||entry.kind===ui.reviewKind);
  return `<div class="review-list-page">${pageHead('待验收列表','')}<section class="panel"><div class="toolbar"><select aria-label="验收类型筛选" onchange="setReviewKind(this.value)">${[['','全部类型'],['case','Case'],['task','Task']].map(([value,label])=>`<option value="${value}" ${ui.reviewKind===value?'selected':''}>${label}</option>`).join('')}</select></div>${reviews.length?`<div class="table-scroll"><table id="projectReviewTable"><colgroup><col><col><col><col></colgroup><thead><tr><th>验收对象</th><th>验收类型</th><th>当前验收人</th><th>计划完成</th></tr></thead><tbody>${reviews.map(({kind,item})=>`<tr data-review-kind="${kind}" data-review-id="${item.id}"><td class="title-cell"><button class="link" onclick="openObject('${kind}','${item.id}')">${escapeHtml(item.name)}</button></td><td>${kindLabels[kind]}</td><td>${escapeHtml(currentHandler(item))}${kind==='task'?`<div class="subline">第 ${item.approval+1} / ${item.reviewers.length} 级</div>`:''}</td><td>${dateCell(item)}</td></tr>`).join('')}</tbody></table></div>`:empty('暂无待验收事项')}<div class="summary-line">${reviews.length} 项待验收</div></section></div>`;
}
function overviewPage(){
  const project=selectedProject(),cases=projectCases(),tasks=projectTasks(),stats=counts(tasks),lateTasks=tasks.filter(late);
  const reviews=projectReviewEntries();
  return pageHead(project.name,'',`<button onclick="openObject('project','${project.id}')">${icon('eye')} Project 详情</button>`)+`<div class="metrics"><button class="metric" onclick="navTo('cases')"><div class="muted">Case 总数</div><div class="number">${cases.length}<small>个</small></div><div class="caption">${cases.filter(item=>item.status==='done').length} 个已完成本层验收</div></button><button class="metric" onclick="navTo('gantt')"><div class="muted">Task 总数</div><div class="number">${stats.total}<small>项</small></div><div class="caption">已验收 ${stats.done} 项</div></button><button class="metric" onclick="navTo('reviews')"><div class="muted">待验收</div><div class="number">${reviews.length}<small>项</small></div><div class="caption">Task ${reviews.filter(entry=>entry.kind==='task').length} · Case ${reviews.filter(entry=>entry.kind==='case').length} · Project ${reviews.filter(entry=>entry.kind==='project').length}</div></button><button class="metric" onclick="openOverdueTasks()"><div class="muted">超期 Task</div><div class="number${lateTasks.length?' bad':''}">${lateTasks.length}<small>项</small></div><div class="caption">超过计划完成日期且尚未完成</div></button></div>
  <div class="overview-grid">
    <section class="panel overview-cases"><div class="panel-head between"><h2>Case推进情况</h2><button class="link small" onclick="navTo('cases')">全部 Case ${icon('arrow')}</button></div>${caseTable(cases)}${projectOverviewStatus(project)}</section>
    <section class="panel overview-category"><div class="panel-head"><h2>按 Category 看工作</h2></div><div class="overview-panel-body">${db.categories.map(category=>{const list=cases.filter(item=>item.category===category.id),related=tasks.filter(task=>list.some(instance=>instance.id===task.caseId));return `<div class="distribution"><div class="between"><button class="link" onclick="navTo('cases');ui.category='${category.id}';render()">${escapeHtml(category.name)}</button><span class="small muted">${list.length} 个 Case</span></div><div class="between" style="margin-top:8px"><span class="small muted">${related.length} 项 Task</span><span class="small">${related.filter(task=>task.status==='done').length} 已验收</span></div><div class="color-line"><span style="width:${related.length?related.filter(task=>task.status==='done').length/related.length*100:0}%"></span></div></div>`}).join('')}</div></section>
    <section class="panel overview-history"><div class="panel-head between"><h2>近期处理记录</h2>${icon('clock')}</div><div class="panel-body overview-panel-body">${historyHtml(db.events.slice(0,4))}</div></section>
  </div>`;
}
function filteredCases(){return projectCases().filter(item=>(!ui.category||item.category===ui.category)&&(!ui.query||[item.name,item.owner,item.goal].join(' ').toLowerCase().includes(ui.query.toLowerCase()))&&(!ui.filter||(ui.filter==='overdue'?late(item)||caseTasks(db,item.id).some(late):item.status===ui.filter)));}
function caseTable(items){return items.length?`<div class="table-scroll"><table><thead><tr><th>Case名称</th><th>Category</th><th>负责人</th><th>Task 进展</th><th>本层状态</th><th>计划完成</th></tr></thead><tbody>${items.map(item=>`<tr><td class="title-cell"><button class="link" onclick="openCase('${item.id}')">${escapeHtml(item.name)}</button><div class="subline">模板 v${item.templateVersion}</div></td><td>${escapeHtml(categoryName(item.category))}</td><td>${escapeHtml(item.owner)}</td><td>${progress(caseTasks(db,item.id))}</td><td>${badge(item)}</td><td>${dateCell(item)}</td></tr>`).join('')}</tbody></table></div>`:empty('没有符合条件的 Case');}
function categoriesSelect(){return `<select aria-label="Category 筛选" onchange="ui.category=this.value;render()"><option value="">全部 Category</option>${db.categories.map(category=>`<option value="${category.id}" ${ui.category===category.id?'selected':''}>${escapeHtml(category.name)}</option>`).join('')}</select>`;}
function searchInput(label){return `<input class="search" id="mainSearch" placeholder="${label}" aria-label="${label}" value="${escapeHtml(ui.query)}" oninput="updateSearch(this)">`;}
function updateSearch(input){const position=input.selectionStart;ui.query=input.value;render();const replacement=document.getElementById('mainSearch');replacement?.focus();replacement?.setSelectionRange(position,position);}
function casesPage(){const cases=filteredCases();return pageHead('Case 列表','',`<button class="primary" ${can('caseEdit')?'':'disabled'} onclick="newCaseModal()">${icon('plus')} 新建 Case</button>`)+`<section class="panel"><div class="toolbar">${searchInput('搜索 Case、负责人…')}${categoriesSelect()}<select aria-label="Case 状态筛选" onchange="ui.filter=this.value;render()"><option value="">全部状态</option>${[['active','执行中'],['review','待验收'],['done','已验收完成'],['overdue','包含超期工作']].map(([value,label])=>`<option value="${value}" ${ui.filter===value?'selected':''}>${label}</option>`).join('')}</select></div>${caseTable(cases)}<div class="summary-line">${cases.length} 个 Case</div></section>`;}
function caseAcceptanceStrip(instance,tasks){
  const canSubmit=['active','returned'].includes(instance.status)&&readyForAcceptance(db,'case',instance);
  const label=instance.status==='review'?'查看验收':instance.status==='done'?'查看验收记录':'查看验收与记录';
  const action=canSubmit?`<button class="primary" onclick="parentSubmitModal('case','${instance.id}')">${icon('check')} ${instance.status==='returned'?'重新提交验收':'提交 Case 验收'}</button>`:`<button class="link small" onclick="openObject('case','${instance.id}')">${label} ${icon('arrow')}</button>`;
  return `<div class="accept-strip" id="caseAcceptance">${badge(instance)}<span class="small muted">Case 整体验收</span>${instance.status==='review'?`<span class="small">当前验收人 ${escapeHtml(currentHandler(instance)||'未指定')}</span>`:''}<span class="spacer"></span>${progress(tasks)}${action}</div>`;
}
function casePage(){const instance=findCase(db,ui.caseId);if(!instance)return empty('Case 不存在');const tasks=caseTasks(db,instance.id);return pageHead(escapeHtml(instance.name),'',`<button onclick="openCaseTimeline('${instance.id}')">${icon('gantt')} 时间轴</button>`)+`<div class="panel"><div class="panel-body"><p>${escapeHtml(instance.goal)}</p><div class="inline-meta"><span>负责人<strong>${escapeHtml(instance.owner)}</strong></span><span>验收人<strong>${escapeHtml(instance.reviewers.join(' → '))}</strong></span><span>计划<strong>${instance.start} 至 ${instance.due}</strong></span><span>模板<strong>v${instance.templateVersion} · 创建时版本</strong></span></div></div>${caseAcceptanceStrip(instance,tasks)}</div><section class="panel"><div class="panel-head between"><h2>分段 Task</h2><span class="small muted">${tasks.length} 项 · ${tasks.filter(task=>task.status==='review').length} 项待验收</span></div>${taskTable(tasks,true)}<div class="summary-line">${tasks.filter(task=>task.status==='blocked').length} 项等待前置 · ${tasks.filter(task=>task.status==='ready').length} 项可执行 · ${tasks.filter(task=>task.status==='active').length} 项执行中</div></section><details class="panel"><summary class="panel-head">Case 修改记录</summary><div class="panel-body">${historyHtml(instance.history)}</div></details>`;}
function taskTable(tasks,editing=false){return tasks.length?`<div class="table-scroll"><table class="task-list"><thead><tr><th>Task 名称</th><th>执行人</th><th>状态</th><th>计划开始日期</th><th>计划完成日期</th><th>当前验收人</th><th>前置任务</th>${editing?'<th>操作</th>':''}</tr></thead><tbody>${tasks.map((task,index)=>`<tr data-task-id="${task.id}"><td class="title-cell"><button class="link" onclick="openObject('task','${task.id}')">${index+1}. ${escapeHtml(task.name)}</button><div class="subline">${task.duration} 天 · ${escapeHtml(task.evidence)}</div></td><td>${escapeHtml(task.owner)}</td><td>${badge(task)}</td><td><span class="mono">${escapeHtml(task.start||'待确定')}</span></td><td>${dateCell(task)}</td><td>${task.status==='review'?escapeHtml(currentHandler(task)||'未指定'):'—'}</td><td style="max-width:175px"><span class="small muted">${task.deps.map(id=>escapeHtml(objectRef(db,'task',id)?.name)).join('、')||'无'}</span></td>${editing?`<td>${['ready','blocked'].includes(task.status)&&can('caseEdit')?`<button class="link small" onclick="editTaskModal('${task.id}')">调整</button>`:''}</td>`:''}</tr>`).join('')}</tbody></table></div>`:empty('暂无任务');}
function myWorkEntries(){return (ui.workTab==='review'?projectReviewEntries():projectTasks().filter(item=>['ready','active','returned'].includes(item.status)).map(item=>({kind:'task',item}))).filter(({item})=>currentHandler(item)===CURRENT_USER);}
function workPage(){const entries=myWorkEntries();return pageHead('我的工作','')+`<section class="panel"><div class="tabs"><button class="${ui.workTab==='review'?'active':''}" onclick="ui.workTab='review';render()">待验收</button><button class="${ui.workTab==='execute'?'active':''}" onclick="ui.workTab='execute';render()">待执行</button></div>${entries.length?`<div class="table-scroll"><table><thead><tr><th>工作事项</th><th>层次</th><th>当前处理人</th><th>状态</th><th>计划完成</th><th></th></tr></thead><tbody>${entries.map(({kind,item})=>`<tr><td class="title-cell"><button class="link" onclick="openObject('${kind}','${item.id}')">${escapeHtml(item.name)}</button>${kind==='task'?`<div class="subline">${escapeHtml(taskCase(db,item).name)}</div>`:''}</td><td><span class="tag">${kindLabels[kind]}</span></td><td>${escapeHtml(currentHandler(item))}</td><td>${badge(item)}</td><td>${dateCell(item)}</td><td><button onclick="openObject('${kind}','${item.id}')">查看 ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>`:empty(ui.workTab==='review'?'暂无待我验收的事项':'暂无待我执行的任务')}</section>`;}
function historyHtml(history){return history.length?history.map(record=>`<div class="history-item"><small>${escapeHtml(record.at)} · ${escapeHtml(record.actor||'系统')}${record.round?' · 第 '+record.round+' 次提交':''}</small>${escapeHtml(record.text)}${record.files?.length?`<div class="small muted">Evidence：${record.files.map(file=>escapeHtml(file.name)).join('、')}</div>`:''}</div>`).join(''):'<span class="small muted">暂无记录</span>';}
let drawerReturnFocus=null;
function openObject(kind,id){const item=objectRef(db,kind,id);if(!item||!visibleTo(db,CURRENT_USER,kind,item))return toast('无权查看此对象');if(!ui.drawer)drawerReturnFocus=document.activeElement;ui.drawer={kind,id};renderDrawer();setTimeout(()=>document.querySelector('.drawer .icon')?.focus(),0);}
function closeDrawer(){ui.drawer=null;document.getElementById('drawerRoot').innerHTML='';drawerReturnFocus?.isConnected&&drawerReturnFocus.focus({preventScroll:true});drawerReturnFocus=null;}
function taskDetailSections(task,instance){
  return `<section class="section task-detail-section"><h2>基础信息</h2><dl class="detail-grid">
    <div class="detail-wide"><dt>所属 Case</dt><dd>${escapeHtml(instance?.name||'Case 不存在')}</dd></div>
    <div><dt>执行人</dt><dd>${escapeHtml(task.owner)}</dd></div><div><dt>当前验收人</dt><dd>${task.status==='review'?escapeHtml(currentHandler(task)||'未指定'):'—'}</dd></div>
    <div><dt>计划开始日期</dt><dd>${escapeHtml(task.start||'待确定')}</dd></div><div><dt>计划完成日期</dt><dd>${escapeHtml(task.due||'待确定')}</dd></div>
    <div><dt>Category</dt><dd>${escapeHtml(categoryName(instance?.category))}</dd></div><div><dt>模板版本</dt><dd>${instance?'v'+escapeHtml(instance.templateVersion):'未记录'}</dd></div>
  </dl></section>
  <section class="section task-detail-section"><h2>工作要求</h2><dl class="detail-grid"><div><dt>计划工期</dt><dd>${task.duration==null?'未记录':escapeHtml(task.duration)+' 天'}</dd></div><div class="detail-wide"><dt>Evidence 要求</dt><dd>${escapeHtml(task.evidence||'未填写')}</dd></div></dl></section>
  <section class="section task-detail-section"><h2>前置任务</h2>${task.deps.length?task.deps.map(dependency=>{const prerequisite=objectRef(db,'task',dependency);return `<div class="task-dependency"><span>${escapeHtml(prerequisite?.name||'任务不存在')}</span>${prerequisite?badge(prerequisite):'<span class="small muted">状态未知</span>'}</div>`;}).join(''):'<span class="small muted">无</span>'}</section>`;
}
function renderDrawer(){if(!ui.drawer)return;const {kind,id}=ui.drawer,item=objectRef(db,kind,id);if(!item)return closeDrawer();const instance=kind==='task'?taskCase(db,item):kind==='case'?item:null;let actions='';
  if(kind==='task'&&item.status==='ready')actions=`<button class="primary" onclick="startTaskModal('${id}')">${icon('play')} 开始任务</button>`;
  if(kind==='task'&&['active','returned'].includes(item.status))actions=`<button class="primary" onclick="submitTaskModal('${id}')">${icon('file')} ${item.status==='returned'?'修改后重提':'上传并提交验收'}</button>`;
  if(kind==='case'&&['active','returned'].includes(item.status))actions=`<button class="primary" ${readyForAcceptance(db,kind,item)?'':'disabled'} onclick="parentSubmitModal('${kind}','${id}')">提交子项目验收</button>`;
  if(kind==='project'&&['active','returned'].includes(item.status)&&item.owner===CURRENT_USER&&readyForAcceptance(db,kind,item))actions=`<button class="primary" onclick="parentSubmitModal('project','${id}')">提交项目验收</button>`;
  if(item.status==='review')actions=`<button class="danger" onclick="reviewModal('${kind}','${id}',false)">退回修改</button><button class="primary" onclick="reviewModal('${kind}','${id}',true)">${icon('check')} 验收通过</button>`;
  if(kind==='project'&&item.status==='review')actions=currentHandler(item)!==CURRENT_USER?'':ui.page==='work'?actions:`<button onclick="navTo('work');ui.workTab='review';render()">前往我的工作</button>`;
  if(kind==='task'&&['ready','blocked'].includes(item.status)&&can('caseEdit'))actions=`<button onclick="editTaskModal('${id}')">调整</button>`+actions;
  const closeButton=`<button class="icon" aria-label="关闭详情" onclick="closeDrawer()">${icon('close')}</button>`;
  const heading=`<div class="between project-drawer-heading"><h1>${escapeHtml(item.name)}</h1>${closeButton}</div>`;
  const details=kind==='task'?taskDetailSections(item,instance):`<section class="section"><h2>目标与交付</h2><p>${escapeHtml(item.evidence||item.goal)}</p><dl class="detail-grid"><div><dt>负责人</dt><dd>${escapeHtml(item.owner)}</dd></div><div><dt>计划周期</dt><dd>${item.start||'待确定'} 至 ${item.due||'待确定'}</dd></div>${instance?`<div><dt>Category</dt><dd>${escapeHtml(categoryName(instance.category))}</dd></div><div><dt>模板版本</dt><dd>v${instance.templateVersion}</dd></div>`:''}</dl></section>`;
  document.getElementById('drawerRoot').innerHTML=`<div class="drawer-mask" onclick="closeDrawer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${kindLabels[kind]} 详情"><div class="drawer-head">${heading}<div class="row" style="margin-top:12px">${badge(item)}${late(item)?`<span class="pill overdue">超期 ${elapsedDays(item.due,db.today)} 天</span>`:''}</div></div><div class="drawer-body">${details}<section class="section"><h2>${kindLabels[kind]} 验收安排</h2><div class="task-flow">${item.reviewers.map((person,index)=>`${index?icon('chevron'):''}<span class="level-node ${index<item.approval?'passed':item.status==='review'&&index===item.approval?'current':''}">${index+1}. ${escapeHtml(person)} ${index<item.approval?'已通过':''}</span>`).join('')}</div>${kind!=='task'?`<div class="note" style="margin-top:16px">${kind==='case'?'子项目整体交付验收':'项目整体建设成果验收'}。下层全部验收完成后，由负责人单独提交；下层完成不会自动通过本层验收。</div>`:''}${kind==='task'&&item.status==='blocked'?`<p class="small muted" style="margin-top:12px">等待 ${item.deps.filter(dependency=>objectRef(db,'task',dependency)?.status!=='done').map(dependency=>escapeHtml(objectRef(db,'task',dependency)?.name)).join('、')} 完成验收。</p>`:''}</section>${kind==='task'?`<section class="section"><div class="between"><h2>Evidence</h2><span class="small muted">${item.files.length} 份</span></div>${item.files.length?item.files.map((file,index)=>`<div class="file-row">${icon('file')}<div class="spacer"><div>${escapeHtml(file.name)}</div><span class="small muted">${file.sample?'演示材料 · ':''}${Math.ceil(file.size/1024)||1} KB</span></div><button class="icon" title="下载 ${escapeHtml(file.name)}" aria-label="下载 Evidence" onclick="downloadEvidence('${id}',${index})">${icon('download')}</button></div>`).join(''):'<span class="small muted">尚未上传交付物</span>'}</section>`:`<section class="section"><h2>下层交付情况</h2>${kind==='case'?progress(caseTasks(db,item.id)):`<p>${db.cases.filter(child=>child.project===id&&child.status==='done').length} / ${db.cases.filter(child=>child.project===id).length} 个 Case 已验收</p>`}</section>`}<section class="section"><h2>${kind==='task'?'处理记录':'提交与验收记录'}</h2>${historyHtml(item.history)}</section></div>${actions?`<div class="drawer-foot">${actions}</div>`:''}</aside>`;
}
function modal(title,body,submitLabel,handler,wide=false){modalReturnFocus=document.activeElement;document.getElementById('modalRoot').innerHTML=`<div class="modal-mask"><section class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><form id="dialogForm"><div class="modal-head between"><h2>${escapeHtml(title)}</h2><button class="icon" type="button" aria-label="关闭弹窗" onclick="closeModal()">${icon('close')}</button></div><div class="modal-body">${body}<div class="error" id="modalError" role="alert"></div></div><div class="modal-foot"><button type="button" onclick="closeModal()">取消</button><button class="primary" type="submit">${escapeHtml(submitLabel)}</button></div></form></section></div>`;document.getElementById('dialogForm').onsubmit=async event=>{event.preventDefault();const form=event.target,button=form.querySelector('[type=submit]');button.disabled=true;try{await handler(Object.fromEntries(new FormData(form)),form);}catch(error){const target=document.getElementById('modalError');if(target)target.textContent=error.message;}finally{button.disabled=false;}};setTimeout(()=>document.querySelector('#dialogForm input,#dialogForm select,#dialogForm textarea,#dialogForm button')?.focus(),0);}
function closeModal(){document.getElementById('modalRoot').innerHTML='';modalReturnFocus?.isConnected&&modalReturnFocus.focus();}
function inputField(label,name,value='',type='text',full=false,attrs=''){return `<div class="field ${full?'full':''}"><label for="field-${name}">${label}</label><input id="field-${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${attrs}></div>`;}
function peopleSelect(name,value,label,optional=false){return `<div class="field"><label for="field-${name}">${label}</label><select id="field-${name}" name="${name}">${optional?'<option value="">无</option>':''}${PEOPLE.map(person=>`<option ${value===person?'selected':''}>${person}</option>`).join('')}</select></div>`;}
function simulationNote(actor,action){return `<div class="notice" style="margin-bottom:18px">模拟操作身份：<strong>${escapeHtml(actor)}</strong> · ${action}。当前为 Leader 演示代办，不代表真实登录鉴权。</div>`;}
function newCaseModal(){if(!can('caseEdit'))return toast('没有新建权限');modal('新建 Case',`<div class="fields"><div class="field full"><label for="field-templateId">Category / 流程模板</label><select id="field-templateId" name="templateId" onchange="previewCaseTemplate(this.value)">${db.templates.map(template=>`<option value="${template.id}">${escapeHtml(categoryName(template.category))} · ${escapeHtml(template.name)} · v${latestVersion(template).version}</option>`).join('')}</select></div>${inputField('Case 名称','name','','text',true,'required maxlength="80"')}<div class="field full"><label for="field-goal">目标与交付要求</label><textarea id="field-goal" name="goal" required></textarea></div>${peopleSelect('owner','李敏','Case 负责人')}${peopleSelect('reviewer','周岚','Case 验收人')}${inputField('计划开始','start',db.today,'date',false,'required')}${inputField('计划完成','due',shiftDate(db.today,25),'date',false,'required')}</div><div id="caseTemplatePreview" class="note" style="margin-top:18px"></div>`,'创建 Case',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'caseEdit');const instance=instantiate(db,{...data,project:selectedProject().id,reviewers:[data.reviewer]});rememberPage();ui.caseId=instance.id;ui.page='case';},'Case 已创建，任务与模板版本已保存'));previewCaseTemplate(db.templates[0].id);}
function previewCaseTemplate(id){const template=db.templates.find(item=>item.id===id);document.getElementById('caseTemplatePreview').innerHTML=latestVersion(template).tasks.map((task,index)=>`${index+1}. ${escapeHtml(task.name)} · ${task.duration} 天 · ${task.reviewers.length} 级验收`).join('<br>');}
function startTaskModal(id){const task=objectRef(db,'task',id);modal('开始任务',simulationNote(task.owner,'执行人')+`<p>${escapeHtml(task.name)}</p>`,'确认开始',()=>handleOperation(()=>startTask(db,id,task.owner),'任务已开始'));}
function submitTaskModal(id){const task=objectRef(db,'task',id);pendingFiles=clone(task.files);modal(task.status==='returned'?'修改后重新提交':'上传 Evidence 并提交',simulationNote(task.owner,'执行人')+`<p class="small" style="margin-bottom:16px">交付要求：${escapeHtml(task.evidence)}</p><div class="field"><label for="evidenceUpload">交付物文件</label><input id="evidenceUpload" type="file" multiple onchange="readEvidenceFiles(this)"><span class="small muted">单份不超过 750 KB，当前上传合计不超过 2 MB；保存在当前浏览器。</span></div><div id="pendingFiles" style="margin-top:15px"></div>`,'提交验收',()=>handleOperation(()=>submitTask(db,id,pendingFiles,task.owner),'已提交，验收待办和模拟通知已生成'));renderPendingFiles();}
async function readEvidenceFiles(input){try{const files=[...input.files];check(files.every(file=>file.size<=750*1024),'单份文件不能超过 750 KB');check(files.reduce((total,file)=>total+file.size,0)+pendingFiles.reduce((total,file)=>total+file.size,0)<=2*1024*1024,'本次交付物不能超过 2 MB');const loaded=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({id:makeId('file'),name:file.name,size:file.size,type:file.type,data:reader.result});reader.onerror=()=>reject(Error('文件读取失败'));reader.readAsDataURL(file);})));pendingFiles.push(...loaded);renderPendingFiles();document.getElementById('modalError').textContent='';}catch(error){document.getElementById('modalError').textContent=error.message;}input.value='';}
function renderPendingFiles(){const target=document.getElementById('pendingFiles');if(target)target.innerHTML=pendingFiles.map((file,index)=>`<div class="file-row">${icon('file')}<span class="spacer">${escapeHtml(file.name)}</span><button type="button" class="icon danger" title="移除文件" aria-label="移除 ${escapeHtml(file.name)}" onclick="pendingFiles.splice(${index},1);renderPendingFiles()">${icon('close')}</button></div>`).join('')||'<span class="small muted">尚未选择文件</span>';}
function downloadEvidence(id,index){const file=objectRef(db,'task',id)?.files[index];if(!file)return;const anchor=document.createElement('a');anchor.href=file.data;anchor.download=file.name;anchor.click();}
function reviewModal(kind,id,pass){const item=objectRef(db,kind,id),actor=currentHandler(item);modal(pass?'确认验收通过':'退回修改',simulationNote(actor,`${kindLabels[kind]} 验收人${kind==='task'?' · 第 '+(item.approval+1)+' 级':''}`)+`<p style="margin-bottom:15px">${escapeHtml(item.name)}</p><div class="field"><label for="reviewNote">${pass?'验收结论':'修改要求'}</label><textarea id="reviewNote" name="note" required placeholder="${pass?'说明验收依据及结论':'填写需要补充或修改的内容'}"></textarea></div>` ,pass?'确认通过':'确认退回',data=>handleOperation(()=>reviewObject(db,kind,id,actor,pass,data.note),pass?'验收结果已记录，后续流程已同步':'已退回，原提交记录保留'));}
function parentSubmitModal(kind,id){const item=objectRef(db,kind,id);modal('提交 '+kindLabels[kind]+' 整体验收',simulationNote(item.owner,'对象负责人')+`<div class="field"><label for="parentNote">整体交付说明</label><textarea id="parentNote" name="note" required></textarea></div>`,'提交验收',data=>handleOperation(()=>submitParent(db,kind,id,item.owner,data.note),'已提交本层验收'));}
function editTaskModal(id){const task=objectRef(db,'task',id);modal('调整当前 Case 的 Task',`<div class="note" style="margin-bottom:17px">仅调整尚未开始的任务；不修改公共模板或其他 Case。不会自动重排后续任务日期。</div><div class="fields">${inputField('任务名称','name',task.name,'text',true,'required')}${inputField('Evidence 要求','evidence',task.evidence,'text',true,'required')}${peopleSelect('owner',task.owner,'执行人')}${peopleSelect('reviewer1',task.reviewers[0],'一级验收人')}${peopleSelect('reviewer2',task.reviewers[1]||'','二级验收人',true)}${inputField('开始日期','start',task.start,'date',false,'required')}${inputField('完成日期','due',task.due,'date',false,'required')}<div class="field full"><label>前置任务（全部通过后可执行）</label><div class="checklist">${caseTasks(db,task.caseId).filter(item=>item.id!==id).map(item=>`<label><input type="checkbox" name="dependency" value="${item.id}" ${task.deps.includes(item.id)?'checked':''}>${escapeHtml(item.name)}</label>`).join('')}</div></div></div>`,'保存当前 Case', (data,form)=>handleOperation(()=>editPendingTask(db,id,{name:data.name.trim(),evidence:data.evidence.trim(),owner:data.owner,reviewers:[data.reviewer1,data.reviewer2].filter(Boolean),deps:[...new FormData(form).getAll('dependency')],start:data.start,due:data.due},CURRENT_USER),'当前任务已调整，模板保持不变'));}
function taskCaseOptions(){return projectCases().filter(instance=>!ui.category||instance.category===ui.category);}
function filteredTaskCases(){return taskCaseOptions().filter(instance=>!ui.filter||instance.id===ui.filter);}
function taskManagementTasks(){const ids=new Set(filteredTaskCases().map(instance=>instance.id));return projectTasks().filter(task=>ids.has(task.caseId)&&(!ui.taskOverdue||late(task)));}
function setTaskOverdue(value){ui.taskOverdue=!!value;render();}
function openOverdueTasks(){navTo('gantt');setTaskOverdue(true);}
function setTaskCategory(value){ui.category=value;if(ui.filter&&!taskCaseOptions().some(instance=>instance.id===ui.filter))ui.filter='';render();}
function setTaskCase(value){if(value&&!taskCaseOptions().some(instance=>instance.id===value))return;ui.filter=value;render();}
function setTaskView(value){if(!['list','gantt'].includes(value))return;ui.taskView=value;render();}
function taskManagementShell(content,timelineControls=''){
  return pageHead('任务管理','')+`<section class="panel"><div class="tabs"><button class="${ui.taskView==='list'?'active':''}" aria-pressed="${ui.taskView==='list'}" onclick="setTaskView('list')">${icon('task')} 列表</button><button class="${ui.taskView==='gantt'?'active':''}" aria-pressed="${ui.taskView==='gantt'}" onclick="setTaskView('gantt')">${icon('gantt')} 甘特图</button></div><div class="toolbar task-toolbar"><select aria-label="任务 Category 筛选" onchange="setTaskCategory(this.value)"><option value="">全部 Category</option>${db.categories.map(category=>`<option value="${category.id}" ${ui.category===category.id?'selected':''}>${escapeHtml(category.name)}</option>`).join('')}</select><select aria-label="任务 Case 筛选" onchange="setTaskCase(this.value)"><option value="">全部 Case</option>${taskCaseOptions().map(instance=>`<option value="${instance.id}" ${ui.filter===instance.id?'selected':''}>${escapeHtml(instance.name)}</option>`).join('')}</select><label class="row small"><input type="checkbox" aria-label="仅超期 Task" ${ui.taskOverdue?'checked':''} onchange="setTaskOverdue(this.checked)">仅超期 Task</label>${timelineControls}</div>${content}</section>`;
}
function taskManagementList(){
  const tasks=taskManagementTasks();
  return `<div class="table-scroll"><table class="task-list"><thead><tr><th>Task 名称</th><th>所属 Case</th><th>执行人</th><th>状态</th><th>计划开始日期</th><th>计划完成日期</th><th>当前验收人</th></tr></thead><tbody>${tasks.map(task=>{const instance=taskCase(db,task);return `<tr data-task-id="${task.id}"><td class="title-cell"><button class="link" onclick="openObject('task','${task.id}')">${escapeHtml(task.name)}</button></td><td class="title-cell"><button class="link" onclick="openCase('${instance.id}')">${escapeHtml(instance.name)}</button></td><td>${escapeHtml(task.owner)}</td><td>${badge(task)}</td><td><span class="mono">${escapeHtml(task.start||'待确定')}</span></td><td>${dateCell(task)}</td><td>${task.status==='review'?escapeHtml(currentHandler(task)||'未指定'):'—'}</td></tr>`;}).join('')}</tbody></table></div>${tasks.length?'':empty('没有符合条件的任务')}<div class="summary-line">${tasks.length} 项 Task</div>`;
}
function ganttPage(){
  if(ui.taskView!=='gantt')return taskManagementShell(taskManagementList());
  const start=ui.ganttStart,days=ui.ganttDays,cell=days===42?30:20,width=days*cell,todayOffset=dayNumber(db.today)-dayNumber(start),todayLine=todayOffset>=0&&todayOffset<days?`<span class="today-line" style="left:${todayOffset*cell}px"></span>`:'';
  const cases=filteredTaskCases(),tasks=taskManagementTasks();
  let rows='';
  for(const category of db.categories){const grouped=cases.filter(instance=>instance.category===category.id);if(!grouped.length)continue;
    rows+=`<div class="gantt-row gantt-group"><div class="gantt-label">${escapeHtml(category.name)} <span class="muted" style="margin-left:10px">${grouped.length} Case</span></div><div class="gantt-track" style="width:${width}px"></div></div>`;
    for(const instance of grouped){rows+=`<div class="gantt-row gantt-case"><div class="gantt-label"><button class="link" onclick="openCase('${instance.id}')">${escapeHtml(instance.name)}</button></div><div class="gantt-track" style="width:${width}px">${todayLine}</div></div>`;
      for(const task of tasks.filter(item=>item.caseId===instance.id)){
        const valid=validDate(task.start)&&validDate(task.due),offset=valid?dayNumber(task.start)-dayNumber(start):0,extent=valid?dayNumber(task.due)-dayNumber(task.start)+1:0,left=Math.max(0,offset),right=Math.min(days,offset+extent),show=valid&&right>left;
        const title=`${task.name} · ${statusLabels[task.status]} · ${task.start||'待确定'} 至 ${task.due||'待确定'} · ${task.owner}`;
        rows+=`<div class="gantt-row"><div class="gantt-label" style="padding-left:35px"><button class="link" title="${escapeHtml(title)}" onclick="openObject('task','${task.id}')">${escapeHtml(task.name)}</button><span class="small muted">${escapeHtml(task.owner)}${late(task)?' · 超期 '+elapsedDays(task.due,db.today)+' 天':''}</span></div><div class="gantt-track" style="width:${width}px;background-size:${cell}px 100%">${todayLine}${show?`<button class="gantt-bar ${task.status}" style="left:${left*cell+2}px;width:${Math.max(5,(right-left)*cell-4)}px" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}" onclick="openObject('task','${task.id}')">${escapeHtml(statusLabels[task.status])}${(right-left)*cell>160?' · '+escapeHtml(task.name):''}</button>`:`<span class="small muted" style="position:absolute;left:12px;top:13px">${valid?'时间区间外 · '+task.start+' 至 '+task.due:'计划时间待确定'} · ${statusLabels[task.status]}</span>`}</div></div>`;
      }
    }
  }
  const controls=`<span class="spacer"></span><button onclick="ui.ganttStart=shiftDate(db.today,-7);render()">${icon('clock')} 今天</button><button class="icon" title="前移两周" aria-label="前移两周" onclick="ui.ganttStart=shiftDate(ui.ganttStart,-14);render()">${icon('back')}</button><input aria-label="时间轴起始日期" type="date" value="${start}" onchange="if(validDate(this.value)){ui.ganttStart=this.value;render()}"><button class="icon" title="后移两周" aria-label="后移两周" onclick="ui.ganttStart=shiftDate(ui.ganttStart,14);render()">${icon('arrow')}</button><select aria-label="时间轴范围" onchange="ui.ganttDays=Number(this.value);render()"><option value="42" ${days===42?'selected':''}>6 周</option><option value="84" ${days===84?'selected':''}>12 周</option></select>`;
  return taskManagementShell(`<div class="gantt-scroll"><div class="gantt-table"><div class="gantt-row gantt-axis"><div class="gantt-label">Category / Case / Task</div><div class="gantt-days" style="width:${width}px">${Array.from({length:days},(_,index)=>{const date=shiftDate(start,index),day=new Date(date+'T12:00:00Z').getUTCDay();return `<div class="gantt-day ${day===0||day===6?'weekend':''} ${date===db.today?'today':''}" style="width:${cell}px"><span>${index===0||date.endsWith('-01')?date.slice(5,7)+'月':''}</span><strong>${date.slice(-2)}</strong></div>`}).join('')}</div></div>${rows||`<div class="empty">没有符合条件的任务</div>`}</div></div><div class="summary-line between wrap"><span>${tasks.length} 项 Task · 业务日期 ${db.today} · 分类来自所属 Case 的 Category</span><div class="legend">${[['var(--ea-color-divider)','执行中'],['var(--ea-color-divider)','待验收'],['var(--blue-soft)','已完成'],['var(--ea-color-divider)','待修改'],['var(--ea-color-divider)','等待前置']].map(([color,label])=>`<span><i style="background:${color}"></i>${label}</span>`).join('')}</div></div>`,controls);
}
function templatesPage(){return pageHead('Category模版','',`<button ${can('template')?'':'disabled'} onclick="newCategoryModal()">${icon('plus')} 新增类型</button>`)+`<div class="template-grid">${db.templates.map(template=>{const version=latestVersion(template),parallel=version.tasks.filter(task=>task.deps.length===1).length;return `<article class="template-card"><header><div class="between"><span class="pill ready">${escapeHtml(categoryName(template.category))}</span><span class="tag">当前版本 v${version.version}</span></div><h2 style="margin-top:14px">${escapeHtml(template.name)}</h2><div class="subline">${version.tasks.length} 项 Task · ${version.tasks.filter(task=>task.reviewers.length>1).length} 项多级验收</div></header><div class="template-steps">${version.tasks.map((task,index)=>`<div class="step-row"><span class="step-number">${index+1}</span><span class="spacer">${escapeHtml(task.name)}</span><span class="muted">${task.duration} 天</span></div>`).join('')}</div><footer>${template.versions.length>1?`<button class="link small" onclick="templateVersions('${template.id}')">${icon('clock')} 发布记录</button>`:'<span aria-hidden="true"></span>'}<button ${can('template')?'':'disabled'} onclick="editTemplateModal('${template.id}')">配置新版本 ${icon('arrow')}</button></footer></article>`}).join('')}</div><div class="note" style="margin-top:20px">已创建 Case 保留原模板版本及任务设置。发布新版本只用于之后创建的 Case；模板验收层级由 Task 性质确定。</div>`;}
function newCategoryModal(){modal('新增 Case 类型',`<div class="fields">${inputField('Category 名称','name','','text',true,'required maxlength="30"')}${inputField('流程模板名称','templateName','','text',true,'required maxlength="60"')}</div>`,'创建类型与模板',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'template');check(data.name.trim()&&data.templateName.trim(),'请填写类型及模板名称');check(!db.categories.some(category=>category.name.toLowerCase()===data.name.trim().toLowerCase()),'Category 名称已存在');const categoryId=makeId('cat');db.categories.push({id:categoryId,name:data.name.trim()});db.templates.push({id:makeId('tpl'),category:categoryId,name:data.templateName.trim(),versions:[{version:1,date:db.today,tasks:[definition('s1','需求与交付确认',3,'王宇',['李敏'],[],'交付说明与确认材料')]}]});logEvent(db,null,'新增 Category：'+data.name);},'已创建，可继续配置模板任务'));}
function templateVersions(id){const template=db.templates.find(item=>item.id===id);modal('发布记录 · '+template.name,`<div class="stack">${[...template.versions].reverse().map(version=>`<div><div class="between"><h3>v${version.version}${version.version===latestVersion(template).version?' · 当前版本':''}</h3><span class="small muted">${version.date}</span></div><p class="small muted">${version.tasks.length} 项 Task · ${db.cases.filter(instance=>instance.templateId===id&&instance.templateVersion===version.version).length} 个 Case 创建时采用</p><details><summary>查看版本任务</summary>${version.tasks.map(task=>`<p class="small">${escapeHtml(task.name)} · ${task.duration} 天 · ${escapeHtml(task.reviewers.join(' → '))}</p>`).join('')}</details></div>`).join('')}</div>`,'关闭',closeModal);}
function editTemplateModal(id){if(!can('template'))return toast('无模板配置权限');templateEditingId=id;templateDraft=clone(latestVersion(db.templates.find(item=>item.id===id)).tasks);modal('配置模板新版本',`<div class="between" style="margin-bottom:14px"><div class="small muted">修改发布为新版本，在途 Case 不受影响。</div><button type="button" onclick="collectTemplateDraft();templateDraft.push(definition(makeId('step'),'新任务',3,'王宇',['李敏'],[],'交付说明'));renderTemplateDraft()">${icon('plus')} 新增 Task</button></div><div class="table-scroll" id="templateDraftTable"></div>`,'发布新版本',()=>{collectTemplateDraft();handleOperation(()=>publishTemplate(db,templateEditingId,templateDraft,CURRENT_USER),'新版本已发布，原 Case 保持不变');},true);renderTemplateDraft();}
function startConditionText(task,tasks){const names=task.deps.map(id=>tasks.find(item=>item.id===id)?.name||'未命名任务');return names.length?names.join('、')+(names.length>1?'均验收通过后':'验收通过后'):'Case 启动后';}
function templateStartCondition(task,index){return `<div class="condition-description" data-condition-text>${escapeHtml(startConditionText(task,templateDraft))}</div><details class="condition-editor" ontoggle="this.querySelector('summary').textContent=this.open?'收起':'调整'"><summary aria-label="调整任务 ${index+1} 开始条件">调整</summary><div class="deps">${templateDraft.filter(item=>item.id!==task.id).map(item=>`<label><input type="checkbox" data-dependency="${item.id}" ${task.deps.includes(item.id)?'checked':''} onchange="updateTemplateConditions()"><span data-dependency-name>${escapeHtml(item.name||'未命名任务')}</span></label>`).join('')||'<span class="small muted">无其他任务</span>'}</div></details>`;}
function updateTemplateConditions(){collectTemplateDraft();for(const row of document.querySelectorAll('#templateDraftTable [data-step]')){const task=templateDraft.find(item=>item.id===row.dataset.step);row.querySelector('[data-condition-text]').textContent=startConditionText(task,templateDraft);for(const input of row.querySelectorAll('[data-dependency]'))input.nextElementSibling.textContent=templateDraft.find(item=>item.id===input.dataset.dependency)?.name||'未命名任务';}}
function renderTemplateDraft(){document.getElementById('templateDraftTable').innerHTML=`<table class="template-tasks"><thead><tr><th style="width:18%">Task 名称 / Evidence</th><th style="width:8%">周期（天）</th><th style="width:13%">执行人</th><th style="width:13%">一级验收人</th><th style="width:13%">二级验收人</th><th>开始条件</th><th></th></tr></thead><tbody>${templateDraft.map((task,index)=>`<tr data-step="${task.id}"><td><input aria-label="任务 ${index+1} 名称" data-name value="${escapeHtml(task.name)}" oninput="updateTemplateConditions()" required><input aria-label="任务 ${index+1} Evidence" style="margin-top:8px" data-evidence value="${escapeHtml(task.evidence)}" required></td><td><input aria-label="任务 ${index+1} 周期" data-duration type="number" min="1" max="365" step="1" value="${task.duration}" required></td><td><select data-owner aria-label="任务 ${index+1} 执行人">${PEOPLE.map(person=>`<option ${person===task.owner?'selected':''}>${person}</option>`).join('')}</select></td><td><select data-reviewer1 aria-label="任务 ${index+1} 一级验收人">${PEOPLE.map(person=>`<option ${person===task.reviewers[0]?'selected':''}>${person}</option>`).join('')}</select></td><td><select data-reviewer2 aria-label="任务 ${index+1} 二级验收人"><option value="">无</option>${PEOPLE.map(person=>`<option ${person===task.reviewers[1]?'selected':''}>${person}</option>`).join('')}</select></td><td class="start-condition">${templateStartCondition(task,index)}</td><td><button class="icon danger" type="button" title="移除任务" aria-label="移除任务 ${index+1}" onclick="collectTemplateDraft();removeDraftTask('${task.id}')">${icon('close')}</button></td></tr>`).join('')}</tbody></table>`;}
function collectTemplateDraft(){for(const row of document.querySelectorAll('[data-step]')){const task=templateDraft.find(item=>item.id===row.dataset.step);Object.assign(task,{name:row.querySelector('[data-name]').value.trim(),evidence:row.querySelector('[data-evidence]').value.trim(),duration:Number(row.querySelector('[data-duration]').value),owner:row.querySelector('[data-owner]').value,reviewers:[row.querySelector('[data-reviewer1]').value,row.querySelector('[data-reviewer2]').value].filter(Boolean),deps:[...row.querySelectorAll('[data-dependency]:checked')].map(input=>input.dataset.dependency)});}}
function removeDraftTask(id){if(templateDraft.length===1)return toast('至少保留一个 Task');if(templateDraft.some(task=>task.deps.includes(id)))return toast('请先解除其他 Task 对此任务的依赖');templateDraft=templateDraft.filter(task=>task.id!==id);renderTemplateDraft();}
const reportMetricLabels={all:'全部 Task',completed:'本期完成',review:'期末待验收',overdue:'期末超期',returns:'本期退回',cycle:'完成周期样本'};
function canReadProjectReport(projectId){const project=findProject(db,projectId);return !!project&&db.permissions[db.userRoles[CURRENT_USER]]?.view==='all'&&visibleTo(db,CURRENT_USER,'project',project);}
function accessibleReport(id){const report=db.reports.find(item=>item.id===id&&item.project===selectedProject().id);return report&&canReadProjectReport(report.project)?report:null;}
function hasReportDetails(report){return report?.version===2&&Array.isArray(report.snapshot?.tasks)&&Array.isArray(report.snapshot?.cases);}
function openReport(id,metric='all'){
  if(!accessibleReport(id))return toast('报表不存在或没有项目完整报表查看权限');
  rememberPage();Object.assign(ui,{page:'reports',reportId:id,reportTab:metric==='all'?'cases':'tasks',reportMetric:metric,reportCaseId:''});closeDrawer();closeModal();render();
}
function reportTasks(report,metric='all',caseId=''){
  if(!hasReportDetails(report))return [];
  return report.snapshot.tasks.filter(task=>(!caseId||task.caseId===caseId)&&(metric==='completed'?reportCompleted(task,report.from,report.to):metric==='review'?task.status==='review':metric==='overdue'?reportOverdue(task,report.generated):metric==='returns'?reportReturns(task,report.from,report.to).length>0:metric==='cycle'?reportCompleted(task,report.from,report.to)&&reportCycle(task)!==null:true));
}
function setReportView(metric='all',caseId='',tab='tasks'){Object.assign(ui,{reportMetric:metric,reportCaseId:caseId,reportTab:tab});render();document.getElementById('reportContent')?.scrollIntoView({block:'start'});}
function reportMetricButtons(report,detail=false){
  return `<div class="report-metrics">${[['completed','本期完成 Task'],['review','期末待验收 Task'],['overdue','期末超期 Task'],['returns','本期退回次数']].map(([key,label])=>`<button class="metric" ${hasReportDetails(report)?`onclick="${detail?`setReportView('${key}')`:`openReport('${report.id}','${key}')`}"`: 'disabled'} ${detail?`aria-pressed="${ui.reportTab==='tasks'&&ui.reportMetric===key&&!ui.reportCaseId}"`:''}><span class="caption">${label}</span><div class="number${key==='overdue'&&report[key]>0?' bad':''}">${report[key]}</div></button>`).join('')}</div>`;
}
function reportNumber(report,value,metric,caseId=''){return `<button class="link" onclick="setReportView('${metric}','${caseId}')" aria-label="查看${escapeHtml(reportMetricLabels[metric])}明细">${value}</button>`;}
function reportsPage(){
  if(!canReadProjectReport(selectedProject().id))return pageHead('统计报表','')+empty('当前权限不包含项目完整报表');
  if(ui.reportId)return reportDetailPage();
  const reports=db.reports.filter(report=>report.project===selectedProject().id),last=reports[0];
  return pageHead('统计报表','项目周会',`<button onclick="reportScheduleModal()" ${can('settings')?'':'disabled'}>${icon('clock')} 周期配置</button><button class="primary" onclick="generateReportModal()">${icon('plus')} 生成报表</button>`)+
    `<div class="report-scope between wrap"><span>周期生成 ${db.reportSchedule.enabled?'已开启':'已暂停'} · ${db.reportSchedule.period==='week'?'每周':'每月'} · 下次 ${db.reportSchedule.next}</span><span>历史快照 · 以生成时业务日期为准</span></div>`+
    (last?`<div class="between wrap" style="margin-bottom:16px"><h2>最近一期 · ${last.from} 至 ${last.to}</h2><button onclick="openReport('${last.id}')">${icon('eye')} 查看本期报表</button></div>${reportMetricButtons(last)}${hasReportDetails(last)?'':'<div class="notice" style="margin-bottom:16px">本期为旧版汇总，未保存历史任务明细。</div>'}`:'')+
    `<section class="panel"><div class="panel-head"><h2>报表历史</h2></div>${reports.length?`<div class="table-scroll"><table><thead><tr><th>统计区间 / 生成日期</th><th>生成方式</th><th>本期完成</th><th>期末待验收</th><th>期末超期</th><th>退回次数</th><th>内容</th><th></th></tr></thead><tbody>${reports.map(report=>`<tr><td><button class="link" onclick="openReport('${report.id}')">${report.from} 至 ${report.to}</button><div class="subline">${report.generated}</div></td><td>${report.automatic?'周期生成':'手动生成'}</td>${['completed','review','overdue','returns'].map(key=>`<td>${hasReportDetails(report)?`<button class="link" onclick="openReport('${report.id}','${key}')" aria-label="查看${reportMetricLabels[key]}明细">${report[key]}</button>`:report[key]}</td>`).join('')}<td><span class="tag">${hasReportDetails(report)?'含历史明细':'仅汇总'}</span></td><td><button class="icon" title="导出报表 CSV" aria-label="导出报表" onclick="exportReport('${report.id}')">${icon('download')}</button></td></tr>`).join('')}</tbody></table></div>`:empty('暂无报表')}</section>`;
}
function reportDetailPage(){
  const report=accessibleReport(ui.reportId);if(!report)return pageHead('报表不可用','统计报表')+empty('报表不存在或没有查看权限');
  const detail=hasReportDetails(report),project=report.snapshot?.project;
  const heading=pageHead('项目周会报表',`${report.from} 至 ${report.to}`,`<button onclick="exportReport('${report.id}')">${icon('download')} 导出${detail?'汇总与明细':'汇总'} CSV</button>`);
  if(!detail)return heading+`<div class="notice" style="margin-bottom:20px">此报表仅保存汇总，未保存生成时的 Case 和 Task 明细，无法追溯；未使用当前数据补齐。</div>${reportMetricButtons(report,true)}<dl class="detail-grid"><div><dt>Case 数量</dt><dd>${report.caseCount}</dd></div><div><dt>Task 数量</dt><dd>${report.taskCount}</dd></div><div><dt>生成时已验收 Case</dt><dd>${report.caseAccepted}</dd></div><div><dt>生成时 Project 已验收</dt><dd>${report.projectAccepted?'是':'否'}</dd></div><div><dt>完成周期均值 · 自然日（含验收）</dt><dd>${report.executionMean??'未记录'}</dd></div></dl>`;
  return heading+`<div class="report-context"><div><p>${escapeHtml(project.goal)}</p><div class="report-facts"><span>项目负责人 <strong>${escapeHtml(project.owner)}</strong></span><span>计划 <strong>${project.start||'未记录'} 至 ${project.due||'未记录'}</strong></span><span>Case <strong>${report.caseCount}</strong></span><span>本期验收完成 Case <strong>${report.caseCompleted}</strong></span><span>累计已验收 Case <strong>${report.caseAccepted}</strong></span><span>快照日期 <strong>${report.generated}</strong></span></div></div>${badge(project)}</div>${reportMetricButtons(report,true)}<div class="between wrap report-scope"><span>完成、退回按统计区间计；待验收、超期及责任人按期末快照计。</span><button class="link small" onclick="setReportView('cycle')">完成周期均值 ${report.executionMean??'—'} 自然日 · ${report.cycleSamples} 项样本（含验收）</button></div><div id="reportContent"><div class="between report-tabs"><div class="tabs"><button class="${ui.reportTab==='cases'?'active':''}" aria-pressed="${ui.reportTab==='cases'}" onclick="setReportView('all','','cases')">按 Case 看情况</button><button class="${ui.reportTab==='tasks'?'active':''}" aria-pressed="${ui.reportTab==='tasks'}" onclick="setReportView('all')">Task 明细</button></div>${ui.reportTab==='tasks'?`<div class="row wrap"><select aria-label="报表 Task 范围" onchange="setReportView(this.value,ui.reportCaseId)">${Object.entries(reportMetricLabels).map(([key,label])=>`<option value="${key}" ${ui.reportMetric===key?'selected':''}>${label}</option>`).join('')}</select><select aria-label="报表 Case 筛选" onchange="setReportView(ui.reportMetric,this.value)"><option value="">全部 Case</option>${report.snapshot.cases.map(instance=>`<option value="${instance.id}" ${ui.reportCaseId===instance.id?'selected':''}>${escapeHtml(instance.name)}</option>`).join('')}</select></div>`:''}</div>${ui.reportTab==='cases'?reportCaseTable(report):reportTaskTable(report)}</div>`;
}
function reportCaseTable(report){
  return `<section class="panel"><div class="table-scroll"><table class="report-table"><thead><tr><th>Case / Category</th><th>负责人</th><th>期末状态</th><th>计划完成</th><th class="number-cell">Task 总数</th><th class="number-cell">本期完成</th><th class="number-cell">期末待验收</th><th class="number-cell">期末超期</th><th class="number-cell">退回次数</th></tr></thead><tbody>${report.snapshot.cases.map(instance=>{const tasks=report.snapshot.tasks.filter(task=>task.caseId===instance.id),summary=reportTaskSummary(tasks,report.from,report.to,report.generated);return `<tr><td class="title-cell"><button class="link" onclick="setReportView('all','${instance.id}')">${escapeHtml(instance.name)}</button><div class="subline">${escapeHtml(instance.categoryName)}</div><div class="subline">${escapeHtml(instance.goal)}</div></td><td>${escapeHtml(instance.owner)}</td><td>${badge(instance)}${reportCompleted(instance,report.from,report.to)?'<div class="subline good">本期验收完成</div>':''}</td><td>${instance.due||'未记录'}${reportOverdue(instance,report.generated)?`<div class="subline bad">超期 ${elapsedDays(instance.due,report.generated)} 天</div>`:''}</td>${[['taskCount','all'],['completed','completed'],['review','review'],['overdue','overdue'],['returns','returns']].map(([key,metric])=>`<td class="number-cell">${reportNumber(report,summary[key],metric,instance.id)}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div>${report.snapshot.cases.length?'':empty('本期没有 Case')}<div class="summary-line">${report.caseCount} 个 Case · ${report.taskCount} 项 Task · 各 Case 指标与项目汇总同口径</div></section>`;
}
function reportTaskTable(report){
  const tasks=reportTasks(report,ui.reportMetric,ui.reportCaseId),returns=tasks.reduce((total,task)=>total+reportReturns(task,report.from,report.to).length,0);
  return `<section class="panel"><div class="panel-head between wrap"><h2>${reportMetricLabels[ui.reportMetric]||'Task 明细'}</h2><span class="small muted">${tasks.length} 项 Task${ui.reportMetric==='returns'?' · '+returns+' 次退回':''}</span></div><div class="table-scroll"><table class="report-table"><thead><tr><th>Task / 所属 Case</th><th>执行人</th><th>期末状态</th><th>计划完成</th><th>实际完成</th><th class="number-cell">超期天数</th><th>期末处理人 / 等待</th><th>依赖及本期退回</th><th></th></tr></thead><tbody>${tasks.map(task=>{const instance=report.snapshot.cases.find(item=>item.id===task.caseId),events=reportReturns(task,report.from,report.to),wait=reportWait(task,report.generated),dependencies=task.dependencies.filter(item=>item.status!=='done');return `<tr><td class="title-cell"><button class="link" onclick="reportTaskDetail('${report.id}','${task.id}')">${escapeHtml(task.name)}</button><div class="subline">${escapeHtml(instance?.name)}</div><div class="subline">${escapeHtml(instance?.categoryName)}${ui.reportMetric==='cycle'?' · 周期 '+reportCycle(task)+' 天':''}</div></td><td>${escapeHtml(task.owner)}</td><td>${badge(task)}</td><td>${task.due||'未记录'}</td><td>${task.completedAt||'—'}</td><td class="number-cell ${reportOverdue(task,report.generated)?'bad':''}">${reportOverdue(task,report.generated)?elapsedDays(task.due,report.generated):'—'}</td><td>${task.status==='done'?'—':escapeHtml(currentHandler(task)||'未记录')}${task.status==='review'?`<div class="subline">第 ${task.approval+1} 级 · ${wait===null?'等待起点未记录':'已等待 '+wait+' 天'}</div>`:''}</td><td class="report-reason">${task.status==='blocked'?`<div>等待 ${escapeHtml(dependencies.map(item=>item.name).join('、')||'前置任务')}</div>`:''}${events.length?`<button class="link" onclick="reportTaskDetail('${report.id}','${task.id}')">${events.length} 次退回 · 查看记录</button>`:task.status==='blocked'?'':'—'}</td><td><button class="link" onclick="reportTaskDetail('${report.id}','${task.id}')">快照详情</button></td></tr>`;}).join('')}</tbody></table></div>${tasks.length?'':empty('本期该范围没有 Task')}</section>`;
}
function reportTaskDetail(reportId,taskId){
  const report=accessibleReport(reportId),task=report?.snapshot?.tasks.find(item=>item.id===taskId);if(!task)return toast('此报表没有该任务的历史明细');
  const instance=report.snapshot.cases.find(item=>item.id===task.caseId),wait=reportWait(task,report.generated),events=reportReturns(task,report.from,report.to),current=objectRef(db,'task',taskId),available=current&&visibleTo(db,CURRENT_USER,'task',current);
  modal('Task 历史快照',`<div class="report-detail-summary">${badge(task)}<span class="small muted">快照 ${report.generated} · 统计 ${report.from} 至 ${report.to}</span></div><h3>${escapeHtml(task.name)}</h3><p class="subline">${escapeHtml(instance?.name)} / ${escapeHtml(instance?.categoryName)}</p><dl class="detail-grid"><div><dt>执行人</dt><dd>${escapeHtml(task.owner)}</dd></div><div><dt>验收人员</dt><dd>${escapeHtml(task.reviewers.join(' → '))}</dd></div><div><dt>计划周期</dt><dd>${task.start||'未记录'} 至 ${task.due||'未记录'}</dd></div><div><dt>实际开始 / 完成</dt><dd>${task.startedAt||'未记录'} / ${task.completedAt||'未完成'}</dd></div><div><dt>期末超期</dt><dd>${reportOverdue(task,report.generated)?elapsedDays(task.due,report.generated)+' 天':'否'}</dd></div><div><dt>当前验收环节等待（快照时）</dt><dd>${task.status==='review'?escapeHtml(currentHandler(task)||'未记录')+' · '+(wait===null?'起点未记录':wait+' 天'):'不在待验收'}</dd></div><div class="wide"><dt>Evidence 要求</dt><dd>${escapeHtml(task.evidence)}</dd></div></dl><section class="report-section"><h3>前置任务 · 期末状态</h3>${task.dependencies.map(item=>`<div class="row wrap" style="margin:8px 0"><span>${escapeHtml(item.name)}</span><span class="tag">${escapeHtml(statusLabels[item.status]||'状态未记录')}</span></div>`).join('')||'<p class="small muted">无前置任务</p>'}</section><section class="report-section"><h3>本期退回记录 · ${events.length} 次</h3>${historyHtml(events)}</section><details class="report-section"><summary>截至快照的任务记录</summary><div style="margin-top:16px">${historyHtml(task.history)}</div></details><div class="report-scope"><button type="button" class="link" ${available?'':'disabled'} onclick="openCurrentReportTask('${report.id}','${task.id}')">${icon('external')} 查看当前任务</button>${available?'<span class="small muted"> · 当前状态可能与本期快照不同</span>':'<span class="small muted"> · 任务已不存在或无查看权限</span>'}</div>`,'关闭',closeModal);
}
function openCurrentReportTask(reportId,taskId){const report=accessibleReport(reportId),task=objectRef(db,'task',taskId);if(!report?.snapshot?.tasks.some(item=>item.id===taskId)||!task||!visibleTo(db,CURRENT_USER,'task',task))return toast('当前任务不存在或没有查看权限');closeModal();openObject('task',taskId);}
function generateReportModal(){if(!canReadProjectReport(selectedProject().id))return toast('没有项目完整报表查看权限');modal('生成项目周会报表',`<div class="fields">${inputField('统计开始','from',shiftDate(db.today,-6),'date',false,'required')}${inputField('统计截止','to',db.today,'date',false,'required')}</div>`,'生成报表',data=>handleOperation(()=>{check(canReadProjectReport(selectedProject().id),'没有项目完整报表查看权限');const report=buildReport(db,selectedProject().id,data.from,data.to);rememberPage();Object.assign(ui,{reportId:report.id,reportTab:'cases',reportMetric:'all',reportCaseId:''});},'周会报表已生成'))}
function reportScheduleModal(){modal('周期报表配置',`<div class="fields"><div class="field"><label>自动生成</label><select name="enabled"><option value="yes" ${db.reportSchedule.enabled?'selected':''}>开启</option><option value="no" ${!db.reportSchedule.enabled?'selected':''}>暂停</option></select></div><div class="field"><label>时间周期</label><select name="period"><option value="week" ${db.reportSchedule.period==='week'?'selected':''}>每周</option><option value="month" ${db.reportSchedule.period==='month'?'selected':''}>每月（月初）</option></select></div>${inputField('下次生成日期','next',db.reportSchedule.next,'date',true,'required')}</div><div class="note" style="margin-top:16px">演示为工作区统一计划。若关闭期间错过多期，重新打开时合并生成一份至当前业务日期的快照，不虚构历史状态。</div>`,'保存计划',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');check(validDate(data.next),'日期无效');db.reportSchedule={enabled:data.enabled==='yes',period:data.period,next:data.next};runScheduledReports(db);},'周期计划已保存'));}
function downloadText(name,text,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function reportExportRows(report){
  const detailed=hasReportDetails(report),rows=[
    ['项目周会报表',detailed?'历史明细快照':'仅汇总：历史明细未记录'],
    ['项目','项目标识','统计开始','统计截止','生成业务日期','Case 数量','Task 数量','本期完成 Task','期末待验收 Task','期末超期 Task','累计已验收 Case','本期验收完成 Case','Project 已验收','完成周期均值（自然日含验收）','周期有效样本数','本期退回次数'],
    [report.snapshot?.project.name||'历史项目（名称未记录）',report.project,report.from,report.to,report.generated,report.caseCount,report.taskCount,report.completed,report.review,report.overdue,report.caseAccepted,report.caseCompleted??'',report.projectAccepted?'是':'否',report.executionMean??'',report.cycleSamples??'',report.returns]
  ];
  if(!detailed)return rows;
  const project=report.snapshot.project;
  rows.push([],['项目快照'],['项目目标','负责人','验收人','期末状态','计划开始','计划完成'],[project.goal,project.owner,project.reviewers.join(' / '),statusLabels[project.status]||project.status,project.start,project.due],[],['Case 明细'],['Case 标识','Case 名称','Category','目标','负责人','验收人','期末状态','计划开始','计划完成','实际完成','本期验收完成','期末超期天数','Task 总数','本期完成 Task','期末待验收 Task','期末超期 Task','本期退回次数']);
  for(const instance of report.snapshot.cases){
    const summary=reportTaskSummary(report.snapshot.tasks.filter(task=>task.caseId===instance.id),report.from,report.to,report.generated);
    rows.push([instance.id,instance.name,instance.categoryName,instance.goal,instance.owner,instance.reviewers.join(' / '),statusLabels[instance.status]||instance.status,instance.start,instance.due,instance.completedAt,reportCompleted(instance,report.from,report.to)?'是':'否',reportOverdue(instance,report.generated)?elapsedDays(instance.due,report.generated):'',summary.taskCount,summary.completed,summary.review,summary.overdue,summary.returns]);
  }
  rows.push([],['Task 明细'],['Task 标识','Task 名称','所属 Case','Category','执行人','验收人','期末状态','计划开始','计划完成','实际开始','实际完成','本期完成','完成周期（自然日含验收）','期末超期天数','期末处理人','当前验收环节等待（天）','等待起点','前置任务及期末状态','Evidence 要求','本期退回次数']);
  for(const task of report.snapshot.tasks){
    const instance=report.snapshot.cases.find(item=>item.id===task.caseId);
    rows.push([task.id,task.name,instance?.name||'',instance?.categoryName||'',task.owner,task.reviewers.join(' / '),statusLabels[task.status]||task.status,task.start,task.due,task.startedAt,task.completedAt,reportCompleted(task,report.from,report.to)?'是':'否',task.status==='done'?reportCycle(task)??'':'',reportOverdue(task,report.generated)?elapsedDays(task.due,report.generated):'',task.status==='done'?'':currentHandler(task)||'',reportWait(task,report.generated)??'',task.status==='review'?task.submittedAt:'',task.dependencies.map(item=>item.name+' ['+(statusLabels[item.status]||'未记录')+']').join(' / '),task.evidence,reportReturns(task,report.from,report.to).length]);
  }
  rows.push([],['本期退回记录'],['Task 标识','Task 名称','所属 Case','日期','操作人','提交轮次','退回记录']);
  for(const task of report.snapshot.tasks)for(const event of reportReturns(task,report.from,report.to))rows.push([task.id,task.name,report.snapshot.cases.find(item=>item.id===task.caseId)?.name||'',event.at,event.actor,event.round||'',event.text]);
  return rows;
}
function reportCSV(report){const rows=reportExportRows(report),width=Math.max(...rows.map(row=>row.length));return '\ufeff'+rows.map(row=>Array.from({length:width},(_,index)=>{let text=String(row[index]??'');if(/^\s*[=+@-]|^[\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
function exportReport(id){const report=accessibleReport(id);if(!report)return toast('报表不存在或没有查看权限');downloadText('WBS-DH-周会报表-'+report.to+'.csv',reportCSV(report));toast(hasReportDetails(report)?'项目汇总、Case、Task 和退回记录已导出':'旧版汇总已导出，历史明细未记录');}
function notificationsPage(){let messages=db.messages.filter(message=>message.project===selectedProject().id&&(ui.notificationTab!=='mine'||message.recipient===CURRENT_USER)&&(ui.notificationTab!=='overdue'||message.level>0));const config=db.notification;return pageHead('通知中心','邮件 / Hems · 模拟发送',`<button onclick="noticeRulesModal()" ${can('settings')?'':'disabled'}>${icon('settings')} 提醒规则</button><button class="primary" onclick="runNoticeScan()">${icon('refresh')} 检查当前时间线</button>`)+`<div class="notice" style="margin-bottom:18px">本地演示：通知仅生成模拟记录，不发送真实邮件或 Hems 消息。已读不会改变任务或验收状态。</div><section class="panel"><div class="panel-body"><div class="between"><h2>时间线分级提醒</h2><span class="small muted">自然日 · Asia/Shanghai · 每日 ${String(config.scanHour).padStart(2,'0')}:00</span></div><div class="timeline-rules">${[['D − '+config.lead,'临期提醒'],['D − '+config.near,'再次提醒'],['D 当天','今日到期'],['D + 1','一级报警'],['D + '+config.second,'二级 · Case 负责人'],['D + '+config.third,'三级 · Project 负责人']].map(([day,label])=>`<div class="rule-stop"><span>${day}</span><strong>${label}</strong></div>`).join('')}</div></div></section><section class="panel"><div class="between"><div class="tabs">${[['all','项目通知'],['mine','发给我的'],['overdue','超期报警']].map(([value,label])=>`<button class="${ui.notificationTab===value?'active':''}" onclick="ui.notificationTab='${value}';render()">${label}</button>`).join('')}</div><span class="small muted" style="margin-right:20px">${messages.length} 条接收记录</span></div>${messages.slice(0,100).map(message=>{const item=objectRef(db,message.kind,message.object);return `<div class="notification-row ${message.read?'':'unread'}"><span class="pill ${message.level?'overdue':'ready'}" style="height:28px;padding:5px">${icon(message.level?'alert':'bell')}</span><div><div class="between"><button class="link" style="font-weight:600" onclick="openNotification('${message.id}')">${escapeHtml(message.title)}</button><span class="small muted mono">${message.date}</span></div><div class="subline">${
