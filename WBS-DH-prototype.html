#templateDraftTable,#caseDraftTasks{max-height:calc(90vh - 250px);overflow:auto}
:is(#templateDraftTable,#caseDraftTasks) .template-tasks{border-collapse:separate;border-spacing:0}
:is(#templateDraftTable,#caseDraftTasks) th{position:sticky;top:0;z-index:2;background:#f8fafc;box-shadow:0 1px 0 var(--line)}
:is(#templateDraftTable,#caseDraftTasks) th:first-child,:is(#templateDraftTable,#caseDraftTasks) td:first-child{padding-left:0}
.case-create{display:grid;gap:18px}
.case-create-fields{grid-template-columns:repeat(3,minmax(0,1fr))}
.case-create-fields>.field:first-child{grid-column:span 2}
.case-create-fields textarea{height:64px;min-height:64px}
.case-template-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:16px}
.case-template-toolbar>.field{grid-column:span 2;min-width:0}
.case-template-toolbar select{width:100%}
.case-template-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;gap:16px;min-width:0}
.case-template-choice select{min-width:0;text-overflow:ellipsis}
.case-template-version{flex-shrink:0;white-space:nowrap;font-size:12px;color:var(--muted)}
.case-create #caseDraftTasks{max-height:340px}
.case-create>section,.case-create>details{min-width:0;border-bottom:1px solid var(--line);padding-bottom:18px}
.case-create h3{margin-bottom:12px}
.case-create .case-template-heading>label{font:inherit;color:inherit}
.case-create details>summary{cursor:pointer;color:var(--blue)}
.task-requirements-cell{display:flex;align-items:center;justify-content:flex-start;width:100%;min-width:0;height:36px;padding:4px 6px;text-align:left;background:transparent;border-color:transparent;border-radius:6px}
.task-requirements-cell:hover,.task-requirements-cell[aria-expanded=true]{background:var(--blue-soft);border-color:var(--line)}
.task-requirements-cell .requirement-excerpt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:1.5}
.task-requirements-cell .requirement-empty{font-size:12px;color:var(--blue)}
.task-requirement-overlay{position:fixed;inset:0;z-index:80}
.task-requirement-popover{position:fixed;z-index:81;width:420px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #172b4530}
.task-requirement-popover h3{font-size:15px}
.task-requirement-popover .requirement-task-name{margin:6px 0 10px;overflow-wrap:anywhere;font-size:12px;color:var(--muted)}
.task-requirement-popover .field{margin-top:10px}
.task-requirement-popover textarea{height:64px;min-height:48px;resize:vertical}
.task-requirement-popover #requirementEditorEvidence{height:48px}
.task-requirement-popover .requirement-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.requirement-file-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.requirement-file-row:last-child{border-bottom:0}
.requirement-file-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px}
.requirement-files-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}
.requirement-upload-button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;width:100%;border:1px dashed var(--line);background:var(--bg);color:var(--blue)}
.requirement-upload-button:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.task-requirement-popover input[type=file][hidden],#evidenceUpload[hidden],#requirementFileStatus:empty,#evidenceFileStatus:empty{display:none}
.case-create .template-tasks td{vertical-align:top}
.case-create .template-tasks{min-width:1040px}
.compact-task-table{table-layout:fixed;min-width:800px}
.compact-task-table input,.compact-task-table select{min-width:0}
.compact-task-table td{overflow-wrap:anywhere}
.compact-task-table th:not(:first-child),.compact-task-table td:not(:first-child){padding-left:8px;padding-right:8px}
.task-plan-dates{font-size:12px;white-space:nowrap;line-height:1.7}
.task-plan-dates>span{display:block}
.task-plan-dates .bad{white-space:normal;font-size:11px}
.task-predecessor-picker{min-width:0;margin-top:0}
.task-predecessor-picker>summary{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:36px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;list-style:none}
.task-predecessor-picker>summary::-webkit-details-marker{display:none}
.task-predecessor-picker>summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-predecessor-picker>summary svg{width:14px;height:14px;transform:rotate(90deg)}
.case-draft-resume:empty{display:none}
.case-draft-resume{padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.case-draft-resume .row{flex-wrap:wrap}
.case-due-suggestion{font-size:12px;color:var(--muted)}
.case-due-suggestion .link{font-size:12px;min-height:24px;margin-left:6px}
#caseScheduleError:empty{display:none}
.case-create-warning{margin-top:12px;padding:12px 16px;border:1px solid var(--line);border-radius:8px}
.case-create-warning ul{padding-left:20px}
#caseCreateReview:empty{display:none}

.gantt-case .gantt-bar.review{background:#fff6d6;border-color:#d6a700;color:#8a6500}
.gantt-case .gantt-bar.done{background:#e8f6ef;border-color:#329d8e;color:#23766b}
.gantt-case .gantt-bar.overdue{background:#fff0f0;border-color:#d94848;color:#b42318}

.gantt-case .gantt-bar.review .gantt-case-fill{background:#ffe29a}
.gantt-case .gantt-bar.done .gantt-case-fill{background:#bfe8d9}
.gantt-case .gantt-bar.overdue .gantt-case-fill{background:#ffc9c9}
.gantt-case-bar-label{position:relative;display:block;padding:0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-case-unplanned{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.gantt-day.today{background:var(--ea-color-primary-tint);color:var(--blue)}
.today-line{background:var(--ea-color-focus)}
.main.equipment-main{grid-row:1 / 3;padding:0;overflow:hidden;position:relative}

.equipment-fullscreen #app{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}

.sidebar-collapsed{--side:64px}

lter(k=>k==='poDate'?poValue(e)!==poValue(updated):String(e[k]??'')!==String(updated[k]??'')).map(k=>`${k==='poDate'?'有价 PO issue date':fieldLabels[k]}：${(k==='poDate'?poValue(e):e[k])??'空'} → ${(k==='poDate'?poValue(updated):updated[k])??'空'}`);\n if(!id||changes.length){const before=clone(state);if(id)Object.assign(e,updated);else state.equipment.push(updated);if(!event(updated.id,id?changes.join('；'):'新增设备需求','需求')){state=before;return formError(storageWriteError||'设备信息未保存，请重试。',id)}}\n equipmentEditSnapshot=null;drawerTab='overview';if(!id){closeModal();drawerId=updated.id}refresh();toast('设备需求已保存');return true;\n}\nfunction formError(msg,id){document.getElementById(id?'fieldError':'modalError').textContent=msg}\nfunction modal(title,body,submitText,handler,closeLabel='取消'){if(EQUIPMENT_CATALOG)return;document.getElementById('modalRoot').innerHTML=`\u003cdiv class=\"modal-mask\">\u003csection class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(title)}\">\u003cform id=\"modalForm\">\u003cdiv class=\"modal-head between\">\u003ch2>${title}\u003c/h2>\u003cbutton type=\"button\" class=\"icon\" aria-label=\"关闭弹窗\" onclick=\"closeModal()\">${icon('close')}\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">${body}\u003cdiv id=\"modalError\" class=\"error\" role=\"alert\">\u003c/div>\u003c/div>\u003cdiv class=\"modal-foot\">\u003cbutton type=\"button\" onclick=\"closeModal()\">${esc(closeLabel)}\u003c/button>\u003cbutton class=\"primary\" type=\"submit\">${submitText}\u003c/button>\u003c/div>\u003c/form>\u003c/section>\u003c/div>`;document.getElementById('modalForm').onsubmit=ev=>{ev.preventDefault();try{req(!ev.target.querySelector('.catalog-addition'),'请先添加或取消新增选项。');handler(Object.fromEntries(new FormData(ev.target)),ev.target)}catch(err){document.getElementById('modalError').textContent=err.message}};setTimeout(()=>document.querySelector('#modalForm input, #modalForm select, #modalForm button')?.focus(),0)}\nfunction closeModal(){document.getElementById('modalRoot').innerHTML=''}function req(ok,msg){if(!ok)throw Error(msg)}function input(label,name,value='',type='text',attrs=''){return `\u003cdiv class=\"field\">\u003clabel>${label}\u003c/label>\u003cinput name=\"${name}\" value=\"${esc(value)}\" type=\"${type}\" ${attrs}>\u003c/div>`}\nfunction newEquipment(){const e={name:'',desc:'',owner:'',module:'',area:'',sponsor:'',user:'',vendor:'',tool:'Common',count:1,origin:'',kcny:0,rmid:'',hookup:0,year:'2026',category:'new EC'};modal('新增设备需求',`\u003cdiv class=\"fields\">${fieldsHtml(e)}\u003c/div>`,'创建设备需求',()=>{});document.getElementById('modalForm').onsubmit=ev=>saveFields(ev,null);wireCurrency('modalForm')}\nfunction batchModal(id,bid){const e=eq(id),b=e.batches.find(b=>b.id===bid);modal(b?'编辑采购批次':'新增采购批次',`\u003cdiv class=\"notice\">${esc(e.name)} · 可新增下单 ${e.count-ordered(e)} 件\u003c/div>\u003cdiv class=\"fields\">${input('PO 编号','poid',b?.id||'','text','required')}${input('本批下单数量','qty',b?.qty||1,'number','required min=\"1\" step=\"1\"')}${input('PO issue date','po',b?.po||TODAY,'date','required')}${input('预计全部完成签字验收日期','eta',b?.eta||'','date')}${input('本批采购金额 · KCNY','price',b?.price||0,'number','min=\"0\" step=\"0.01\" required')}\u003cdiv class=\"field full\">\u003clabel>说明（普通补录可不填）\u003c/label>\u003ctextarea name=\"note\" placeholder=\"调整数量或推迟预计日期时，请说明原因\">\u003c/textarea>\u003c/div>\u003c/div>`,'保存批次',(d)=>{req(validNumber(d.qty,true)&&+d.qty>0,'数量必须为正整数');req(+d.qty\u003c=e.count-ordered(e)+(b?.qty||0),'下单数量超过设备需求');req(!b||+d.qty>=delivered(b),'数量不能小于已到货数量');req(validDate(d.po),'请填写有效 PO 日期');req(!d.eta||validDate(d.eta)&&d.eta>=d.po,'预计验收日期不能早于 PO 日期');req(!b||b.deliveries.every(x=>x.date>=d.po),'PO 日期不能晚于已登记到货日期');req(!e.batches.some(x=>x!==b&&x.id===d.poid.trim()),'PO 编号已存在');req(/^[A-Za-z0-9_-]+$/.test(d.poid.trim()),'PO 编号仅支持字母、数字、短横线与下划线');req(validNumber(d.price),'采购金额无效');if(b&&(Number(d.qty)!==b.qty||(b.eta&&(!d.eta||d.eta>b.eta))))req(d.note.trim(),'调整数量或推迟预计日期时，请填写原因');const old=b?.eta;const obj={id:d.poid.trim(),qty:+d.qty,po:d.po,eta:d.eta,price:+d.price};if(b)Object.assign(b,obj);else e.batches.push({...obj,deliveries:[],acceptances:[]});event(id,`${b?'更新':'新增'}批次 ${obj.id}：${old||'待确认'} → ${d.eta||'待确认'}；${d.note}`,'采购');closeModal();refresh();toast('批次已保存，阶段数量保持原填写值')})}\nfunction deliveryModal(id,bid){const e=eq(id),b=e.batches.find(x=>x.id===bid);modal('登记分批到货',`\u003cdiv class=\"notice\">${esc(b.id)} · 尚未到货 ${b.qty-delivered(b)} 件\u003c/div>\u003cdiv class=\"fields\">${input('本次到货数量','qty',b.qty-delivered(b),'number','min=\"1\" step=\"1\" required')}${input('实际到货日期','date',TODAY,'date','required')}\u003c/div>`,'确认到货',d=>{req(validNumber(d.qty,true)&&+d.qty>0&&+d.qty\u003c=b.qty-delivered(b),'到货数量超过本批剩余数量');req(validDate(d.date)&&d.date>=b.po&&d.date\u003c=TODAY,'到货日期须在 PO 日期与演示业务日期之间');b.deliveries.push({id:uid(),qty:+d.qty,date:d.date});event(id,`${b.id} 登记到货 ${d.qty} 件`,'到货');closeModal();refresh();toast('到货已登记，可继续完成使用者签字验收')})}\nfunction acceptModal(id,bid){const e=eq(id),b=e.batches.find(x=>x.id===bid);modal('使用者签字与验收',`\u003cdiv class=\"notice\">${esc(e.name)} · ${esc(b.id)}\u003cbr>已到货 ${delivered(b)} 件，待签字验收 ${delivered(b)-accepted(b)} 件。\u003c/div>\u003cdiv class=\"fields\">${input('本次签字验收数量','qty',delivered(b)-accepted(b),'number','min=\"1\" step=\"1\" required')}${input('签字验收日期','date',TODAY,'date','required')}\u003cdiv class=\"field full\">\u003clabel>使用者签名 · ${esc(e.user)}\u003c/label>\u003cinput class=\"signature\" name=\"signer\" placeholder=\"输入签名人姓名\" required>\u003cspan class=\"small muted\">原型以姓名输入模拟签名，不构成真实电子签署。\u003c/span>\u003c/div>\u003cdiv class=\"field full\">\u003clabel>补充说明（选填）\u003c/label>\u003ctextarea name=\"note\" placeholder=\"有需要补充的情况时填写\">\u003c/textarea>\u003c/div>\u003c/div>\u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" name=\"confirm\" required>我确认上述数量对应的设备已验收通过，并以使用者身份签字确认，两项同步完成。\u003c/label>`,'签字并确认验收通过',d=>{req(validNumber(d.qty,true)&&+d.qty>0&&+d.qty\u003c=delivered(b)-accepted(b),'数量不能超过已到货待验收数量');req(validDate(d.date)&&d.date\u003c=TODAY,'请填写不晚于演示业务日期的有效日期');const arrivedBy=sum(b.deliveries,x=>x.date\u003c=d.date?x.qty:0);req(arrivedBy>=accepted(b)+Number(d.qty),'该日期之前的到货数量不足以覆盖本次验收');req(d.signer.trim()&&d.confirm,'请填写签名并确认验收通过');b.acceptances.push({qty:+d.qty,date:d.date,signer:d.signer.trim(),note:d.note.trim()});event(id,`${b.id} ${d.qty} 件签字验收通过 · ${d.signer}`,'验收');closeModal();refresh();toast('验收记录已保存，阶段数量请按实际情况填写')})}\nfunction isLeader(){return true} // Prototype session: Leader; production role comes from authenticated user.\nfunction commitMilestones(text){milestones.sort((a,b)=>a.date.localeCompare(b.date));milestones.forEach((m,i)=>m.phase=String(i+1).padStart(2,'0')+' · 研发阶段');state.milestones=clone(milestones);if(!milestones.some(m=>m.id===selectedMs))selectedMs=milestones[0]?.id||'';delete columnFilters.milestones;event('',text,'里程碑');closeModal();refresh();projectSettings()}\nfunction editMilestone(id){if(!isLeader())return toast('仅 Leader 可以管理里程碑');const m=milestones.find(x=>x.id===id);modal(m?'编辑里程碑':'新增里程碑',`\u003cdiv class=\"fields\">${input('里程碑名称','name',m?.name||'','text','required maxlength=\"50\"')}${input('计划日期','date',m?.date||'','date','required')}${m?'\u003cdiv class=\"field full\">\u003clabel>修改说明（调整日期时必填）\u003c/label>\u003ctextarea name=\"reason\">\u003c/textarea>\u003c/div>':''}\u003c/div>`,'保存',d=>{req(isLeader(),'仅 Leader 可以管理里程碑');req(d.name.trim(),'请输入名称');req(validDate(d.date),'请输入有效日期');req(!milestones.some(x=>x.id!==id&&x.name.toLowerCase()===d.name.trim().toLowerCase()),'里程碑名称已存在');if(m&&m.date!==d.date)req(d.reason?.trim(),'调整日期时请说明原因');const before=m?`${m.name} / ${m.date}`:'';if(m){m.name=d.name.trim();m.date=d.date}else milestones.push({id:uid(),name:d.name.trim(),date:d.date,phase:''});commitMilestones(`${m?'修改':'新增'}里程碑：${before?before+' → ':''}${d.name.trim()} / ${d.date}${d.reason?'；'+d.reason:''}`)})}\nfunction deleteMilestone(id){if(!isLeader())return toast('仅 Leader 可以管理里程碑');const m=milestones.find(x=>x.id===id);if(!m)return;const linked=state.equipment.filter(e=>e.needs[id]);modal('删除里程碑',`\u003cp>确认删除「${esc(m.name)}」？\u003c/p>\u003cp class=\"muted\">${linked.length?`关联的 ${linked.length} 类设备将解除此里程碑关联，采购、到货和验收记录保留。`:'该里程碑未关联设备。'}\u003c/p>${linked.length?'\u003cdiv style=\"margin-top:12px\">'+linked.map(e=>esc(e.name)).join('\u003cbr>')+'\u003c/div>':''}`,'确认删除',()=>{req(isLeader(),'仅 Leader 可以管理里程碑');milestones.splice(milestones.findIndex(x=>x.id===id),1);state.equipment.forEach(e=>{if(e.needs[id]){delete e.needs[id];event(e.id,`因里程碑删除，解除与 ${m.name} 的关联`,'里程碑')}});commitMilestones(`删除里程碑：${m.name}`)})}\nfunction projectSettings(){modal('Project设置',`\u003ch3>预算汇率\u003c/h3>\u003cdiv class=\"between\" style=\"margin:12px 0 24px\">\u003cspan>1 USD = ${state.rate} CNY\u003c/span>\u003cbutton type=\"button\" onclick=\"rateModal()\">修改汇率\u003c/button>\u003c/div>\u003cdiv class=\"between\">\u003ch3>研发里程碑\u003c/h3>${isLeader()?'\u003cbutton type=\"button\" onclick=\"editMilestone()\">新增里程碑\u003c/button>':''}\u003c/div>${milestones.map(m=>`\u003cdiv class=\"delta\">\u003cspan>${esc(m.name)}\u003cbr>\u003cspan class=\"small muted\">${m.date}\u003c/span>\u003c/span>${isLeader()?`\u003cspan class=\"row\">\u003cbutton type=\"button\" onclick=\"editMilestone('${m.id}')\">编辑\u003c/button>\u003cbutton type=\"button\" class=\"danger\" onclick=\"deleteMilestone('${m.id}')\">删除\u003c/button>\u003c/span>`:''}\u003c/div>`).join('')||'\u003cp class=\"muted\">尚未设置里程碑\u003c/p>'}\u003cp class=\"small muted\" style=\"margin-top:12px\">Leader 统一维护名称和日期；成员可为设备选择关联里程碑并填写累计需求。\u003c/p>`,'关闭',closeModal)}\nfunction rateModal(){modal('Project金额换算',`\u003cdiv class=\"notice\">统一使用Project预算汇率。修改汇率后保留 KCNY 原值，重新计算全部 USD$M。Hookup 费用按 KCNY 单独显示。\u003c/div>${input('1 USD = 多少 CNY','rate',state.rate,'number','min=\"0.0001\" step=\"0.0001\" required')}`,'更新换算',d=>{req(Number.isFinite(+d.rate)&&+d.rate>0,'汇率必须大于 0');state.rate=+d.rate;event('',`Project汇率更新为 ${state.rate}`,'金额');closeModal();refresh();toast('美元金额已按新汇率更新')})}\nfunction help(){modal('演示说明',`\u003cp>这是一个可离线打开的桌面端产品原型，所有演示数据保存在当前浏览器。\u003c/p>\u003cdiv class=\"section\" style=\"margin-top:16px\">\u003ch3>推荐演示路径\u003c/h3>\u003col style=\"padding-left:20px;line-height:2\">\u003cli>查看「试产启动」的设备缺口。\u003c/li>\u003cli>打开高温试验箱，将第二批预计可用日期改为 2026-10-15。\u003c/li>\u003cli>对已到货的 1 台执行使用者签字验收。\u003c/li>\u003cli>在设备详情中将对应问题标记已解决。\u003c/li>\u003cli>返回总览，展开「最近变更」查看记录。\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"muted small\">业务日期固定为 2026-09-08；签名为演示模拟。Hookup 费用暂按 KCNY 单独显示。导入导出使用 Excel 可打开的 CSV，不包含批次或签名记录。\u003c/p>\u003cbutton type=\"button\" class=\"danger\" style=\"margin-top:15px\" onclick=\"resetModal()\">恢复初始演示数据\u003c/button>`,'知道了',()=>{closeModal()})}\nfunction resetModal(){modal('恢复演示数据',`\u003cp>将清除本原型在当前浏览器中的修改、签字验收和问题记录，恢复初始Case。\u003c/p>`,'确认恢复',()=>{state=clone(seed);state.baseline=clone(seed.equipment);state.baseline[0].batches[1].eta='2026-10-15';state.baseline[6].batches[0].acceptances=[];state.baselineDate='2026-09-01';milestones.splice(0,milestones.length,...clone(defaultMilestones));selectedMs='m2';initializeStageNumbers();save();closeModal();closeDrawer();go('dashboard');toast('初始演示数据已恢复')})}\nconst legacyCsvKeys=['name','owner','module','area','sponsor','user','vendor','tool','count','origin','kcny','rmid','hookup','usd','year','category'];\nconst csvKeys=[...legacyCsvKeys,'equipmentType','equipmentModel','currentStage'];\nfunction csvString(rows){return '\\ufeff'+rows.map(row=>row.map(v=>'\"'+String(v??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n')}\nfunction download(name,text,type='text/csv;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}\nfunction exportCSV(template=false){const rows=template?[]:visibleRows();download(template?'设备需求导入模板.csv':'设备需求.csv',csvString([csvKeys.map(k=>fieldLabels[k]),...rows.map(e=>csvKeys.map(k=>k==='usd'?(e.kcny/state.rate/1000).toFixed(3):k==='hookup'?e[k].toFixed(3):k==='kcny'?e[k].toFixed(2):/^[=+@\\-]/.test(String(e[k]))?\"'\"+e[k]:e[k]))]));toast(template?'模板已下载':'当前视图的设备主字段已导出')}\nfunction parseCSV(text){text=text.replace(/^\\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i\u003ctext.length;i++){const c=text[i];if(c==='\"'){if(quoted&&text[i+1]==='\"'){cell+='\"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\\n'||c==='\\r')&&!quoted){if(c==='\\r'&&text[i+1]==='\\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}req(!quoted,'CSV 引号未闭合');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}\nfunction equipmentImportRows(text){const rows=parseCSV(text),keys=[csvKeys,legacyCsvKeys].find(candidate=>JSON.stringify(rows[0])===JSON.stringify(candidate.map(key=>fieldLabels[key])));req(keys,'表头与模板不一致，请下载字段模板');req(rows.length>1,'文件没有设备数据');const names=new Set(state.equipment.map(item=>item.name.toLowerCase())),list=[];for(let index=1;index\u003crows.length;index++){req(rows[index].length===keys.length,`第 ${index+1} 行列数不正确`);const data=Object.fromEntries(keys.map((key,offset)=>[key,rows[index][offset].trim()]));req(data.name&&!names.has(data.name.toLowerCase()),`第 ${index+1} 行设备名称为空或重复`);names.add(data.name.toLowerCase());const item={id:'EQ-'+uid().slice(-7).toUpperCase(),desc:'导入设备需求',batches:[],needs:{}};for(const [key,value]of Object.entries(data)){if(key==='usd')continue;const error=validateField(item,key,value);req(!error,`第 ${index+1} 行：${error}`);setField(item,key,value)}req(!data.usd||validNumber(data.usd)&&Math.abs(+data.usd-Number((item.kcny/state.rate/1000).toFixed(3)))\u003c0.00001,`第 ${index+1} 行美元金额与Project汇率不一致`);req(/^\\d{4}$/.test(item.year),`第 ${index+1} 行年份无效`);req(!item.equipmentModel||item.equipmentType,`第 ${index+1} 行子类型缺少一级设备类型`);list.push(item)}return list}\nfunction importModal(){modal('导入设备需求',`\u003cdiv class=\"notice\">使用 UTF-8 CSV 新增需求。新版模板追加设备类型、子类型／型号、当前阶段，兼容旧 16 列模板；未提供的新字段保持待填写。\u003c/div>\u003cbutton type=\"button\" onclick=\"exportCSV(true)\">${icon('download')} 下载字段模板\u003c/button>\u003cdiv class=\"field\" style=\"margin-top:18px\">\u003clabel>选择 CSV 文件\u003c/label>\u003cinput type=\"file\" name=\"file\" id=\"importFile\" accept=\".csv\" required>\u003c/div>\u003cp class=\"small muted\" style=\"margin-top:12px\">先完整校验再写入；同名设备阻断。KCNY 为导入换算基准，USD$M 如填写须与换算值一致。\u003c/p>`,'校验并预览',async(_,form)=>{try{const file=form.elements.file.files[0];req(file&&file.size\u003c2e6,'请选择小于 2 MB 的 CSV');const list=equipmentImportRows(await file.text());modal('确认导入',`\u003cdiv class=\"notice\">${list.length} 条设备需求全部校验通过。\u003c/div>\u003cdiv style=\"max-height:260px;overflow:auto\">${list.map(item=>`\u003cdiv class=\"delta\">\u003cspan>${esc(item.name)}\u003c/span>\u003cspan>${item.count} 件 · ${money(item.kcny)} KCNY\u003c/span>\u003c/div>`).join('')}\u003c/div>`,'导入全部需求',()=>{state.equipment.push(...list);list.forEach(item=>event(item.id,'通过 CSV 导入设备需求','导入'));closeModal();openView('');toast(`已导入 ${list.length} 条设备需求`)})}catch(error){document.getElementById('modalError').textContent=error.message}})}\nif(Array.isArray(state.milestones))milestones.splice(0,milestones.length,...state.milestones);\nif(!state.milestones&&state.milestoneDates)milestones.forEach(m=>{if(state.milestoneDates[m.id])m.date=state.milestoneDates[m.id]});\ndocument.addEventListener('keydown',ev=>{if(ev.key==='Tab'){const box=document.querySelector('.modal')||document.querySelector('.drawer');if(box){const nodes=[...box.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex=\"0\"],summary')].filter(node=>node.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(nodes.length&&ev.shiftKey&&(document.activeElement===first||!box.contains(document.activeElement))){ev.preventDefault();last.focus()}else if(nodes.length&&!ev.shiftKey&&(document.activeElement===last||!box.contains(document.activeElement))){ev.preventDefault();first.focus()}}}if(ev.key==='Escape'){if(document.getElementById('modalRoot').innerHTML)closeModal();else if(drawerId)closeDrawer();else document.body.classList.remove('full-table')}});\nwindow.addEventListener?.('beforeunload',ev=>{if(drawerTab==='fields'&&equipmentEditSnapshot!==null&&equipmentFormSnapshot()!==equipmentEditSnapshot){ev.preventDefault();ev.returnValue=''}});\nconst columnFilters={};let filterKey=null,filterDraft=new Set(),filterQuery='';\nconst columnPresets={owner:['PTE','TD','QRA'],module:['PTE','TD','QRA'],area:['Bench','C1 LAB','CP','DEVICE WA'],user:['PTE','DEVICE','QRA'],vendor:['Eoulu','TEL','广立微'],name:['Eoulu_F1_Probe_EFA','First Set Kit','KOV2-210B-F3'],tool:['Common','Unique'],origin:['马来西亚/泰国','日本','中国'],category:['2pc Previous EC cover 2pc need new EC','new EC','Previews EC cover']};\nfunction columnKeys(){return ['name','equipmentType','equipmentModel','currentStage','owner','module','area','sponsor','user','vendor','tool','count','origin','kcny','rmid','po','hookup','usd','year','category']}\nfunction columnValues(e,k){if(k==='classification')return[[e.equipmentType,e.equipmentModel].filter(Boolean).join(' / ')];if(k==='status')return[statusNames[overall(e)]];if(k==='quantities')return[`${e.count} / ${ordered(e)} / ${arrived(e)} / ${ready(e)}`];if(k==='milestones')return milestones.filter(m=>Object.hasOwn(e.needs,m.id)).map(m=>m.name);if(k==='po')return[poValue(e)];if(k==='usd')return[(e.kcny/state.rate/1000).toFixed(3)];if(k==='kcny')return[e.kcny.toFixed(2)];if(k==='hookup')return[Number(e.hookup).toFixed(3)];return[String(e[k]??'')]}\nfunction passesColumns(e){return Object.entries(columnFilters).every(([k,values])=>{if(!columnKeys().includes(k)&&k!=='classification')return true;if(k==='user')return values.some(value=>value?userMatches(e.user,value):!e.user);const list=columnValues(e,k);return(list.length?list:['']).some(v=>values.includes(v))})}\nfunction statusHelp(){return `\u003cspan class=\"status-help\" tabindex=\"0\" aria-label=\"准备状态判定规则\" aria-describedby=\"statusRules\">?\u003cspan class=\"status-rules\" id=\"statusRules\" role=\"tooltip\">\u003cstrong>每个阶段\u003c/strong>\u003cbr>已备齐：已准备数量 ≥ 需要数量。\u003cbr>未备齐：已准备数量 ＜ 需要数量。\u003cbr>待填写：任一必要数量未填写。\u003cbr>\u003cbr>\u003cstrong>设备准备状态\u003c/strong>\u003cbr>任一关联阶段未备齐 → 未备齐。\u003cbr>没有未备齐阶段，但有未填写数量 → 待填写。\u003cbr>全部关联阶段已备齐 → 已备齐。\u003cbr>未关联里程碑 → 待填写。\u003cbr>\u003cbr>还缺数量 = 需要数量 − 已准备数量，最低为 0。未备齐不代表延期。\u003c/span>\u003c/span>`}\nfunction enhanceColumns(){if(page!=='wbs')return;const table=document.querySelector('#tableContent table');if(!table)return;const keys=equipmentDisplayKeys();state.columnWidths ||= {};let colgroup=document.createElement('colgroup');keys.forEach((k,i)=>{const col=document.createElement('col');col.style.width=(state.columnWidths[k]||(i===0?260:['po','category'].includes(k)?270:180))+'px';colgroup.appendChild(col)});table.prepend(colgroup);table.style.tableLayout='fixed';const headers=table.querySelectorAll('thead th');headers.forEach((th,i)=>{const k=keys[i],label=th.textContent;th.innerHTML=`\u003cspan class=\"column-label\" title=\"${esc(label)}\">${esc(label)}\u003c/span>\u003cbutton class=\"filter-trigger ${columnFilters[k]?'active':''}\" data-filter=\"${k}\" aria-label=\"筛选 ${esc(label)}\" title=\"筛选 ${esc(label)}\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M4 5h16l-6 7v6l-4 2v-8z\"/>\u003c/svg>\u003c/button>\u003cspan class=\"column-resizer\" data-resize=\"${k}\" tabindex=\"0\" role=\"separator\" aria-label=\"调整 ${esc(label)} 列宽\" aria-orientation=\"vertical\" aria-valuemin=\"90\" aria-valuemax=\"800\" aria-valuenow=\"${parseInt(colgroup.children[i].style.width)}\">\u003c/span>`});syncTableWidth(table);const old=document.getElementById('columnFilterSummary');if(old)old.remove();if(Object.keys(columnFilters).length){const bar=document.createElement('div');bar.id='columnFilterSummary';bar.className='column-filter-summary';bar.innerHTML=`\u003cspan>已筛选：${Object.keys(columnFilters).map(k=>esc(k==='classification'?'类型／型号':fieldLabels[k]||k)).join('、')}\u003c/span>\u003cbutton class=\"link\" onclick=\"clearColumnFilters()\">清除全部列筛选\u003c/button>`;table.closest('#tableContent').prepend(bar)}}\nfunction syncTableWidth(table){table.style.width=[...table.querySelectorAll('col')].reduce((n,c)=>n+parseInt(c.style.width),0)+'px'}\nfunction setColumnWidth(key,width){const table=document.querySelector('#tableContent table');if(!table)return;const i=equipmentDisplayKeys().indexOf(key);if(i\u003c0)return toast('当前表格没有此列');const value=Math.max(90,Math.min(800,Math.round(width)));state.columnWidths[key]=value;table.querySelectorAll('col')[i].style.width=value+'px';table.querySelector(`[data-resize=\"${key}\"]`).setAttribute('aria-valuenow',value);syncTableWidth(table)}\nfunction clearColumnFilters(){Object.keys(columnFilters).forEach(k=>delete columnFilters[k]);closeColumnFilter();renderTableOnly()}\nfunction closeColumnFilter(){document.getElementById('columnFilterPopup')?.remove();filterKey=null}\nfunction filterOptions(){const presets=filterKey==='user'?[...userRoots(),...equipmentCatalog().users.flatMap(item=>item.children)]:filterKey==='equipmentType'?equipmentTypes():filterKey==='equipmentModel'?equipmentTypes().flatMap(equipmentModels):filterKey==='currentStage'?equipmentStages():columnPresets[filterKey]||[];return [...new Set([...presets,...state.equipment.flatMap(e=>{const v=columnValues(e,filterKey);return v.length?v:['']})])].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true})).filter(v=>(v||'空白').toLowerCase().includes(filterQuery.toLowerCase()))}\nfunction showFilterOptions(){const list=document.getElementById('columnOptions');if(!list)return;list.innerHTML=filterOptions().map(v=>`\u003clabel class=\"column-option\">\u003cinput type=\"checkbox\" data-value=\"${esc(v)}\" ${filterDraft.has(v)?'checked':''}>\u003cspan>${esc(v||'（空白）')}\u003c/span>\u003c/label>`).join('')||'\u003cdiv class=\"empty <script>

  if(!confirmCaseCreationExit()||!confirmTemplatePageExit())return;
  let previous=navigationHistory.pop();
  while(previous?.state.page==='notifications')previous=navigationHistory.pop();
  closeModal(false);closeDrawer();
  if(previous){Object.assign(ui,{projectId:null,caseMetricFromCard:false,workStatus:null},previous.state);if(findProject(db,previous.projectId))db.selectedProject=previous.projectId;}
  else Object.assign(ui,{page:'cases',projectId:null,caseId:null,taskId:null,query:'',filter:'',caseOwner:'',caseBlocked:false,caseMetricFromCard:false,caseOverdue:false,caseExpanded:[],caseView:'list',ganttCaseId:'',summaryProjectIds:null});
  restoreTemplatePage(previous?.libraryContext);

  const main=document.querySelector('.main');
  if(main){main.scrollTop=previous?.scrollTop||0;main.scrollLeft=previous?.scrollLeft||0;}
  const summaryScroll=document.getElementById('projectSummaryTable')?.parentElement;if(summaryScroll)summaryScroll.scrollLeft=previous?.summaryScrollLeft||0;
  const timeline=document.querySelector('.gantt-scroll');if(timeline){timeline.scrollTop=previous?.ganttScrollTop||0;timeline.scrollLeft=previous?.ganttScrollLeft||0;}
  [...document.querySelectorAll('.main .table-scroll')].forEach((element,index)=>{const saved=previous?.tableScrolls?.[index];if(saved){element.scrollLeft=saved.left;element.scrollTop=saved.top;}});
  if(previous?.templateContext){restoreTemplateHistory(previous.templateContext);return;}
  if(previous?.reportTaskContext){reportTaskDetail(previous.reportTaskContext.reportId,previous.reportTaskContext.taskId);return;}
  if(previous?.sourceDrawer){openObject(previous.sourceDrawer.kind,previous.sourceDrawer.id);return;}
  const returnFocus=previous?.returnFocusId?document.getElementById(previous.returnFocusId):null;

function changeWorkspaceFilter(field,value){

    if(!['all','unassigned'].includes(value)&&!summaryProjects().some(entry=>entry.project.id===value)){document.getElementById('workspaceFilterError').textContent='Project 不存在或无权查看';return;}
    draft.scope=value==='all'?null:[value];

    draft[field]=value;

function resetWorkspaceFilter(){

function applyWorkspaceFilter(){
  const editor=workspaceFilterState;
  try{
    check(editor&&editor.mode===ui.page,'筛选窗口已失效，请重新打开');
    const draft=editor.draft,ids=summaryProjects().map(entry=>entry.project.id);
    check(['owner','status','caseId'].every(key=>typeof draft[key]==='string')&&['blocked','overdue','fromCard'].every(key=>typeof draft[key]==='boolean'),'筛选条件格式无效');
    check(draft.scope===null||Array.isArray(draft.scope)&&draft.scope.every(id=>id==='unassigned'||ids.includes(id)),'所选 Project 不存在或无权查看，请重新选择');
    check(!draft.status||(editor.mode==='cases'?sharedStatusOptions:taskStatusOptions).some(([value])=>value===draft.status),'筛选状态无效');
    check(!draft.fromCard||editor.mode==='cases'&&selectedCaseMetric(draft)!=='all'&&Object.hasOwn(caseMetricLabels,selectedCaseMetric(draft)),'统计卡片来源无效，请重新选择状态');
    check(!draft.caseId||listCases(draft.scope).some(item=>item.id===draft.caseId),'所选 Case 不在范围内或无权查看，请重新选择');
  }catch(error){if(editor)document.getElementById('workspaceFilterError').textContent=error.message;else toast(error.message);return;}

  else Object.assign(ui,{taskOwner:draft.owner,taskStatus:draft.status,taskCaseId:draft.caseId,taskOverdue:draft.overdue});
  closeWorkspaceFilter(false);render();document.getElementById('workspaceFilterButton')?.focus({preventScroll:true});
}
function removeWorkspaceFilter(key){
  if(!['cases','gantt'].includes(ui.page)||!['all','scope','owner','status','caseId','blocked','overdue'].includes(key))return toast('筛选条件不存在');
  const cases=ui.page==='cases';
  if(key==='blocked'&&!cases||key==='caseId'&&cases)return toast('筛选条件不适用于当前视图');
  if(cases&&['all','status','blocked','overdue'].includes(key))ui.caseMetricFromCard=false;
  if(key==='scope'||key==='all')applyWorkspaceProjectScope(null);
  if(key==='owner'||key==='all')ui[cases?'caseOwner':'taskOwner']='';
  if(key==='status'||key==='all')ui[cases?'filter':'taskStatus']='';
  if(key==='caseId'||key==='all'&&!cases)ui.taskCaseId='';
  if(key==='blocked'||key==='all'&&cases)ui.caseBlocked=false;
  if(key==='overdue'||key==='all')ui[cases?'caseOverdue':'taskOverdue']=false;
  render();document.getElementById('workspaceFilterButton')?.focus({preventScroll:true});
}
function closeWorkspaceFilter(restoreFocus=true){

function latestReturnFeedback(item){
  const candidates=(item.history||[]).map((record,index)=>{
    if(record.reviewOutcome==='passed')return null;
    const match=String(record.text||'').match(/^(?:退回修改(?:\s*·\s*第\s*\d+\s*级)?|退回)\s*[：:]\s*([\s\S]*)$/);
    if(record.reviewOutcome!=='returned'&&!match)return null;
    if(Number.isInteger(record.round)&&Number.isInteger(item.round)&&record.round!==item.round)return null;
    return {record,index,note:typeof record.reviewNote==='string'?record.reviewNote:match?.[1]||''};
  }).filter(Boolean).sort((a,b)=>String(b.record.timestamp||b.record.at||'').localeCompare(String(a.record.timestamp||a.record.at||''))||a.index-b.index);
  const latest=candidates[0];return latest?{note:latest.note,actor:latest.record.actor||'未记录',at:latest.record.timestamp||latest.record.at||'未记录'}:null;
}

async function readLocalAttachmentFiles(files,existing){
  check(files.every(file=>file.size<=750*1024),'单份文件不能超过 750 KB');
  check(files.reduce((total,file)=>total+file.size,0)+existing.reduce((total,file)=>total+file.size,0)<=2*1024*1024,'本次文件合计不能超过 2 MB');
  return Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({id:makeId('file'),name:file.name,size:file.size,type:file.type,data:reader.result});reader.onerror=()=>reject(Error('文件读取失败：'+file.name));reader.readAsDataURL(file);})));
}
async function readEvidenceFiles(input){
  const form=input.closest('form');if(!form||form!==document.getElementById('dialogForm'))return toast('上传界面已关闭，请重新打开');
  if(form.dataset.filesLoading==='true'){document.getElementById('modalError').textContent='请等待当前附件读取完成';return;}
  form.dataset.filesLoading='true';renderPendingFiles();
  try{
    const loaded=await readLocalAttachmentFiles([...input.files],pendingFiles);
    if(document.getElementById('dialogForm')!==form)return;
    pendingFiles.push(...loaded);document.getElementById('modalError').textContent='';
  }catch(error){if(document.getElementById('dialogForm')===form)document.getElementById('modalError').textContent=error.message;}
  finally{input.value='';if(document.getElementById('dialogForm')===form){form.dataset.filesLoading='false';renderPendingFiles();}}
}

    if(previous!==current.owner){const record=recordAssignment(db,'project',current,CURRENT_USER,previous,'调整 Project 负责人','edit',before);linkResponsibilityEvent(current,adjustment,record);}
  },'Project设置已保存'));
}
function permissionModal(){if(!can('settings'))return toast('没有设置权限');modal('分级权限配置',`<table><thead><tr><th>角色</th><th>查看范围</th><th>创建与管理</th><th>模版配置</th><th>设置</th></tr></thead><tbody>${Object.entries(db.permissions).map(([role,policy])=>`<tr><td>${escapeHtml(roleLabel(role))}</td><td><select name="${role}-view"><option value="assigned" ${policy.view==='assigned'?'selected':''}>参与对象</option><option value="all" ${policy.view==='all'?'selected':''}>全部范围</option></select></td>${['caseEdit','template','settings'].map(key=>`<td><input type="checkbox" aria-label="${role} ${key}" name="${role}-${key}" ${policy[key]?'checked':''} ${role==='leader'&&key==='settings'?'disabled':''}></td>`).join('')}</tr>`).join('')}</tbody></table><div class="note" style="margin-top:15px">创建与管理保留原创建、Task编辑、删除及终止权限；编辑Case仅由当前Owner在允许状态下操作。只有设置权限人员可保存配置，生产授权需在服务端执行。</div><div class="fields" style="margin-top:15px">${peopleSelect('preview','王宇','权限范围预览')}<div class="field"><label>查看结果</label><button type="button" onclick="previewPermission(document.querySelector('[name=preview]').value)">检查当前权限</button></div></div><div id="permissionPreview" class="small muted" style="margin-top:12px"></div>`,'保存权限',data=>handleOperation(()=>{requirePermission(db,CURRENT_USER,'settings');for(const role of Object.keys(db.permissions)){db.permissions[role]={...db.permissions[role],view:data[role+'-view'],caseEdit:!!data[role+'-caseEdit'],template:!!data[role+'-template'],settings:role==='leader'||!!data[role+'-settings']};}logEvent(db,null,'更新角色权限配置');},'权限配置已保存'),true);}
function previewPermission(actor){const cases=db.cases.filter(item=>visibleTo(db,actor,'case',item)),tasks=db.tasks.filter(item=>visibleTo(db,actor,'task',item)),policy=db.permissions[db.userRoles[actor]],editable=cases.filter(item=>!caseEditBlockReason(db,item,actor));document.getElementById('permissionPreview').textContent=`${actor}：可查看 ${cases.length} 个 Case、${tasks.length} 项 Task；当前可编辑本人 Case ${editable.length} 个；模版配置${policy.template?'允许':'不允许'}，创建与管理${policy.caseEdit?'允许':'不允许'}。` ;}
function singleFilePrototypeHTML(){
  equipmentDocument('embedded');
  const root=document.documentElement.cloneNode(true);
  for(const id of ['app','drawerRoot','modalRoot','toastRoot'])root.querySelector('#'+id).replaceChildren();
  root.querySelector('body').removeAttribute('class');
  const catalog=root.querySelector('#equipmentCatalogFrame');
  catalog.removeAttribute('src');catalog.removeAttribute('srcdoc');
  return '<!doctype html>\n'+root.outerHTML;
}
function downloadPrototype(){
  try{downloadText('WBS-DH-prototype.html',singleFilePrototypeHTML(),'text/html;charset=utf-8');toast('已生成单文件 HTML，包含设备页；不包含当前业务数据与附件。');}
  catch(error){toast('下载失败：'+error.message);}
}
function showHelp(){modal('原型演示说明',`<div class="stack"><p>这是可离线打开的单文件桌面端原型，设备页面已内置，无需其他 HTML 或压缩包。数据与上传文件保存在当前浏览器，下载仅包含演示程序，不构成业务数据备份或正式生产系统。</p><div class="notice">邮件与 Hems 仅生成模拟发送记录，不向外部系统实际发送。页面关闭时不会运行定时Task。</div><p class="small muted">当前为陈昊 / 超级管理员演示视角，可配置角色及责任权限。执行和验收仍受业务规则约束，弹窗会明确显示代办身份；生产系统需由服务端鉴权。</p><p class="small muted">仅调整未开始Task；下层全部验收后，负责人才能提交上层验收。Case、Task退回后重新走本对象全部验收。Project仅有进行中、待验收、已完成，不支持退回修改；负责人可撤回待验收Project，再次提交从首位验收人开始，下层已完成成果不自动重开。</p><div class="row"><button type="button" class="link" onclick="navTo('equipment')">查看内置设备 WBS</button><span class="muted">·</span><button type="button" class="link danger" onclick="resetDemo()">恢复初始演示数据</button></div></div>`,'关闭',closeModal);}
function resetDemo(){modal('恢复初始演示数据','<p>仅清除交付协同原型的本地修改与上传文件。原设备 WBS 数据不受影响。</p>','确认恢复',()=>{try{db=createSeed();addSummaryDemoProjects(db);addMyWorkDemoProject(db);addMyWorkCompletedExamples(db);addMyWorkStatusExamples(db);initializeAssignments(db);initializeSuperAdminSession(db);scanNotifications(db);persist();navigationHistory.length=0;Object.assign(ui,{page:'cases',caseId:null,taskId:null,query:'',filter:'',caseOwner:'',caseBlocked:false,caseMetricFromCard:false,caseOverdue:false,caseExpanded:[],caseView:'list',ganttCaseId:'',taskOwner:'',summaryQuery:'',summaryOwner:'',summaryStatus:'',summaryExpanded:[],summaryProjectIds:null,workStatus:null});closeDrawer();closeModal();render();toast('已恢复初始Case');}catch(error){toast(error.message);}});}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const caseMenu=document.getElementById('projectCaseAddMenu');if(caseMenu?.hidden===false){event.preventDefault();closeProjectCaseMenu(true);return;}if(notificationPopoverState){event.preventDefault();closeNotificationPopover();return;}if(workspaceFilterState){event.preventDefault();closeWorkspaceFilter();return;}if(taskRequirementEditorState){event.preventDefault();closeTaskRequirementEditor();return;}if(document.getElementById('modalRoot').innerHTML)closeModal();else closeDrawer();}if(event.key==='Tab'){const dialog=document.querySelector('.notification-popover')||document.querySelector('.workspace-filter-popover')||document.querySelector('.task-requirement-popover')||document.querySelector('.modal')||document.querySelector('.drawer');if(!dialog)return;const controls=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary')].filter(node=>node.getClientRects().length);if(!controls.length){if(notificationPopoverState){event.preventDefault();dialog.focus();}return;}const first=controls[0],last=controls.at(-1);if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}}});
render();
setInterval(()=>{try{const count=transact(()=>scanNotifications(db,false)+runScheduledReports(db));if(count&&ui.page==='reports')render();if(count&&notificationPopoverState)renderNotificationPopover();}catch(error){storageNotice='自动检查无法保存，请检查浏览器存储。';}},60000);
</script>
